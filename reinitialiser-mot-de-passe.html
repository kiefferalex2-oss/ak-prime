<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AK PRIME — Nouveau mot de passe</title><style>body{font-family:system-ui;background:#0d1827;color:white;display:grid;place-items:center;min-height:100vh;margin:0}main{background:#17283c;border:1px solid #30445a;padding:30px;border-radius:16px;width:min(430px,90vw)}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:9px;margin:10px 0;font:inherit}button{background:#d3ab62;border:0;font-weight:800;cursor:pointer}a{color:#d3ab62}#msg{min-height:28px}</style></head><body><main><h1>AK PRIME</h1><h2>Définir un nouveau mot de passe</h2><p>Choisis un nouveau mot de passe pour ton compte.</p><form id="f"><input type="password" id="pwd" autocomplete="new-password" minlength="12" placeholder="Nouveau mot de passe (12 caractères minimum)" required><input type="password" id="confirm" autocomplete="new-password" minlength="12" placeholder="Confirmer le mot de passe" required><button type="submit">Enregistrer mon mot de passe</button></form><p id="msg" role="status">Vérification du lien...</p><a href="/">Retour au site AK PRIME</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=window.supabase.createClient('https://gptvgldboqarfklorjip.supabase.co','sb_publishable_wvFEmkJCeJxDw8HhTmipaw_z2J9a8sx',{auth:{detectSessionInUrl:true}});const msg=document.getElementById('msg');let valid=false;async function check(){const u=new URL(location.href);const code=u.searchParams.get('code');if(code){const{error}=await client.auth.exchangeCodeForSession(code);if(error)msg.textContent='Lien invalide ou expiré : '+error.message;}const{data:{session}}=await client.auth.getSession();valid=!!session;if(valid){msg.textContent='Lien vérifié. Tu peux choisir ton mot de passe.';history.replaceState(null,'',location.pathname);}else if(!code)msg.textContent='Lien expiré ou invalide : redemande un e-mail depuis la connexion.';}client.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){valid=true;msg.textContent='Lien vérifié. Tu peux choisir ton mot de passe.';history.replaceState(null,'',location.pathname);}});check();document.getElementById('f').onsubmit=async e=>{e.preventDefault();if(!valid){msg.textContent='Ouvre le lien reçu par e-mail pour continuer.';return}const pw=document.getElementById('pwd').value;if(pw!==document.getElementById('confirm').value){msg.textContent='Les mots de passe ne correspondent pas.';return}if(pw.length<12){msg.textContent='Utilise au moins 12 caractères.';return}const{error}=await client.auth.updateUser({password:pw});if(error){msg.textContent='Erreur : '+error.message;return}msg.textContent='Mot de passe modifié. Tu peux retourner à la connexion.';await client.auth.signOut();document.getElementById('f').style.display='none';};</script></body></html>
