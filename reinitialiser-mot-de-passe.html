<!doctype html>
<html lang="fr">
<head><meta name="robots" content="noindex,nofollow,noarchive">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>AK PRIME — Activer votre espace</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 45% -15%,#1e3854 0%,#0b1726 58%,#08121e 100%);color:#e8eff7;display:grid;place-items:center;padding:22px}
    main{background:#13253b;border:1px solid #30445a;border-radius:19px;padding:34px;width:min(490px,100%);box-shadow:0 22px 75px #0005}
    .eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.17em;color:#d8b16d;margin:0 0 9px}
    .brand{font-size:1.9rem;font-weight:900;letter-spacing:.035em;color:#fff;margin:0 0 24px}.brand span{color:#d8b16d}
    h1{font-size:1.65rem;line-height:1.25;margin:0 0 12px}
    p{color:#bccbda;line-height:1.55;margin:0 0 20px}
    label{font-size:.86rem;font-weight:700;display:block;margin-top:15px}
    input,button,.login{font:inherit;border-radius:9px;padding:12px 14px}
    input{width:100%;border:1px solid #526579;background:#0c1b2c;color:#fff;margin-top:7px}
    input:focus{outline:2px solid #d8b16d;outline-offset:2px}
    button{width:100%;margin-top:22px;border:0;background:#d8b16d;color:#0e1a28;font-weight:850;cursor:pointer}
    button:disabled{opacity:.65;cursor:wait}
    #msg{border-radius:9px;padding:12px 14px;background:#20354b;color:#e5edf6;font-size:.9rem;margin:18px 0 0;min-height:45px}
    #msg.error{background:#47272d;color:#ffdce1;border:1px solid #a76169}
    #msg.success{background:#193d36;color:#ccf3df;border:1px solid #337b63}
    .hint{font-size:.83rem;color:#a9bcd0;margin-top:13px}
    .login{display:inline-block;text-decoration:none;color:#d8b16d;font-weight:750;margin-top:13px;padding:8px 0}
    .hidden{display:none}
    .footer{font-size:.73rem;color:#8fa5bc;border-top:1px solid #30445a;margin:27px 0 0;padding-top:16px}
  </style>
</head>
<body>
<main>
  <p class="eyebrow">ESPACE CLIENT SÉCURISÉ</p>
  <div class="brand">AK PRIME<span>.</span></div>
  <h1 id="heading">Choisir votre mot de passe</h1>
  <p id="intro">Validez votre lien personnel, puis définissez le mot de passe de votre espace AK PRIME.</p>
  <form id="f" class="hidden">
    <label for="pwd">Mot de passe (12 caractères minimum)</label>
    <input type="password" id="pwd" autocomplete="new-password" minlength="12" required>
    <label for="confirm">Confirmer le mot de passe</label>
    <input type="password" id="confirm" autocomplete="new-password" minlength="12" required>
    <button id="save" type="submit">Enregistrer mon mot de passe</button>
  </form>
  <p id="msg" role="status" aria-live="polite">Vérification de votre lien sécurisé…</p>
  <p id="extra" class="hint hidden"></p>
  <a class="login" href="/?connexion=1" id="loginLink">J’ai déjà un compte — me connecter</a>
  <p class="footer">AK PRIME ne demande jamais votre mot de passe par e-mail.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
 'use strict';
 const url=new URL(location.href);
 const hash=new URLSearchParams(location.hash.replace(/^#/,''));
 let mode=hash.get('type')||url.searchParams.get('type')||'';
 let valid=false, complete=false, pending=false;
 const byId=id=>document.getElementById(id);
 const client=window.supabase.createClient(
   'https://gptvgldboqarfklorjip.supabase.co',
   'sb_publishable_wvFEmkJCeJxDw8HhTmipaw_z2J9a8sx',
   {auth:{detectSessionInUrl:true}}
 );
 function message(text,kind=''){
   const node=byId('msg');node.textContent=text;
   node.className=kind;
 }
 function showMode(){
   if(mode==='recovery'){
     document.title='AK PRIME — Retrouver mon accès';
     byId('heading').textContent='Retrouver mon accès';
     byId('intro').textContent='Cette adresse possède déjà un compte AK PRIME. Si vous connaissez votre mot de passe, connectez-vous directement. Sinon, choisissez un mot de passe différent pour le remplacer.';
     byId('save').textContent='Modifier mon mot de passe';
     byId('extra').textContent='Pour un premier compte client, utilisez le lien d’activation de votre invitation AK PRIME, pas un lien de récupération.';
     byId('extra').classList.remove('hidden');
   }else if(mode==='invite'){
     document.title='AK PRIME — Créer mon mot de passe';
     byId('heading').textContent='Créer mon mot de passe';
     byId('intro').textContent='Bienvenue chez AK PRIME. Définissez votre premier mot de passe pour accéder à votre espace client.';
     byId('save').textContent='Créer mon mot de passe';
     byId('extra').classList.add('hidden');
   }else{
     document.title='AK PRIME — Définir mon mot de passe';
     byId('heading').textContent='Définir mon mot de passe';
     byId('intro').textContent='Confirmez votre lien personnel pour sécuriser l’accès à votre espace client.';
     byId('save').textContent='Enregistrer mon mot de passe';
     byId('extra').classList.add('hidden');
   }
 }
 function setValid(){
   if(complete)return;
   valid=true;
   byId('f').classList.remove('hidden');
   message('Lien sécurisé vérifié. Vous pouvez choisir votre mot de passe.');
   history.replaceState(null,'',location.pathname);
 }
 // Le type est extrait avant que Supabase consomme les paramètres d'authentification.
 client.auth.onAuthStateChange((event,session)=>{
   if(event==='PASSWORD_RECOVERY'){
     mode='recovery';showMode();setValid();
   }else if(event==='SIGNED_IN'&&session&&!valid){
     showMode();setValid();
   }
 });
 showMode();
 async function check(){
   const code=url.searchParams.get('code');
   if(code){
     const {error}=await client.auth.exchangeCodeForSession(code);
     if(error){message('Ce lien est expiré ou invalide. Demandez un nouvel e-mail depuis AK PRIME.','error');return;}
   }
   const {data:{session},error}=await client.auth.getSession();
   if(!error&&session)setValid();
   else if(!valid)message('Ce lien est expiré ou invalide. Demandez un nouvel e-mail depuis la connexion AK PRIME.','error');
 }
 check();
 byId('f').addEventListener('submit',async event=>{
   event.preventDefault();
   if(pending||complete)return;
   if(!valid){message('Ouvrez d’abord le lien sécurisé reçu par e-mail.','error');return;}
   const password=byId('pwd').value;
   if(password!==byId('confirm').value){message('Les deux mots de passe doivent être identiques.','error');return;}
   if(password.length<12){message('Le mot de passe doit comporter au moins 12 caractères.','error');return;}
   pending=true;byId('save').disabled=true;
   const {error}=await client.auth.updateUser({password});
   pending=false;byId('save').disabled=false;
   if(error){
     const code=String(error.code||'');
     const text=String(error.message||'');
     if(code==='same_password'||code==='new_password_should_be_different'||/same.password|different.*(old|previous|current)|identical.*password|mot de passe.*différent/i.test(text)){
       mode='recovery';showMode();
       message('Ce compte possède déjà ce mot de passe. Vous pouvez vous connecter avec lui, sans le changer. Sinon, choisissez-en un différent.','error');
     }else message('Modification impossible : '+text,'error');
     return;
   }
   complete=true;
   byId('f').classList.add('hidden');
   message(mode==='invite'
     ?'Votre mot de passe est créé. Votre espace AK PRIME est prêt : connectez-vous pour continuer votre questionnaire initial.'
     :'Votre mot de passe est enregistré. Vous pouvez maintenant vous connecter à AK PRIME.','success');
   await client.auth.signOut();
 });
})();
</script>
</body>
</html>
