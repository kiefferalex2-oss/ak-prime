             startDate:startMode==='date'?startDate:null,earlyStart,
             acceptedTerms:true,acceptedPrivacy:true,healthConsent:true,
             cgvVersion:'akprime-cgv-2026-10-20-firm-commitment'})
         });
         const data=await result.json().catch(()=>({}));
         if(!result.ok||!data.url)throw Error(data.error||'Paiement sécurisé indisponible');
         if(!/^https:\/\/checkout\.stripe\.com\//.test(data.url))throw Error('Lien Stripe inattendu');
         location.assign(data.url);return;
       }
       if(window.AKP_PUBLIC_TEST_MODE){
         if(p.source!=='server'||!p.offerCode)throw Error('Tarif serveur momentanément indisponible');
         submit.textContent='Ouverture de Stripe TEST…';
         if(typeof window.AKP_PUBLIC_TEST_REQUEST!=='function')
           throw Error('Le module de paiement TEST n’est pas chargé. Actualise la page (Ctrl+F5).');
         const result=await window.AKP_PUBLIC_TEST_REQUEST({
           // Toujours une nouvelle commande pour un nouveau clic sur une offre.
           // Le ticket de retour Stripe de l'achat précédent reste réservé au suivi.
           action:'direct_create',
           offerCode:p.offerCode,duration,paymentMode,
           fullName,email,startDate:startMode==='date'?startDate:null,
           acceptedTerms:true,acceptedPrivacy:true,healthConsent:true,earlyStart
         });
         if(!result?.url)throw Error(result?.error||'Stripe TEST n’a pas retourné de page de paiement.');
         if(!result.url.startsWith('https://checkout.stripe.com/'))throw Error('Adresse Stripe incorrecte');
         location.assign(result.url);
         return;
       }
       throw Error('Paiements réels désactivés : seule la simulation Stripe TEST est disponible.');
     }catch(err){
       errorBox.textContent='Paiement non ouvert : '+(err?.message||'Erreur inattendue')+'. Aucun débit n’a été confirmé.';
       errorBox.classList.add('show');
     }finally{
       const active=document.getElementById('futureStripeCheckout');if(active){active.disabled=false;active.textContent=window.AKP_PUBLIC_TEST_MODE?'Payer avec Stripe (TEST)':'Payer avec Stripe';}
     }
   };
 };
}

function bindPublicSite(){
 // Menu mobile uniquement sur le site vitrine ; les espaces connectés restent inchangés.
 const menuButton=document.getElementById('publicMobileToggle');
 const menuPanel=document.getElementById('publicMobileMenu');
 const menuWrap=document.querySelector('.public-site .public-nav-wrap');
 const closeMobileMenu=()=>{
  if(!menuButton||!menuPanel)return;
  menuPanel.hidden=true;
  menuButton.setAttribute('aria-expanded','false');
  menuButton.setAttribute('aria-label','Ouvrir le menu de navigation');
  const glyph=menuButton.querySelector('.public-mobile-menu-glyph');
  if(glyph)glyph.textContent='☰';
 };
 if(menuButton&&menuPanel){
  // L'annulation évite d'empiler les écouteurs si l'accueil est réaffiché après une déconnexion.
  if(window.akpPublicMobileNavEvents)window.akpPublicMobileNavEvents.abort();
  const controller=new AbortController();
  window.akpPublicMobileNavEvents=controller;
  menuButton.addEventListener('click',()=>{
   const willOpen=menuPanel.hidden;
   menuPanel.hidden=!willOpen;
   menuButton.setAttribute('aria-expanded',willOpen?'true':'false');
   menuButton.setAttribute('aria-label',willOpen?'Fermer le menu de navigation':'Ouvrir le menu de navigation');
   const glyph=menuButton.querySelector('.public-mobile-menu-glyph');
   if(glyph)glyph.textContent=willOpen?'✕':'☰';
  });
  menuPanel.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',closeMobileMenu));
  document.addEventListener('pointerdown',e=>{
   if(!menuPanel.hidden&&menuWrap&&!menuWrap.contains(e.target))closeMobileMenu();
  },{signal:controller.signal});
  document.addEventListener('keydown',e=>{
   if(e.key==='Escape'&&!menuPanel.hidden){
    closeMobileMenu();
    menuButton.focus();
   }
  },{signal:controller.signal});
  window.addEventListener('resize',()=>{
   if(window.innerWidth>1120&&!menuPanel.hidden)closeMobileMenu();
  },{signal:controller.signal});
 }
 document.getElementById('publicMobileLoginBtn')?.addEventListener('click',()=>{
  closeMobileMenu();
  openPublicLogin();
 });
 document.getElementById('publicLoginBtn')?.addEventListener('click',()=>openPublicLogin());
 document.getElementById('heroLoginBtn')?.addEventListener('click',()=>openPublicLogin());
 document.querySelectorAll('.publicPoleBtn').forEach(b=>b.onclick=()=>openPublicPoleDetails(b.dataset.pole));
 document.querySelectorAll('.publicOfferDetailCard').forEach(card=>{
  card.onclick=()=>openPublicOfferDetails(card);
  card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openPublicOfferDetails(card)}};
 });
 document.querySelectorAll('.publicOfferBtn').forEach(b=>b.onclick=()=>openPublicOfferCheckout(b));
 document.querySelectorAll('.publicLegalBtn').forEach(b=>b.onclick=()=>openPublicLegal(b.dataset.legal));
}

function showAuth(message='',isError=false){
 document.getElementById('root').innerHTML=renderPublicSite();
 bindPublicSite();
 const wantsLogin=new URLSearchParams(location.search).get('connexion')==='1';
 if(message||wantsLogin)openPublicLogin(message,isError);
 if(wantsLogin){
  const next=new URL(location.href);
  next.searchParams.delete('connexion');
  history.replaceState(null,'',next.pathname+next.search+next.hash);
 }
}

function setAuthMsg(msg,err){
 const el=document.getElementById('authMsg');if(!el)return;el.textContent=msg;el.className='auth-msg show'+(err?' err':'');
}
async function enterApp(user){
 authUser=user;
 const {data:profile,error}=await supa.from('profiles').select('id,role,full_name').eq('id',user.id).maybeSingle();
 if(error){showAuth('Connexion réussie mais profil inaccessible : '+error.message,true);return}
 authProfile=profile;
 if(!profile){showAuth('Profil utilisateur introuvable.',true);return}
 if(profile.role==='client'){
   await enterClientPortal(user,profile);
   return;
 }
 if(!['owner','coach'].includes(profile.role)){
   showClientPending('Ton compte existe mais aucun rôle AK PRIME utilisable ne lui est attribué.');
   return;
 }
 try{
   await loadSupabaseData();
   state.view='dashboard';
   // L'e-mail « Nouveau client » ouvre directement le dossier après connexion.
   const go=new URL(location.href),requestedClient=go.searchParams.get('coach_client');
   if(requestedClient&&/^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$/i.test(requestedClient)){
     if((db.clients||[]).some(x=>x.id===requestedClient)){
       state.clientId=requestedClient;state.view='client';state.tab='onboarding';
     }
     go.searchParams.delete('coach_client');
     history.replaceState(null,'',go.pathname+go.search+go.hash);
   }
   render();
   void refreshOwnerEmailSystemHealth();
   subscribeCalendarRealtime('coach');
 }catch(e){
   showAuth('Connexion réussie, mais impossible de charger la base AK PRIME : '+e.message,true);
 }
}
async function initAuth(){
 await loadPublicOfferCatalog();
 const {data:{session}}=await supa.auth.getSession();
 if(session?.user) await enterApp(session.user); else showAuth();
 supa.auth.onAuthStateChange(async(event,session)=>{
   if(event==='SIGNED_OUT'){if(calendarChannel){await supa.removeChannel(calendarChannel);calendarChannel=null}authUser=null;authProfile=null;clientPortalState=null;showAuth()}
 });
}
