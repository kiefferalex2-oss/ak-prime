<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AK PRIME — Coaching, Performance & Mental</title>
<style>
:root{
  --bg:#f3f6fa;--panel:#fff;--panel2:#f8fafc;--nav:#0d1827;--nav2:#13243a;--text:#101828;
  --muted:#667085;--line:#e3e8ef;--blue:#2f66f6;--blue2:#edf2ff;--gold:#d3ab62;--green:#15865d;
  --green2:#e5f7ef;--amber:#a86400;--amber2:#fff4d8;--red:#be3535;--red2:#fdeaea;--shadow:0 10px 32px rgba(16,24,40,.07)
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}.hidden{display:none!important}
.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}
.sidebar{background:linear-gradient(180deg,var(--nav),#091421 85%);color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{padding:0 8px 12px}.brand strong{display:block;font-size:25px;letter-spacing:.09em}.brand span{font-size:10px;letter-spacing:.23em;color:#8fa1b8}
.nav{display:flex;flex-direction:column;gap:7px}.nav button{border:0;background:transparent;color:#c7d1de;text-align:left;padding:12px 13px;border-radius:10px;cursor:pointer;font-weight:650}
.nav button:hover,.nav button.on{background:#1d4ed8;color:#fff}.nav .sep{height:1px;background:#1f3045;margin:8px 6px}
.sidebar-note{margin-top:auto;padding:12px;border:1px solid #24384e;border-radius:12px;background:#102033;font-size:12px;color:#aab8c8;line-height:1.45}
.topbar{height:70px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:10}
.crumb{font-size:14px;color:var(--muted)}.top-actions{display:flex;gap:9px;align-items:center}.top-actions input{width:230px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#16283d;color:#fff;font-size:13px;font-weight:800}
main{min-width:0}.content{padding:24px 26px 48px;max-width:1500px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.page-title{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.page-title h1{margin:0;font-size:29px}.page-title p{margin:4px 0 0;color:var(--muted);font-size:14px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}.btn.danger{background:var(--red2);color:var(--red)}.btn.small{padding:7px 10px;font-size:13px}
.input,.select,.textarea{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 11px;color:var(--text)}.textarea{width:100%;min-height:95px;resize:vertical}.input:focus,.select:focus,.textarea:focus{outline:2px solid #c9d6ff;border-color:#8ba6ff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:15px}.kpi{padding:17px 18px}.kpi .lab{font-size:12px;color:var(--muted)}.kpi .val{font-size:27px;font-weight:900;margin-top:5px}.kpi .sub{font-size:12px;color:var(--muted);margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}.grid31{display:grid;grid-template-columns:1.05fr 1.25fr 1.15fr;gap:13px}
.panel{padding:17px}.panel h2,.panel h3{margin:0 0 12px}.panel h3{font-size:16px}.muted{color:var(--muted)}.tiny{font-size:12px}
.toolbar{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar .input{flex:1;min-width:220px}
table{width:100%;border-collapse:collapse}th,td{padding:13px 15px;border-bottom:1px solid #edf0f4;text-align:left;font-size:14px}th{font-size:12px;color:var(--muted);background:#fbfcfe;text-transform:uppercase;letter-spacing:.03em}
.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:850}.status.green{background:var(--green2);color:var(--green)}.status.red{background:var(--red2);color:var(--red)}.status.amber{background:var(--amber2);color:var(--amber)}.status.blue{background:var(--blue2);color:var(--blue)}
.link{border:0;background:transparent;color:var(--blue);font-weight:800;cursor:pointer}
.list{display:flex;flex-direction:column;gap:8px}.item{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fbfcfe}.item strong{display:block;margin-bottom:4px}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.grow{flex:1}
.alert{border-left:4px solid var(--amber);background:#fffaf0;padding:11px 12px;border-radius:9px;margin-bottom:8px}.alert.blue{border-color:var(--blue);background:#f5f7ff}.alert.green{border-color:var(--green);background:#f1fbf6}
.client-head{padding:18px 20px;margin-bottom:11px;display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.person{display:flex;align-items:center;gap:14px}.photo{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#dbe5f1,#7c8ca2);color:#fff;font-weight:900;font-size:22px}.person h2{margin:0 0 5px}.meta{display:flex;gap:8px 12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border:1px solid var(--line);border-radius:11px;padding:10px}.metric span{font-size:11px;color:var(--muted)}.metric strong{display:block;margin-top:3px;font-size:14px}
.tabs{display:flex;gap:3px;padding:7px;margin-bottom:12px;overflow:auto}.tabs button{border:0;background:transparent;padding:10px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}.tabs button.on{background:var(--blue2);color:var(--blue);font-weight:850}
.accordion{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fbfcfe}.accordion>button{width:100%;border:0;background:transparent;padding:11px 12px;text-align:left;display:flex;justify-content:space-between;font-weight:800;cursor:pointer}.accordion .body{display:none;padding:0 12px 12px;line-height:1.5;font-size:14px}.accordion.open .body{display:block}
.check{display:flex;gap:8px;align-items:flex-start;margin:9px 0}.check input{margin-top:3px}
.section-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;font-weight:850}
.field{margin-bottom:11px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:750}.field .input,.field .select{width:100%}
.test-row{display:grid;grid-template-columns:1.2fr .8fr .7fr .9fr 1.4fr auto;gap:8px;align-items:center;border-bottom:1px solid #edf0f4;padding:10px 0}.test-row.header{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}
.spark{height:42px;display:flex;align-items:flex-end;gap:3px}.spark i{display:block;width:8px;background:#7390ff;border-radius:3px 3px 0 0}
.timeline{display:flex;flex-direction:column;gap:10px}.event{border-left:3px solid var(--blue);padding-left:11px}.event .date{font-size:11px;color:var(--muted);margin-bottom:2px}
.passport{background:linear-gradient(145deg,#0d1827,#142844);color:#fff;padding:22px}.passport .muted{color:#b9c6d5}.passport-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.passport .mini{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px}.passport .mini span{display:block;color:#b9c6d5;font-size:11px}.passport .mini strong{display:block;margin-top:4px}
.progress{height:8px;background:#e7ecf3;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--blue)}
.modal-wrap{position:fixed;inset:0;background:rgba(9,20,33,.58);display:grid;place-items:center;z-index:100;padding:20px}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.25)}.modal-head,.modal-foot{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-foot{border-top:1px solid var(--line);border-bottom:0}.modal-body{padding:18px 20px}.x{border:0;background:transparent;font-size:22px;cursor:pointer}
.backup{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);z-index:110;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}
.demo-banner{background:#fff4d8;color:#895d00;border-bottom:1px solid #efd38f;padding:8px 16px;text-align:center;font-size:12px;font-weight:750}

/* Passeport AK PRIME premium */
.premium-passport{background:radial-gradient(circle at 78% 0,#1d1b18 0,#0b121a 31%,#071018 76%);color:#edf2f7;border:1px solid #29333d;border-radius:20px;padding:20px;box-shadow:0 26px 70px rgba(0,0,0,.24);overflow:hidden}
.pp-topline{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}.pp-eyebrow{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#d7ad67;font-weight:900}.pp-title{font-size:30px;margin:4px 0 0;font-weight:950;letter-spacing:-.03em}.pp-motto{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#b98b4c;text-align:right;line-height:1.6}
.pp-card{background:linear-gradient(145deg,rgba(18,28,38,.96),rgba(9,17,24,.96));border:1px solid #2a3540;border-radius:15px;padding:15px;min-width:0}.pp-card h3{font-size:14px;margin:0 0 11px;color:#f5f7fa}.pp-muted{color:#93a2b2}.pp-tiny{font-size:11px}.pp-gold{color:#e3b86d}.pp-green{color:#5dd29e}.pp-amber{color:#f0bb67}.pp-red{color:#ef8585}
.pp-profile{display:grid;grid-template-columns:1.4fr .8fr .8fr .8fr;gap:10px;margin-bottom:10px}.pp-person{display:flex;gap:13px;align-items:center}.pp-avatar{width:70px;height:70px;border-radius:14px;border:1px solid #8b6a38;background:linear-gradient(145deg,#32404d,#121a22);display:grid;place-items:center;font-size:24px;font-weight:950;color:#e5bc79;flex:0 0 auto}.pp-name{font-size:22px;font-weight:950}.pp-tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pp-tag{font-size:10px;padding:5px 7px;border-radius:999px;border:1px solid #38434d;background:#121d27;color:#bcc8d3}
.pp-stat{border-left:1px solid #2d3742;padding-left:14px}.pp-stat span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8191a1}.pp-stat strong{display:block;margin-top:7px;font-size:14px}.pp-engagement{border-color:#8b6a38;background:linear-gradient(145deg,rgba(61,46,25,.46),rgba(19,20,20,.95))}
.pp-grid3{display:grid;grid-template-columns:1.25fr 1.1fr .95fr;gap:10px;margin-top:10px}.pp-grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:10px;margin-top:10px}.pp-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.pp-chart{width:100%;height:auto;display:block;min-height:190px}.pp-chart text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.pp-chart-grid{stroke:#283440;stroke-width:1}.pp-chart-axis{fill:#758595;font-size:9px}.pp-chart-value{fill:#f0bf73;font-size:9px;font-weight:800}
.pp-kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pp-kpi{background:#111c25;border:1px solid #283440;border-radius:10px;padding:10px}.pp-kpi span{display:block;font-size:9px;color:#8191a1;text-transform:uppercase;letter-spacing:.05em}.pp-kpi strong{display:block;font-size:16px;margin-top:4px}.pp-kpi small{font-size:10px;color:#8394a4}
.pp-progress{height:8px;background:#28313a;border-radius:99px;overflow:hidden;margin-top:12px}.pp-progress i{display:block;height:100%;background:linear-gradient(90deg,#bc8740,#efc476);border-radius:99px}.pp-cycle-title{font-size:17px;font-weight:900;margin-bottom:6px}
.pp-list{display:flex;flex-direction:column;gap:8px}.pp-list-row{padding:9px 10px;border:1px solid #27333d;border-radius:10px;background:#0e1821}.pp-list-row strong{font-size:12px}.pp-list-row .pp-muted{font-size:10px;margin-top:3px}
.pp-timeline{display:flex;align-items:flex-start;gap:0;overflow:auto;padding:10px 2px 4px}.pp-node{min-width:135px;position:relative;padding:19px 9px 0}.pp-node:before{content:"";position:absolute;top:5px;left:0;right:0;height:2px;background:#3a4651}.pp-node:first-child:before{left:50%}.pp-node:last-child:before{right:50%}.pp-node:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;top:1px;left:calc(50% - 5px);background:#e5b96f;box-shadow:0 0 0 4px rgba(229,185,111,.08)}.pp-node strong{display:block;font-size:11px;text-align:center}.pp-node span{display:block;font-size:9px;text-align:center;color:#778899;margin-top:4px}
.pp-pill{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900}.pp-pill.good{background:#143529;color:#6fe0ad}.pp-pill.warn{background:#3a2c18;color:#f1be6b}.pp-pill.neutral{background:#172432;color:#9db0c3}
.pp-empty{display:grid;place-items:center;min-height:170px;color:#778899;font-size:12px;text-align:center;padding:20px}.pp-actions{display:flex;gap:8px;justify-content:flex-end;margin:0 0 10px}.pp-actions .btn.ghost{background:#111b24;border-color:#34414c;color:#eef3f7}
.client-nav{display:flex;gap:6px;align-items:center}.client-nav button{border:1px solid #2d3b49;background:#101e2d;color:#afbecc;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer}.client-nav button.on{background:#d5aa63;border-color:#d5aa63;color:#0b1218}.client-engagement{margin-top:13px;border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line)}.client-engagement.warn{background:#fff9ed;border-color:#efd39c}.client-engagement.end{background:#fff1f1;border-color:#efb4b4}.premium-client-main{max-width:1450px}
@media(max-width:1100px){.pp-profile{grid-template-columns:1.3fr 1fr}.pp-grid3{grid-template-columns:1fr 1fr}.pp-grid4{grid-template-columns:1fr 1fr}}

@media(max-width:780px){.app{grid-template-columns:1fr}.sidebar{display:none}.content{padding:15px 11px 40px}.topbar{padding:0 13px}.top-actions input{display:none}.kpis,.grid2{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr}.test-row{grid-template-columns:1fr 1fr}.test-row.header{display:none}.passport-grid{grid-template-columns:1fr}}

.public-site{min-height:100vh;background:#08111d;color:#fff}
.public-nav-wrap{position:sticky;top:0;z-index:90;background:rgba(8,17,29,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}

async function persistPath(client,path,value){

   }
   const map={title:'title',start:'start_date',end:'end_date',priorities:'priorities',vigilance:'vigilance'};
   const field=map[k];if(!field)return;
   if(!client.cycle._id){
     const row={client_id:client.id,title:client.cycle.title||'Cycle actuel',start_date:client.cycle.start||client.start||new Date().toISOString().slice(0,10),end_date:client.cycle.end||null,priorities:client.cycle.priorities||null,vigilance:client.cycle.vigilance||null,status:'active'};
     const {data,error}=await supa.from('cycles').insert(row).select().single();if(error)throw error;client.cycle._id=data.id;
   }else{
     const {error}=await supa.from('cycles').update({[field]:value||null}).eq('id',client.cycle._id);if(error)throw error;
   }
   return;
 }

function fmtDate(v){if(!v)return '—';const p=String(v).slice(0,10).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:v}
function localDateISO(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return y+'-'+m+'-'+day}
function fmtDateTime(v){if(!v)return '—';return new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Paris'}).format(new Date(v))}
function fmtTime(v){if(!v)return '—';return new Intl.DateTimeFormat('fr-FR',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Paris'}).format(new Date(v))}
function daysUntil(dateStr){
 if(!dateStr)return null;
 const a=new Date(localDateISO()+'T12:00:00Z'),b=new Date(String(dateStr).slice(0,10)+'T12:00:00Z');
 return Math.ceil((b-a)/86400000);
}
function addMonthsISO(dateStr,months){
 if(!dateStr)return '';
 const [y,m,d]=String(dateStr).slice(0,10).split('-').map(Number);
 const base=new Date(Date.UTC(y,m-1,1,12));
 base.setUTCMonth(base.getUTCMonth()+months);
 const last=new Date(Date.UTC(base.getUTCFullYear(),base.getUTCMonth()+1,0,12)).getUTCDate();
 base.setUTCDate(Math.min(d,last));
 return base.toISOString().slice(0,10);
}

function offerBaseMonthlyPrice(pole,offer){
 const catalogPrice=publicCatalogPrice(pole,offer,0);
 if(catalogPrice)return catalogPrice;
 const p=String(pole||'').toLowerCase(),o=String(offer||'').toLowerCase();
 if(p.includes('forme')){
   if(o.includes('renfor'))return 149;
   if(o.includes('standard'))return 99;
 }
 if(p.includes('performance')){
   if(/\bp3\b/.test(o))return 299;
   if(/\bp2\b/.test(o))return 199;
   if(/\bp1\b/.test(o))return 149;
 }
 if(p.includes('mental')){
   if(o.includes('sportif'))return 249;
   if(o.includes('particulier'))return 199;
 }
 return null;
}
function publicOfferCode(pole,offer){
 const p=String(pole||'').toLowerCase(),o=String(offer||'').toLowerCase();
 if(p.includes('forme')){
   if(o.includes('renfor'))return 'forme_renforce';
   if(o.includes('standard'))return 'forme_standard';
 }
 if(p.includes('performance')){
   if(/\bp3\b/.test(o))return 'performance_p3';
   if(/\bp2\b/.test(o))return 'performance_p2';
   if(/\bp1\b/.test(o))return 'performance_p1';
 }
 if(p.includes('mental')){
   if(o.includes('sportif'))return 'mental_sportif';
   if(o.includes('particulier'))return 'mental_particulier';
 }
 return '';
}
function euro(v){
 return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:Number.isInteger(Number(v))?0:2,maximumFractionDigits:2}).format(Number(v)||0);
}
function renewalPriceDetails(client,decision,paymentMode){
 const base=offerBaseMonthlyPrice(client?.current_pole,client?.current_offer);
 if(!base)return null;
 if(decision==='3_months'){
   const monthlyTotal=base*3;
   const upfrontTotal=Math.round(monthlyTotal*.97*100)/100;
   return paymentMode==='upfront'
     ? {headline:euro(upfrontTotal)+' comptant',detail:'au lieu de '+euro(monthlyTotal)+' • remise comptant 3 %',base}
     : {headline:euro(base)+' / mois',detail:'pendant 3 mois • total '+euro(monthlyTotal),base};
 }
 if(decision==='6_months'){
   const discountedMonthly=Math.round(base*.95*100)/100;
   const monthlyTotal=Math.round(discountedMonthly*6*100)/100;
   const upfrontTotal=Math.round(monthlyTotal*.98*100)/100;
   return paymentMode==='upfront'
     ? {headline:euro(upfrontTotal)+' comptant',detail:'tarif 6 mois -5 %, puis remise comptant 2 % • au lieu de '+euro(base*6),base}
     : {headline:euro(discountedMonthly)+' / mois',detail:'pendant 6 mois • total '+euro(monthlyTotal)+' • remise engagement 6 mois 5 %',base};
 }
 if(decision==='monthly'){
   return {headline:'Tarif sans engagement à finaliser',detail:'Le tarif mensuel sans engagement sera fixé avant l’activation du paiement. Ton offre actuelle est à '+euro(base)+' / mois avec engagement.',base};
 }
 return null;
}

function coachNotifications(){
 const out=[],reads=notificationReadSet(db.notificationReads),now=new Date();
 for(const cl of db.clients||[]){
   if(cl.questionnaireStatus==='submitted'&&cl.onboarding?.currentStep==='visio'){
     out.push({key:'coach:questionnaire:'+(cl.questionnaireResponseId||cl.id),title:'Questionnaire reçu — '+cl.name,detail:'Le questionnaire initial est envoyé. Prépare la visio et les points à approfondir.',target:'client',clientId:cl.id,tab:'onboarding',priority:3});
   }
   for(const w of cl.checkins||[]){
     if(!w.reviewedAt)out.push({key:'coach:checkin:'+w.id,title:'Nouveau bilan — '+cl.name,detail:'Check-in du '+fmtDate(w.date)+' à traiter.',target:'client',clientId:cl.id,tab:'follow',priority:4});
   }
   if(cl.end&&daysUntil(cl.end)<=14&&!(cl.renewals||[]).some(r=>r.dueDate===cl.end)){
     const choice=(cl.renewalChoices||[]).find(r=>r.dueDate===cl.end);
     if(choice)out.push({key:'coach:renewal-choice:'+choice.id,title:'Choix de renouvellement reçu — '+cl.name,detail:renewalDecisionLabel(choice.decision)+(choice.paymentMode?' • '+renewalPaymentLabel(choice.paymentMode):'')+'. Échéance '+fmtDate(cl.end)+'.',target:'client',clientId:cl.id,tab:'admin',priority:5});
     else out.push({key:'coach:renewal:'+cl.id+':'+cl.end,title:'Renouvellement — '+cl.name,detail:'Fin d’engagement le '+fmtDate(cl.end)+'. Le client doit encore choisir la suite.',target:'client',clientId:cl.id,tab:'admin',priority:5});
   }
   if(cl.status==='Actif'){
     const upcoming=(db.appointments||[]).some(a=>a.client_id===cl.id&&['scheduled','confirmed'].includes(a.status)&&new Date(a.starts_at)>now);
     if(!upcoming){
       out.push({key:'coach:no-visio:'+cl.id+':'+localDateISO().slice(0,7),title:'Aucune prochaine visio — '+cl.name,detail:'Ce client actif n’a actuellement aucune visio planifiée.',target:'client',clientId:cl.id,tab:'overview',priority:1});
     }
   }
 }
 for(const a of db.appointments||[]){
   if(['scheduled','confirmed'].includes(a.status)&&new Date(a.starts_at)<now){
     out.push({key:'coach:close-visio:'+a.id,title:'Visio à clôturer — '+a.clientName,detail:fmtDateTime(a.starts_at)+' • marque-la réalisée ou absent.',target:'calendar',priority:5});
   }
 }
 return out.map(n=>({...n,read:reads.has(n.key)})).sort((a,b)=>(b.priority-a.priority)||Number(a.read)-Number(b.read));
}
function clientNotifications(s){
 const out=[],reads=notificationReadSet(s?.notificationReads),c=s?.client||{},now=new Date();
 if(s?.template&&s?.response?.status!=='submitted'){
   out.push({key:'client:questionnaire:'+(s.template.template_key||s.template.id||'initial'),title:'Questionnaire initial à compléter',detail:'Complète-le pour préparer ton accompagnement.',target:'suivi',priority:4});
 }
 const friday=currentWeekFriday(),checkin=(s?.checkins||[]).find(x=>String(x.week_date).slice(0,10)===friday);
 if(!checkin)out.push({key:'client:checkin:'+friday,title:'Bilan hebdomadaire à envoyer',detail:'Ton retour permet à Alex d’adapter la semaine suivante.',target:'suivi',priority:3});
 for(const w of s?.checkins||[]){
   if(w.reviewed_at&&(w.coach_feedback||w.coach_decision)){
     out.push({key:'client:feedback:'+w.id,title:'Nouveau retour coach',detail:'Alex a traité ton bilan du '+fmtDate(String(w.week_date).slice(0,10))+'.',target:'suivi',priority:3});
   }
 }
 const next=(s?.appointments||[]).find(a=>['scheduled','confirmed'].includes(a.status)&&new Date(a.starts_at)>now);
 if(next){
   const h=hoursUntil(next.starts_at);
   if(h>0&&h<=3)out.push({key:'client:visio3:'+next.id,title:'Visio dans quelques heures',detail:'Rendez-vous à '+fmtDateTime(next.starts_at)+'.',target:'visios',priority:5});
   else if(h>3&&h<=24)out.push({key:'client:visio24:'+next.id,title:'Visio dans moins de 24 h',detail:'Rendez-vous à '+fmtDateTime(next.starts_at)+'.',target:'visios',priority:4});
 }
 const end=isoDate(c.engagement_end_date),d=end?daysUntil(end):null;
 if(d!==null&&d<=14){
   const choice=(s?.renewalChoices||[]).find(r=>isoDate(r.due_date)===end);
   if(!choice){
     out.push({key:'client:renewal-choice:'+end,title:'Choisis la suite de ton accompagnement',detail:d<0?'Ton engagement est arrivé à échéance. Indique maintenant ce que tu souhaites faire.':d===0?'Ton engagement se termine aujourd’hui. Choisis la suite avant tout nouveau paiement.':'Ton engagement se termine dans '+d+' jour(s). Choisis 3 mois, 6 mois, mensuel ou arrêt.',target:'home',priority:5});
   }else{
     out.push({key:'client:engagement:'+end,title:'Choix de renouvellement enregistré',detail:renewalDecisionLabel(choice.decision)+(choice.payment_mode?' • '+renewalPaymentLabel(choice.payment_mode):'')+'. Aucun nouveau paiement n’est déclenché pour le moment.',target:'home',priority:2});
   }
 }
 return out.map(n=>({...n,read:reads.has(n.key)})).sort((a,b)=>(b.priority-a.priority)||Number(a.read)-Number(b.read));
}

async function markNotificationRead(key,mode){

 const {error}=await supa.from('notification_reads').upsert(row,{onConflict:'user_id,notification_key'});
 if(error){toast('Erreur notification : '+error.message);return}
 const target=mode==='coach'?db:clientPortalState;target.notificationReads=target.notificationReads||[];

async function markAllNotificationsRead(mode,list){

 const now=new Date().toISOString(),rows=unread.map(n=>({user_id:authUser.id,notification_key:n.key,read_at:now}));

   supa.from('clients').select('*').eq('id',id).single(),

function passportTestGroups(tests){
 const groups={};
 for(const t of tests||[]){
   const n=Number(t.value);
   if(!Number.isFinite(n)||!t.name)continue;
   const key=normalizeTestName(t.name);
   if(!groups[key])groups[key]={name:t.name,unit:t.unit||'',rows:[]};
   groups[key].rows.push({...t,num:n});
 }
 Object.values(groups).forEach(g=>g.rows.sort((a,b)=>String(a.date).localeCompare(String(b.date))));
 return Object.values(groups).sort((a,b)=>b.rows.length-a.rows.length);
}
function passportLineChart(group){

 const W=680,H=215,L=42,R=18,T=22,B=30,innerW=W-L-R,innerH=H-T-B;
 const pts=rows.map((r,i)=>({x:L+(rows.length===1?innerW/2:i*innerW/(rows.length-1)),y:T+(max-r.num)/range*innerH,r}));
 const line=pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
 const area=L+','+(T+innerH)+' '+line+' '+(L+innerW)+','+(T+innerH);
 const grid=[0,.25,.5,.75,1].map(f=>{const y=T+innerH*f;return '<line class="pp-chart-grid" x1="'+L+'" y1="'+y+'" x2="'+(L+innerW)+'" y2="'+y+'"/>';}).join('');

 return '<svg class="pp-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Évolution '+esc(group.name)+'">'+grid+'<polygon points="'+area+'" fill="#d6a85c" opacity=".10"/><polyline points="'+line+'" fill="none" stroke="#e7b96d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+labels+'</svg>';

function renewalPanel(c){
 const d=daysUntil(c.end),history=(c.renewals||[]).slice().sort((a,b)=>b.dueDate.localeCompare(a.dueDate));
 const processedCurrent=history.find(r=>r.dueDate===c.end);
 const clientChoice=(c.renewalChoices||[]).find(r=>r.dueDate===c.end);
 let stateHtml='';
 if(!c.end)stateHtml='<div class="muted">Ajoute d’abord une date de fin d’engagement.</div>';
 else if(processedCurrent){
   stateHtml=processedCurrent.decision==='stop'
    ? '<div class="alert"><strong>Arrêt prévu à l’échéance du '+fmtDate(c.end)+'.</strong><div class="tiny" style="margin-top:4px">Le renouvellement a déjà été traité.</div></div>'
    : '<div class="alert green"><strong>Renouvellement traité.</strong><div class="tiny" style="margin-top:4px">'+esc(renewalDecisionLabel(processedCurrent.decision))+' • nouvelle échéance '+fmtDate(processedCurrent.newEndDate)+'</div></div>';
 }else if(clientChoice){
   stateHtml='<div class="alert green"><strong>Le client a choisi : '+esc(renewalDecisionLabel(clientChoice.decision))+'</strong><div class="tiny" style="margin-top:4px">'+(clientChoice.paymentMode?esc(renewalPaymentLabel(clientChoice.paymentMode))+' • ':'')+'choix reçu le '+fmtDateTime(clientChoice.submittedAt)+'.</div></div>'+
   '<div class="muted tiny" style="margin:8px 0 10px">Le choix est enregistré mais n’active encore aucun nouveau paiement. Quand Stripe sera branché, la validation du paiement finalisera automatiquement le renouvellement.</div>'+
   '<button class="btn primary" id="openRenewal">Finaliser manuellement</button>';
 }else if(d!==null&&d<=14){
   stateHtml='<div class="alert" style="margin-bottom:10px"><strong>En attente du choix client</strong><div class="tiny" style="margin-top:4px">'+(d<0?'Échéance dépassée de '+Math.abs(d)+' jour(s).':d===0?'Échéance aujourd’hui.':'Échéance dans '+d+' jour(s), le '+fmtDate(c.end)+'.')+'</div></div><div class="muted tiny">Le client peut choisir directement depuis son espace : 3 mois, 6 mois, mensuel sans engagement ou arrêt.</div><button class="btn ghost small" id="openRenewal" style="margin-top:10px">Traiter manuellement</button>';
 }else{
   stateHtml='<div class="alert blue"><strong>Prochaine échéance : '+fmtDate(c.end)+'</strong><div class="tiny" style="margin-top:4px">Le choix client s’ouvrira automatiquement à J-14.</div></div><button class="btn ghost small" id="openRenewal">Traiter maintenant</button>';
 }
 const hist=history.length?history.map(r=>'<div class="item"><div class="row between"><strong>'+fmtDate(r.dueDate)+'</strong><span class="status '+(r.decision==='stop'?'red':'green')+'">'+esc(renewalDecisionLabel(r.decision))+'</span></div><div class="tiny muted">'+(r.newEndDate?'Nouvelle fin : '+fmtDate(r.newEndDate):'Fin prévue à l’échéance')+'</div><div class="tiny">Bilan cycle : '+(r.cycleReviewDone?'Oui':'Non')+' • Retests : '+(r.retestsRequired?(r.retestsDone?'faits':'à faire'):'non requis')+' • Objectifs : '+(r.objectivesUpdated?'mis à jour':'non mis à jour')+'</div>'+(r.notes?'<div class="tiny" style="margin-top:4px">'+esc(r.notes)+'</div>':'')+'</div>').join(''):'<div class="muted">Aucun renouvellement finalisé pour le moment.</div>';
 return '<div class="card panel" style="margin-top:13px"><div class="row between"><div><h3 style="margin-bottom:4px">Renouvellement d’engagement</h3><div class="muted tiny">Le client choisit lui-même à J-14. Aucun renouvellement n’est imposé automatiquement.</div></div>'+(c.end&&d!==null&&d<=14&&!processedCurrent?'<span class="status '+(clientChoice?'green':'amber')+'">'+(clientChoice?'Choix reçu':'En attente')+'</span>':'')+'</div><div style="margin-top:12px">'+stateHtml+'</div><div class="section-title">Historique finalisé</div><div class="list">'+hist+'</div></div>';
}

function calendarPage(){
 const days=[['Lundi',1],['Mardi',2],['Mercredi',3],['Jeudi',4],['Vendredi',5],['Samedi',6],['Dimanche',7]];
 const windows=db.availabilityWindows||[], dated=db.availabilityDateWindows||[], exceptions=db.availabilityExceptions||[];
 const appointments=db.appointments||[];
 const upcoming=appointments.filter(a=>['scheduled','confirmed'].includes(a.status)&&new Date(a.starts_at)>=new Date()).sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
 const toProcess=appointments.filter(a=>['scheduled','confirmed'].includes(a.status)&&new Date(a.starts_at)<new Date()).sort((a,b)=>new Date(b.starts_at)-new Date(a.starts_at));
 const visioHistory=appointments.filter(a=>['completed','cancelled','cancelled_late','no_show'].includes(a.status)).sort((a,b)=>new Date(b.starts_at)-new Date(a.starts_at)).slice(0,20);

 const today=new Date();today.setHours(12,0,0,0);
 const planningDays=[];
 for(let i=0;i<21;i++){const d=new Date(today);d.setDate(today.getDate()+i);planningDays.push(d)}
 const weekGroups=[planningDays.slice(0,7),planningDays.slice(7,14),planningDays.slice(14,21)];
 const threeWeeks=weekGroups.map((week,wi)=>{
   const cards=week.map(d=>{
     const iso=localDateISO(d);
     const label=new Intl.DateTimeFormat('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit'}).format(d);
     const rows=dated.filter(w=>String(w.availability_date).slice(0,10)===iso);
     const fullBlock=exceptions.some(e=>iso>=String(e.exception_date).slice(0,10)&&iso<=String(e.end_date||e.exception_date).slice(0,10)&&!e.start_time&&!e.end_time);
     const recurring=windows.filter(w=>w.weekday===(((d.getDay()+6)%7)+1));
     const detail=rows.length
       ? rows.map(w=>'<div class="item" style="padding:8px"><div class="row between"><strong>'+esc(String(w.start_time).slice(0,5))+'–'+esc(String(w.end_time).slice(0,5))+'</strong><button class="link deleteDateAvailability" data-id="'+w.id+'">×</button></div></div>').join('')
       : fullBlock
         ? '<div class="tiny account-wait">Journée indisponible</div>'
         : recurring.length
           ? '<div class="tiny muted">Planning habituel : '+recurring.map(w=>esc(String(w.start_time).slice(0,5))+'–'+esc(String(w.end_time).slice(0,5))).join(' • ')+'</div>'
           : '<div class="tiny muted">Aucune disponibilité</div>';
     return '<div class="card panel" style="min-width:170px;padding:12px"><div class="row between"><div><strong style="text-transform:capitalize">'+esc(label)+'</strong><div class="tiny '+(rows.length?'account-good':'muted')+'">'+(rows.length?'Planning précis':'')+'</div></div><button class="btn ghost small addDateAvailability" data-date="'+iso+'">+</button></div><div class="list" style="margin-top:8px">'+detail+'</div></div>';
   }).join('');
   return '<div style="margin-top:'+(wi?18:12)+'px"><div class="section-title">Semaine '+(wi+1)+'</div><div style="display:grid;grid-template-columns:repeat(7,minmax(170px,1fr));gap:9px;overflow:auto;padding-bottom:4px">'+cards+'</div></div>';
 }).join('');

 const weekly=days.map(([label,n])=>{
   const rows=windows.filter(w=>w.weekday===n).map(w=>'<div class="item" style="padding:9px"><div class="row between"><div><strong>'+esc(String(w.start_time).slice(0,5))+'–'+esc(String(w.end_time).slice(0,5))+'</strong><div class="tiny muted">Chaque '+label.toLowerCase()+'</div></div><button class="link deleteAvailability" data-id="'+w.id+'">Retirer</button></div></div>').join('');
   return '<div class="card panel" style="min-width:180px"><div class="row between"><h3 style="margin:0">'+label+'</h3><button class="btn ghost small addAvailability" data-day="'+n+'">+</button></div><div class="list" style="margin-top:10px">'+(rows||'<div class="muted tiny">Aucune disponibilité habituelle</div>')+'</div></div>';
 }).join('');

 const exRows=exceptions.map(e=>{const end=String(e.end_date||e.exception_date).slice(0,10),range=end!==String(e.exception_date).slice(0,10)?fmtDate(e.exception_date)+' → '+fmtDate(end):fmtDate(e.exception_date);return '<div class="item row between"><div><strong>'+range+'</strong><div class="muted tiny">'+(e.start_time?esc(String(e.start_time).slice(0,5))+'–'+esc(String(e.end_time).slice(0,5)):'Journée(s) entière(s)')+(e.note?' • '+esc(e.note):'')+'</div></div><button class="link deleteException" data-id="'+e.id+'">Retirer</button></div>'}).join('');
 const apptRows=upcoming.map(a=>'<div class="item row between"><div><strong>'+fmtDateTime(a.starts_at)+' — '+esc(a.clientName)+'</strong><div class="muted tiny">'+esc(a.appointment_type||'Visio')+' • '+a.duration_minutes+' min • <span class="status blue">'+appointmentStatusLabel(a.status)+'</span></div></div><div class="row"><button class="link openClient" data-id="'+a.client_id+'">Dossier</button><button class="link cancelAppointment" data-id="'+a.id+'" data-client-id="'+a.client_id+'">Annuler</button></div></div>').join('');
 const processRows=toProcess.map(a=>'<div class="item"><div class="row between"><div><strong>'+fmtDateTime(a.starts_at)+' — '+esc(a.clientName)+'</strong><div class="muted tiny">À clôturer</div></div><button class="link openClient" data-id="'+a.client_id+'">Dossier</button></div><div class="row" style="margin-top:8px"><button class="btn primary small coachCompleteVisio" data-id="'+a.id+'">Marquer réalisée</button><button class="btn danger small coachNoShowVisio" data-id="'+a.id+'">Absent</button></div></div>').join('');
 const historyRows=visioHistory.map(a=>'<div class="item row between"><div><strong>'+fmtDateTime(a.starts_at)+' — '+esc(a.clientName)+'</strong><div class="muted tiny">'+esc(a.appointment_type||'Visio')+' • '+a.duration_minutes+' min</div></div><span class="status '+appointmentStatusTone(a.status)+'">'+esc(appointmentStatusLabel(a.status))+'</span></div>').join('');

 return '<div class="page-title"><div><h1>Calendrier & disponibilités</h1><p>Planifie tes créneaux jusqu’à 3 semaines à l’avance. Les clients voient les changements en temps réel.</p></div><button class="btn primary" id="addException">Bloquer une période / un créneau</button></div>'+
 '<div class="card panel" style="margin-bottom:13px"><div class="row between"><div><h3 style="margin-bottom:4px">Planning des 3 prochaines semaines</h3><div class="muted tiny">Clique sur + pour définir précisément tes disponibilités d’une date. Dès qu’une date possède un planning précis, il remplace le planning hebdomadaire habituel pour ce jour.</div></div><span class="status green">Temps réel</span></div>'+threeWeeks+'</div>'+
 '<div class="card panel" style="margin-bottom:13px"><div><h3 style="margin-bottom:4px">Planning hebdomadaire habituel</h3><div class="muted tiny">Facultatif : il sert de base pour les jours où tu n’as pas défini de planning précis.</div></div>'+
 '<div style="display:grid;grid-template-columns:repeat(7,minmax(180px,1fr));gap:10px;overflow:auto;margin-top:14px;padding-bottom:4px">'+weekly+'</div></div>'+
 '<div class="grid2"><div class="card panel"><h3>Indisponibilités ponctuelles</h3><div class="list">'+(exRows||'<div class="muted">Aucune exception enregistrée.</div>')+'</div></div>'+
 '<div class="card panel"><h3>Rendez-vous à venir</h3><div class="list">'+(apptRows||'<div class="muted">Aucune visio réservée.</div>')+'</div></div></div>'+
 '<div class="grid2" style="margin-top:13px"><div class="card panel"><h3>Visios à clôturer</h3><div class="list">'+(processRows||'<div class="muted">Aucune visio passée en attente de statut.</div>')+'</div></div>'+
 '<div class="card panel"><h3>Historique des visios</h3><div class="list">'+(historyRows||'<div class="muted">Aucun historique pour le moment.</div>')+'</div></div></div>';
}

 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
 document.querySelectorAll('.quickTab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
 document.querySelectorAll('.accBtn').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));

 document.querySelectorAll('.addAvailability').forEach(b=>b.onclick=()=>openAvailabilityModal(Number(b.dataset.day)));
 document.querySelectorAll('.deleteAvailability').forEach(b=>b.onclick=async()=>{const {error}=await supa.from('availability_windows').delete().eq('id',b.dataset.id);if(error)return toast('Erreur : '+error.message);await loadSupabaseData();toast('Disponibilité retirée');render()});
 document.getElementById('addException')?.addEventListener('click',openExceptionModal);
 document.querySelectorAll('.deleteException').forEach(b=>b.onclick=async()=>{const {error}=await supa.from('availability_exceptions').delete().eq('id',b.dataset.id);if(error)return toast('Erreur : '+error.message);await loadSupabaseData();toast('Indisponibilité retirée');render()});

function setPath(obj,path,val){const parts=path.split('.');let cur=obj;for(let i=0;i<parts.length-1;i++){cur[parts[i]]=cur[parts[i]]||{}}cur[parts.at(-1)]=val}

function openRenewalModal(cl){
 if(!cl?.end)return toast('Ajoute une date de fin d’engagement');
 modal('Renouvellement — '+esc(cl.name),
 '<div class="alert blue"><strong>Échéance actuelle : '+fmtDate(cl.end)+'</strong><div class="tiny" style="margin-top:4px">Choisis la suite de l’accompagnement et valide les éléments de fin de cycle.</div></div>'+
 '<div class="field"><label>Décision</label><select id="renewDecision" class="select"><option value="3_months">Renouvellement 3 mois</option><option value="6_months">Renouvellement 6 mois</option><option value="monthly">Passage en mensuel</option><option value="stop">Arrêt à l’échéance</option></select></div>'+
 '<label class="check"><input id="renewReview" type="checkbox"> Bilan de cycle réalisé</label>'+
 '<label class="check"><input id="renewRetestsRequired" type="checkbox"> Retests nécessaires</label>'+
 '<label class="check"><input id="renewRetestsDone" type="checkbox"> Retests réalisés</label>'+
 '<label class="check"><input id="renewObjectives" type="checkbox"> Nouveaux objectifs définis / mis à jour</label>'+
 '<div class="field"><label>Notes de renouvellement</label><textarea id="renewNotes" class="textarea" placeholder="Bilan, éléments discutés avec le client, suite prévue…"></textarea></div>',
 '<button class="btn ghost" id="cancelM">Annuler</button><button class="btn primary" id="saveM">Valider le renouvellement</button>');
 const clientChoice=(cl.renewalChoices||[]).find(r=>r.dueDate===cl.end);
 if(clientChoice)document.getElementById('renewDecision').value=clientChoice.decision;
 document.getElementById('cancelM').onclick=closeModal;
 document.getElementById('renewRetestsRequired').onchange=e=>{if(!e.target.checked)document.getElementById('renewRetestsDone').checked=false};
 document.getElementById('saveM').onclick=async()=>{
   const decision=document.getElementById('renewDecision').value;
   const review=document.getElementById('renewReview').checked;
   const retestsRequired=document.getElementById('renewRetestsRequired').checked;
   const retestsDone=document.getElementById('renewRetestsDone').checked;
   const objectives=document.getElementById('renewObjectives').checked;
   const notes=document.getElementById('renewNotes').value.trim();
   if(retestsRequired&&!retestsDone&&!confirm('Les retests sont marqués nécessaires mais pas encore réalisés. Valider quand même le renouvellement ?'))return;
   const months=decision==='3_months'?3:decision==='6_months'?6:decision==='monthly'?1:0;
   const newEnd=months?addMonthsISO(cl.end,months):null;
   const row={client_id:cl.id,due_date:cl.end,decision,cycle_review_done:review,retests_required:retestsRequired,retests_done:retestsDone,objectives_updated:objectives,notes:notes||null,previous_end_date:cl.end,new_end_date:newEnd};
   const {error}=await supa.from('renewals').insert(row);
   if(error)return toast(error.code==='23505'?'Cette échéance a déjà été traitée.':'Erreur : '+error.message);
   if(newEnd){
     const {error:updateErr}=await supa.from('clients').update({engagement_end_date:newEnd,status:'active'}).eq('id',cl.id);
     if(updateErr)return toast('Renouvellement enregistré, mais erreur de date : '+updateErr.message);
   }
   cl.renewal=decision==='3_months'?'3 mois':decision==='6_months'?'6 mois':decision==='monthly'?'Mensuel':'Arrêt';
   try{await saveWorkspace(cl)}catch(e){}
   const eventTitle=decision==='stop'?'Fin d’accompagnement prévue':'Renouvellement '+renewalDecisionLabel(decision);
   await supa.from('passport_events').insert({client_id:cl.id,event_date:localDateISO(),title:eventTitle,detail:decision==='stop'?'Arrêt prévu à l’échéance du '+fmtDate(cl.end)+'.':'Nouvelle échéance : '+fmtDate(newEnd)+'.',client_visible:true});
   closeModal();await loadSupabaseData();toast(decision==='stop'?'Arrêt enregistré':'Renouvellement enregistré');render();
 };
}

async function enterClientPortal(user,profile){
 const {data:client,error}=await supa.from('clients').select('*').eq('auth_user_id',user.id).maybeSingle();
 if(error){showClientPending('Impossible de charger ton dossier : '+error.message);return}
 if(!client){showClientPending('Ton compte existe, mais ton accès à l’espace AK PRIME n’est pas encore activé. En production, l’accès sera débloqué après validation du paiement et liaison sécurisée avec ton dossier.');return}
 const today=localDateISO(), end=new Date(); end.setDate(end.getDate()+20); const endDate=localDateISO(end);
 const [templRes,responseRes,testRes,cycleRes,eventRes,apptRes,checkinRes,slotsRes,policyRes,settingsRes,readsRes,renewalChoiceRes]=await Promise.all([
   supa.from('questionnaire_templates').select('*').eq('pole',client.current_pole).eq('active',true).order('version',{ascending:false}).limit(1).maybeSingle(),
   supa.from('questionnaire_responses').select('*').eq('client_id',client.id).order('updated_at',{ascending:false}).limit(1).maybeSingle(),
   supa.from('tests').select('*').eq('client_id',client.id).order('performed_at',{ascending:false}),
   supa.from('cycles').select('*').eq('client_id',client.id).order('start_date',{ascending:false}).limit(1).maybeSingle(),
   supa.from('passport_events').select('*').eq('client_id',client.id).eq('client_visible',true).order('event_date',{ascending:false}),
   supa.from('appointments').select('*').eq('client_id',client.id).order('starts_at',{ascending:true}),
   supa.from('checkins').select('*').eq('client_id',client.id).order('week_date',{ascending:false}),
   supa.rpc('get_my_available_slots',{p_from:today,p_to:endDate}),
   supa.rpc('get_my_booking_policy'),
   supa.from('app_settings').select('*').eq('id',1).maybeSingle(),
   supa.from('notification_reads').select('notification_key,read_at').eq('user_id',authUser.id),
   supa.from('renewal_choices').select('*').eq('client_id',client.id).order('due_date',{ascending:false})
 ]);
 const anyErr=[templRes,responseRes,testRes,cycleRes,eventRes,apptRes,checkinRes,slotsRes,policyRes,settingsRes,readsRes,renewalChoiceRes].find(r=>r.error)?.error;
 if(anyErr){showClientPending('Dossier chargé, mais une partie de l’espace client est indisponible : '+anyErr.message);return}
 clientPortalState={client,profile,template:templRes.data,response:responseRes.data,tests:testRes.data||[],cycle:cycleRes.data,events:eventRes.data||[],appointments:apptRes.data||[],checkins:checkinRes.data||[],availableSlots:slotsRes.data||[],bookingPolicy:(policyRes.data||[])[0]||null,appSettings:settingsRes.data||null,notificationReads:readsRes.data||[],renewalChoices:renewalChoiceRes.data||[]};
 clientPortalView='home';
 clientVisioWeek=0;
 clientVisioDay='';
 clientQuestionnaireExpanded=false;
 clientMobileMenuOpen=false;
 renderClientPortal();
}

 document.getElementById('root').innerHTML='<div class="auth-shell"><div class="auth-card"><div class="auth-logo">AK PRIME<span>ESPACE CLIENT</span></div><h1>Compte client</h1><p>'+esc(message)+'</p><button class="btn ghost" id="pendingLogout">Déconnexion</button></div></div>';
 document.getElementById('pendingLogout').onclick=async()=>{await supa.auth.signOut();showAuth()};
}
function renderClientEngagementBanner(c){

 const msg=d<0?'Ton engagement est arrivé à échéance.':d===0?'Ton engagement arrive à échéance aujourd’hui.':d<=14?'Ton engagement arrive à échéance dans '+d+' jour(s).':'Fin d’engagement : '+fmtDate(end);
 const sub=d<=14?'Alex préparera avec toi le bilan de cycle et la suite de l’accompagnement.':'Tu retrouveras cette échéance dans ton Passeport AK PRIME.';
 return '<div class="client-engagement '+tone+'"><div><strong>'+esc(msg)+'</strong><div class="muted tiny" style="margin-top:4px">'+esc(sub)+'</div></div><button class="btn ghost small" id="engagementPassportBtn">Voir mon Passeport</button></div>';

function clientNavMarkup(){
 const items=[['home','⌂','Accueil'],['visios','◷','Visios'],['suivi','✓','Suivi'],['passport','◇','Passeport']];
 const current=items.find(x=>x[0]===clientPortalView)||items[0];
 const top='<div class="client-nav">'+items.map(([k,icon,label])=>'<button class="clientNavBtn '+(clientPortalView===k?'on':'')+'" data-view="'+k+'">'+label+'</button>').join('')+'</div>';
 const mobile='<button class="client-mobile-menu-toggle" id="clientMobileMenuToggle" type="button">'+current[1]+' '+current[2]+' <span class="chev">'+(clientMobileMenuOpen?'▲':'▼')+'</span></button>'+
 (clientMobileMenuOpen?'<div class="client-mobile-menu">'+items.map(([k,icon,label])=>'<button class="clientNavBtn '+(clientPortalView===k?'on':'')+'" data-view="'+k+'"><span>'+icon+'</span>'+label+'</button>').join('')+'</div>':'');
 return {top,mobile};

function currentClientRenewalChoice(s){
 const end=isoDate(s?.client?.engagement_end_date);
 return end?(s?.renewalChoices||[]).find(r=>isoDate(r.due_date)===end)||null:null;
}
function renderClientRenewalCard(s){
 const end=isoDate(s?.client?.engagement_end_date);if(!end)return '';
 const d=daysUntil(end);if(d===null||d>14)return '';
 const choice=currentClientRenewalChoice(s);
 if(choice){
   const payment=choice.payment_mode?' • '+renewalPaymentLabel(choice.payment_mode):'';
   return '<div class="client-section-card" style="border-color:#c9d7ef;background:#fbfdff"><div class="row between"><div><div class="muted tiny">MA DÉCISION POUR LA SUITE</div><h3 style="margin:4px 0 5px">'+esc(renewalDecisionLabel(choice.decision))+'</h3><div class="muted tiny">'+esc(payment.replace(/^ • /,''))+(payment?' • ':'')+'échéance actuelle '+fmtDate(end)+'</div></div><span class="status green">Choix enregistré</span></div><div class="alert blue" style="margin-top:12px"><div class="tiny"><strong>Aucun nouveau prélèvement n’est effectué ici.</strong> Le tarif et le paiement seront confirmés avant l’activation du prochain engagement.</div></div><button class="btn ghost small" id="openClientRenewalChoice" style="margin-top:5px">Modifier mon choix</button></div>';
 }
 return '<div class="client-section-card" style="border-color:#efcf8e;background:#fffaf0"><div class="row between"><div><div class="muted tiny">FIN D’ENGAGEMENT</div><h3 style="margin:4px 0 5px">Choisis toi-même la suite</h3><div class="muted tiny">'+(d<0?'Échéance dépassée : ':d===0?'Échéance aujourd’hui : ':'Dans '+d+' jour(s) : ')+fmtDate(end)+'</div></div><span class="status amber">Action requise</span></div><p class="tiny" style="line-height:1.55">Rien ne repart automatiquement : tu choisis entre un nouvel engagement de 3 mois, 6 mois, du mensuel sans engagement ou l’arrêt.</p><button class="btn primary" id="openClientRenewalChoice">Choisir la suite</button></div>';
}
function openClientRenewalChoice(){
 const s=clientPortalState,c=s?.client;if(!c)return;
 const end=isoDate(c.engagement_end_date),d=end?daysUntil(end):null;
 if(!end||d===null||d>14)return alert('Le choix sera disponible 14 jours avant la fin de ton engagement.');
 const existing=currentClientRenewalChoice(s);
 modal('Choisir la suite de mon accompagnement',
 '<div class="alert blue"><strong>Échéance actuelle : '+fmtDate(end)+'</strong><div class="tiny" style="margin-top:4px">Offre actuelle : '+esc(c.current_pole||'')+' — '+esc(c.current_offer||'')+(offerBaseMonthlyPrice(c.current_pole,c.current_offer)?' • '+euro(offerBaseMonthlyPrice(c.current_pole,c.current_offer))+' / mois':'')+'.</div><div class="tiny" style="margin-top:4px">Aucune option n’est reconduite automatiquement. Ton choix est enregistré, mais aucun paiement n’est déclenché aujourd’hui.</div></div>'+
 '<div class="field"><label>Que souhaites-tu faire ?</label><select id="clientRenewDecision" class="select"><option value="3_months">Repartir sur 3 mois</option><option value="6_months">Repartir sur 6 mois</option><option value="monthly">Passer en mensuel sans engagement</option><option value="stop">Arrêter à l’échéance</option></select></div>'+
 '<div id="clientRenewPaymentWrap"><div class="field"><label>Mode de paiement souhaité</label><select id="clientRenewPayment" class="select"><option value="monthly">Paiement mensuel</option><option value="upfront">Paiement comptant</option></select></div><div class="muted tiny" style="margin-top:-4px">Le paiement comptant bénéficiera de la remise prévue par la grille tarifaire au moment de l’activation.</div></div>'+
 '<div id="clientRenewSummary" class="alert" style="margin-top:12px"></div>',
 '<button class="btn ghost" id="cancelClientRenewal">Annuler</button><button class="btn primary" id="saveClientRenewal">Confirmer mon choix</button>');
 const decision=document.getElementById('clientRenewDecision'),payment=document.getElementById('clientRenewPayment'),wrap=document.getElementById('clientRenewPaymentWrap'),summary=document.getElementById('clientRenewSummary');
 if(existing){decision.value=existing.decision||'3_months';if(existing.payment_mode)payment.value=existing.payment_mode}
 const sync=()=>{
   const v=decision.value;
   const price=renewalPriceDetails(c,v,payment.value);
   if(v==='stop'){
     wrap.style.display='none';
     summary.innerHTML='<strong>Arrêt à l’échéance</strong><div class="tiny" style="margin-top:4px">Ton accompagnement continuera jusqu’au '+fmtDate(end)+', puis s’arrêtera. Aucun nouvel engagement ne sera créé.</div>';
   }else if(v==='monthly'){
     wrap.style.display='none';
     summary.innerHTML='<strong>Mensuel sans engagement</strong>'+(price?'<div style="font-size:19px;font-weight:900;margin-top:7px">'+esc(price.headline)+'</div><div class="tiny" style="margin-top:4px">'+esc(price.detail)+'</div>':'<div class="tiny" style="margin-top:4px">Le tarif sera confirmé avant activation.</div>');
   }else{
     wrap.style.display='block';
     summary.innerHTML='<strong>Nouvel engagement '+(v==='3_months'?'3':'6')+' mois</strong>'+(price?'<div style="font-size:21px;font-weight:950;margin-top:7px">'+esc(price.headline)+'</div><div class="tiny" style="margin-top:4px">'+esc(price.detail)+'</div>':'<div class="tiny" style="margin-top:4px">'+renewalPaymentLabel(payment.value)+'. Le tarif sera confirmé avant paiement.</div>');
   }
 };
 decision.onchange=sync;payment.onchange=sync;sync();
 document.getElementById('cancelClientRenewal').onclick=closeModal;
 document.getElementById('saveClientRenewal').onclick=async()=>{
   const dec=decision.value;
   const pay=dec==='stop'?null:dec==='monthly'?'monthly':payment.value;
   const label=renewalDecisionLabel(dec)+(pay?' — '+renewalPaymentLabel(pay):'');
   const price=renewalPriceDetails(c,dec,pay);
   if(!confirm('Confirmer : '+label+(price?'\n'+price.headline:'')+' ?\n\nAucun paiement ne sera effectué maintenant.'))return;
   const btn=document.getElementById('saveClientRenewal');btn.disabled=true;btn.textContent='Enregistrement…';
   const {data,error}=await supa.rpc('submit_my_renewal_choice',{p_decision:dec,p_payment_mode:pay});
   if(error){btn.disabled=false;btn.textContent='Confirmer mon choix';return alert(error.message||'Impossible d’enregistrer ton choix.')}
   const row=Array.isArray(data)?data[0]:data;
   s.renewalChoices=[row,...(s.renewalChoices||[]).filter(x=>isoDate(x.due_date)!==end)];
   closeModal();toast('Choix de renouvellement enregistré');renderClientPortal();
 };
}

 const engagementValue=!c.engagement_end_date?'À définir':d<0?'Échue':d===0?'Aujourd’hui':d+' j';

 return '<div class="client-main"><div class="client-hero"><div class="row between"><div><h1>'+esc([c.first_name,c.last_name==='-'?'':c.last_name].filter(Boolean).join(' '))+'</h1><p>'+esc(c.current_pole||'')+' — '+esc(c.current_offer||'')+'</p></div><span class="status green">'+esc(c.status==='active'?'Actif':c.status||'')+'</span></div></div>'+
 '<div class="client-summary-grid">'+

 '<div class="client-summary-card"><div class="lab">Fin d’engagement</div><div class="value">'+esc(engagementValue)+'</div><div class="sub">'+fmtDate(isoDate(c.engagement_end_date))+'</div></div>'+
 '</div>'+
 renderClientRenewalCard(s)+
 (actionCards.length?'<div class="section-title">À faire</div><div class="grid2">'+actionCards.join('')+'</div>':renewalPending?'':'<div class="alert green" style="margin-top:13px"><strong>Tout est à jour.</strong><div class="tiny" style="margin-top:4px">Aucune action urgente dans ton espace AK PRIME.</div></div>')+
 '<div class="client-home-actions">'+
 (c.optitrainer_url?'<button class="btn primary" id="clientOpti">Ouvrir mon entraînement Optitrainer</button>':'<div class="client-action-card"><strong>Optitrainer</strong><div class="muted tiny">Ton lien sera ajouté par le coach.</div></div>')+
 renderClientWhatsAppButton(s,c)+
 '</div>'+

 '</div>';

 return '<a class="btn primary" href="'+esc(whatsappUrl(num,msg))+'" target="_blank" rel="noopener" style="margin-top:10px;text-decoration:none">💬 Contacter Alex sur WhatsApp</a>';
}

function renderBookingPanel(s){
 const all=(s.appointments||[]).slice().sort((a,b)=>new Date(a.starts_at)-new Date(b.starts_at));
 const future=all.filter(a=>['scheduled','confirmed'].includes(a.status)&&new Date(a.starts_at)>new Date());
 const next=future[0];
 const history=all.filter(a=>['completed','cancelled','cancelled_late','no_show'].includes(a.status)||new Date(a.starts_at)<new Date()).sort((a,b)=>new Date(b.starts_at)-new Date(a.starts_at)).slice(0,10);

   : (policy.quota_count||1)+' visio'+((policy.quota_count||1)>1?'s':'')+' par mois';
 const today=new Date();today.setHours(0,0,0,0);
 const weeks=[[],[],[]];
 for(const sl of slots){
   const d=new Date(sl.starts_at),local=new Date(d.toLocaleString('en-US',{timeZone:'Europe/Paris'}));local.setHours(0,0,0,0);
   const idx=Math.max(0,Math.min(2,Math.floor((local-today)/604800000)));
   weeks[idx].push(sl);
 }
 if(clientVisioWeek<0||clientVisioWeek>2)clientVisioWeek=0;
 const weekSlots=weeks[clientVisioWeek]||[];
 const byDate={};
 for(const sl of weekSlots){const key=new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:'Europe/Paris'}).format(new Date(sl.starts_at));(byDate[key]||(byDate[key]=[])).push(sl)}
 const dates=Object.keys(byDate).sort();
 if(!dates.includes(clientVisioDay))clientVisioDay=dates[0]||'';

 const nextActions=next?(()=>{

   return '<div class="client-section-card" style="margin-top:0"><div class="row between"><div><div class="muted tiny">PROCHAINE VISIO</div><strong style="font-size:18px">'+fmtDateTime(next.starts_at)+'</strong><div class="muted tiny" style="margin-top:4px">'+next.duration_minutes+' min • '+esc(appointmentStatusLabel(next.status))+'</div></div><span class="status '+(late?'amber':'green')+'">'+(late?'Moins de 24 h':'Modifiable')+'</span></div>'+

   (!late?'<button class="btn ghost small clientRescheduleVisio" data-id="'+next.id+'">Déplacer</button>':'')+
   '<button class="btn danger small clientCancelVisio" data-id="'+next.id+'" data-late="'+(late?'1':'0')+'">Annuler</button>'+
   (normalizeWhatsAppNumber(s.appSettings?.whatsapp_number)?'<a class="btn primary small" href="'+esc(whatsappUrl(s.appSettings.whatsapp_number,'Bonjour Alex, je suis prêt(e) pour notre visio AK PRIME du '+fmtDateTime(next.starts_at)+'.'))+'" target="_blank" rel="noopener" style="text-decoration:none">📹 WhatsApp</a>':'')+
   '</div></div>';
 })():'<div class="client-section-card" style="margin-top:0"><div class="muted tiny">PROCHAINE VISIO</div><strong style="font-size:18px">Aucune visio réservée</strong><div class="muted tiny" style="margin-top:5px">Choisis un créneau ci-dessous.</div></div>';
 const weekButtons=[0,1,2].map(i=>'<button class="clientWeekBtn '+(clientVisioWeek===i?'on':'')+'" data-week="'+i+'">Semaine '+(i+1)+' <span class="tiny" style="opacity:.7">('+weeks[i].length+')</span></button>').join('');
 const dayButtons=dates.map(date=>{
   const d=new Date(date+'T12:00:00');
   const wd=new Intl.DateTimeFormat('fr-FR',{weekday:'short'}).format(d);
   const dm=new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'2-digit'}).format(d);
   return '<button class="client-day-btn clientDayBtn '+(clientVisioDay===date?'on':'')+'" data-date="'+date+'"><strong>'+esc(wd)+'</strong><span>'+esc(dm)+' • '+byDate[date].length+'</span></button>';
 }).join('');
 const timeButtons=selected.map(sl=>'<button class="btn ghost small bookSlot" data-start="'+esc(sl.starts_at)+'">'+fmtTime(sl.starts_at)+'</button>').join('');
 const hist=history.length?history.map(a=>'<div class="item row between"><div><strong>'+fmtDateTime(a.starts_at)+'</strong><div class="muted tiny">'+esc(a.appointment_type||'Visio')+' • '+a.duration_minutes+' min</div></div><span class="status '+appointmentStatusTone(a.status)+'">'+esc(appointmentStatusLabel(a.status))+'</span></div>').join(''):'<div class="muted">Aucune visio dans l’historique.</div>';
 return nextActions+
 '<div class="client-section-card"><div class="row between"><div><h3 style="margin-bottom:3px">Réserver une visio</h3><div class="muted tiny">'+esc(quotaText)+' • '+esc(policy.duration_minutes||30)+' min</div></div><span class="status blue">3 semaines</span></div>'+
 '<div class="client-week-tabs">'+weekButtons+'</div>'+
 (weekSlots.length?'<div class="client-day-strip">'+dayButtons+'</div><div class="section-title" style="margin-top:6px">Horaires disponibles</div><div class="client-time-grid">'+timeButtons+'</div>':'<div class="muted" style="padding:16px 0">Aucun créneau disponible sur cette semaine.</div>')+

}

async function refreshClientBookingData(){

   supa.rpc('get_my_available_slots',{p_from:today,p_to:localDateISO(end)}),
   supa.from('appointments').select('*').eq('client_id',clientPortalState.client.id).order('starts_at',{ascending:true}),
   supa.rpc('get_my_booking_policy')
 ]);
 if(!slots.error)clientPortalState.availableSlots=slots.data||[];
 if(!appts.error)clientPortalState.appointments=appts.data||[];
 if(!policy.error)clientPortalState.bookingPolicy=(policy.data||[])[0]||clientPortalState.bookingPolicy;

   const panel=document.getElementById('clientBookingPanel');if(panel){panel.innerHTML=renderBookingPanel(clientPortalState);bindBookingButtons()}
 }else if(clientPortalView==='home'||clientPortalView==='passport'){
   renderClientPortal();
 }
}

}

function renderQuestion(q,value){
 const req=q.required?'<span class="req"> *</span>':'';
 let input='';
 if(q.type==='textarea')input='<textarea class="textarea qinput" data-key="'+esc(q.key)+'">'+esc(value||'')+'</textarea>';
 else if(q.type==='select')input='<select class="select qinput" data-key="'+esc(q.key)+'" style="width:100%"><option value="">Choisir…</option>'+q.options.map(o=>'<option '+(String(value||'')===String(o)?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
 else if(q.type==='multiselect'){
   const vals=Array.isArray(value)?value:[];
   input='<div class="choices">'+q.options.map(o=>'<label class="choice"><input type="checkbox" class="qmulti" data-key="'+esc(q.key)+'" value="'+esc(o)+'" '+(vals.includes(o)?'checked':'')+'> <span>'+esc(o)+'</span></label>').join('')+'</div>';
 } else if(q.type==='consent')input='<label class="choice"><input type="checkbox" class="qconsent" data-key="'+esc(q.key)+'" '+(value===true?'checked':'')+'> <span>Je confirme</span></label>';
 else if(q.type==='scale'){
   const opts=[];for(let i=q.min||1;i<=(q.max||10);i++)opts.push('<option value="'+i+'" '+(String(value||'')===String(i)?'selected':'')+'>'+i+'</option>');
   input='<div class="scale-wrap"><span class="tiny muted">'+esc(q.lowLabel||'')+'</span><select class="select qinput" data-key="'+esc(q.key)+'"><option value="">—</option>'+opts.join('')+'</select><span class="tiny muted" style="text-align:right">'+esc(q.highLabel||'')+'</span></div>';
 } else input='<input class="input qinput" data-key="'+esc(q.key)+'" type="'+esc(q.type||'text')+'" value="'+esc(value||'')+'" style="width:100%">';
 return '<div class="qblock"><label class="qtitle">'+esc(q.label)+req+'</label>'+input+'</div>';
}
function collectQuestionnaire(template){
 const answers={},missing=[];
 for(const q of template.questions){
   let v;
   if(q.type==='multiselect')v=[...document.querySelectorAll('.qmulti[data-key="'+CSS.escape(q.key)+'"]:checked')].map(x=>x.value);
   else if(q.type==='consent')v=!!document.querySelector('.qconsent[data-key="'+CSS.escape(q.key)+'"]')?.checked;
   else v=document.querySelector('.qinput[data-key="'+CSS.escape(q.key)+'"]')?.value?.trim()||'';
   answers[q.key]=v;
   if(q.required&&((Array.isArray(v)&&!v.length)||v===''||v===false))missing.push(q.label);
 }
 return {answers,missing};
}
async function saveClientQuestionnaire(statusValue){

 const row={client_id:s.client.id,questionnaire_type:t.template_key,questionnaire_version:t.version,answers,status:statusValue,submitted_at:new Date().toISOString()};
 const {data,error}=await supa.from('questionnaire_responses').upsert(row,{onConflict:'client_id,questionnaire_type,questionnaire_version'}).select().single();
 if(error){alert('Impossible d’enregistrer : '+error.message);return}
 s.response=data;
 if(statusValue==='submitted')alert('Questionnaire envoyé au coach.');
 else alert('Brouillon enregistré.');
 renderClientPortal();
}

function publicCheckoutPriceFallback(base,duration,paymentMode){
 base=Number(base)||0;
 if(duration===3){
   const monthlyTotal=base*3;
   if(paymentMode==='upfront'){
     const total=Math.round(monthlyTotal*.97*100)/100;
     return {headline:euro(total)+' comptant',detail:'au lieu de '+euro(monthlyTotal)+' • remise comptant 3 %',monthlyEquivalent:Math.round((total/3)*100)/100,total,source:'fallback'};
   }
   return {headline:euro(base)+' / mois',detail:'3 mensualités • total '+euro(monthlyTotal),monthlyEquivalent:base,total:monthlyTotal,source:'fallback'};
 }
 const discountedMonthly=Math.round(base*.95*100)/100;
 const sixTotal=Math.round(discountedMonthly*6*100)/100;
 if(paymentMode==='upfront'){
   const total=Math.round(sixTotal*.98*100)/100;
   return {headline:euro(total)+' comptant',detail:'remise engagement 6 mois 5 %, puis remise comptant 2 % • au lieu de '+euro(base*6),monthlyEquivalent:Math.round((total/6)*100)/100,total,source:'fallback'};
 }
 return {headline:euro(discountedMonthly)+' / mois',detail:'6 mensualités • total '+euro(sixTotal)+' • remise engagement 6 mois 5 %',monthlyEquivalent:discountedMonthly,total:sixTotal,source:'fallback'};
}
async function publicCheckoutPrice(pole,name,base,duration,paymentMode){
 const offerCode=publicOfferCode(pole,name);
 if(offerCode){
   const {data,error}=await supa.rpc('quote_offer',{
     p_offer_code:offerCode,
     p_commitment_months:Number(duration),
     p_payment_mode:paymentMode
   });
   const q=Array.isArray(data)?data[0]:data;
   if(!error&&q){
     const canonicalBase=Number(q.base_monthly_cents)/100;
     const monthlyEquivalent=Number(q.monthly_equivalent_cents)/100;
     const total=Number(q.total_cents)/100;
     let headline='',detail='';
     if(Number(duration)===3&&paymentMode==='monthly'){
       headline=euro(monthlyEquivalent)+' / mois';
       detail='3 mensualités • total '+euro(total);
     }else if(Number(duration)===3){
       headline=euro(total)+' comptant';
       detail='au lieu de '+euro(canonicalBase*3)+' • remise comptant 3 %';
     }else if(paymentMode==='monthly'){
       headline=euro(monthlyEquivalent)+' / mois';
       detail='6 mensualités • total '+euro(total)+' • remise engagement 6 mois 5 %';
     }else{
       headline=euro(total)+' comptant';
       detail='remise engagement 6 mois 5 %, puis remise comptant 2 % • au lieu de '+euro(canonicalBase*6);
     }
     return {headline,detail,monthlyEquivalent,total,source:'server',offerCode,base:canonicalBase};
   }
   console.warn('AK PRIME quote_offer indisponible, utilisation du tarif indicatif local.',error);
 }
 return {...publicCheckoutPriceFallback(base,duration,paymentMode),offerCode};
}

    '<div class="section-title">Avant de continuer</div><div class="checkout-consents">'+

      '<label class="checkout-consent"><input id="checkoutHealthConsent" type="checkbox" '+(draft.healthConsent?'checked':'')+'><span><strong>Données sensibles.</strong> J’accepte explicitement que les informations de santé que je choisis de communiquer (douleurs, blessures, restrictions ou antécédents utiles) soient traitées uniquement pour individualiser mon accompagnement AK PRIME.</span></label>'+
      '<label class="checkout-consent"><input id="checkoutEarlyStart" type="checkbox" '+(draft.earlyStart?'checked':'')+'><span><strong>Démarrage avant 14 jours.</strong> Je demande expressément que l’accompagnement puisse commencer avant la fin du délai légal de rétractation. En cas de rétractation après le début du service, la part déjà exécutée pourra être due dans les conditions prévues par la loi.</span></label>'+
    '</div><div class="checkout-consent-note">Ces choix sont préparés dans le tunnel mais ne sont pas encore enregistrés : aucun paiement réel n’est actif sur cette version.</div><div id="checkoutValidationError" class="checkout-error"></div>'+
    '<div class="checkout-price-box"><strong>'+esc(p.detail)+'</strong><div class="checkout-price-sub">Quand Stripe sera branché, l’e-mail saisi ici sera transmis au paiement sécurisé. Après validation du paiement, il servira à préparer automatiquement le compte et le dossier client AK PRIME.</div></div>',
    '<button class="btn ghost" id="backPublicCheckout">Retour</button><button class="btn primary" id="futureStripeCheckout">Continuer vers le paiement</button>');
   const captureDraft=()=>{
     draft.fullName=document.getElementById('checkoutFullName')?.value?.trim()||'';
     draft.email=document.getElementById('checkoutEmail')?.value?.trim()||'';
     draft.acceptedCgv=!!document.getElementById('checkoutAcceptCgv')?.checked;
     draft.healthConsent=!!document.getElementById('checkoutHealthConsent')?.checked;
     draft.earlyStart=!!document.getElementById('checkoutEarlyStart')?.checked;
     draft.duration=duration;draft.paymentMode=paymentMode;
     publicCheckoutDraft=draft;
   };
   document.getElementById('backPublicCheckout').onclick=()=>{captureDraft();openPublicOfferCheckout(button)};
   document.getElementById('futureStripeCheckout').onclick=()=>{
     const fullName=document.getElementById('checkoutFullName').value.trim();
     const emailEl=document.getElementById('checkoutEmail'),email=emailEl.value.trim();
     const acceptedCgv=document.getElementById('checkoutAcceptCgv').checked;
     const healthConsent=document.getElementById('checkoutHealthConsent').checked;
     const earlyStart=document.getElementById('checkoutEarlyStart').checked;
     draft.fullName=fullName;draft.email=email;draft.acceptedCgv=acceptedCgv;draft.healthConsent=healthConsent;draft.earlyStart=earlyStart;draft.duration=duration;draft.paymentMode=paymentMode;publicCheckoutDraft=draft;
     const errorBox=document.getElementById('checkoutValidationError');
     const errors=[];
     if(fullName.length<3)errors.push('Indique ton nom et ton prénom.');
     emailEl.value=email;
     if(!email||!emailEl.checkValidity())errors.push('Indique une adresse e-mail valide.');
     if(!acceptedCgv)errors.push('Confirme la prise de connaissance des documents contractuels.');
     if(!healthConsent)errors.push('Le consentement explicite au traitement des données sensibles est nécessaire pour préparer un accompagnement individualisé.');
     if(!earlyStart)errors.push('Confirme ta demande de démarrage avant la fin du délai de 14 jours pour poursuivre ce parcours.');
     if(errors.length){
       errorBox.innerHTML='<strong>Il reste '+errors.length+' point'+(errors.length>1?'s':'')+' à compléter :</strong><br>• '+errors.map(esc).join('<br>• ');
       errorBox.classList.add('show');
       return;
     }
     errorBox.classList.remove('show');
     modal('Paiement bientôt disponible',
      '<div class="alert blue"><strong>Le tunnel AK PRIME est prêt jusqu’à Stripe.</strong><div class="tiny" style="margin-top:5px">L’identité, le choix d’offre et les consentements sont maintenant collectés avant l’étape de paiement. Ils seront persistés et vérifiés côté serveur lors du branchement Stripe.</div></div>'+
      '<div class="checkout-recap"><div><span>Client</span><strong>'+esc(fullName)+'</strong></div><div><span>E-mail</span><strong>'+esc(email)+'</strong></div><div><span>Offre</span><strong>'+esc(pole+' — '+name)+'</strong></div><div><span>Engagement</span><strong>'+duration+' mois</strong></div><div><span>Paiement</span><strong>'+esc(paymentMode==='upfront'?'Comptant':'Mensuel')+'</strong></div><div><span>Montant</span><strong>'+esc(p.headline)+'</strong></div></div>',
      '<button class="btn primary" id="closeCheckoutInfo">Compris</button>');
     document.getElementById('closeCheckoutInfo').onclick=()=>{publicCheckoutDraft=null;closeModal()};
   };
 };
}

function bindPublicSite(){
 document.getElementById('publicLoginBtn')?.addEventListener('click',()=>openPublicLogin());
 document.getElementById('heroLoginBtn')?.addEventListener('click',()=>openPublicLogin());
 document.querySelectorAll('.publicPoleBtn').forEach(b=>b.onclick=()=>openPublicPoleDetails(b.dataset.pole));
 document.querySelectorAll('.publicOfferBtn').forEach(b=>b.onclick=()=>openPublicOfferCheckout(b));
 document.querySelectorAll('.publicLegalBtn').forEach(b=>b.onclick=()=>openPublicLegal(b.dataset.legal));
}

function showAuth(message='',isError=false){
 document.getElementById('root').innerHTML=renderPublicSite();
 bindPublicSite();
 if(message)openPublicLogin(message,isError);
}

function setAuthMsg(msg,err){
 const el=document.getElementById('authMsg');if(!el)return;el.textContent=msg;el.className='auth-msg show'+(err?' err':'');
}
async function enterApp(user){
 authUser=user;
 const {data:profile,error}=await supa.from('profiles').select('id,role,full_name').eq('id',user.id).maybeSingle();
 if(error){showAuth('Connexion réussie mais profil inaccessible : '+error.message,true);return}
 authProfile=profile;
 if(!profile){showAuth('Profil utilisateur introuvable.',true);return}
 if(profile.role==='client'){
   await enterClientPortal(user,profile);
   return;
 }
 if(!['owner','coach'].includes(profile.role)){
   showClientPending('Ton compte existe mais aucun rôle AK PRIME utilisable ne lui est attribué.');
   return;
 }
 try{
   await loadSupabaseData();
   state.view='dashboard';render();
   subscribeCalendarRealtime('coach');
 }catch(e){
   showAuth('Connexion réussie, mais impossible de charger la base AK PRIME : '+e.message,true);
 }
}
async function initAuth(){
 await loadPublicOfferCatalog();
 const {data:{session}}=await supa.auth.getSession();
 if(session?.user) await enterApp(session.user); else showAuth();
 supa.auth.onAuthStateChange(async(event,session)=>{
   if(event==='SIGNED_OUT'){if(calendarChannel){await supa.removeChannel(calendarChannel);calendarChannel=null}authUser=null;authProfile=null;clientPortalState=null;showAuth()}
 });
}

initAuth();
</script>
