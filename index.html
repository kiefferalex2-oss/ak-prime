<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AK PRIME — Coaching, Performance & Mental</title>

<meta name="theme-color" content="#0d233b">
<style>
:root{
  --bg:#f3f6fa;--panel:#fff;--panel2:#f8fafc;--nav:#0d1827;--nav2:#13243a;--text:#101828;
  --muted:#475467;--line:#e3e8ef;--blue:#2f66f6;--blue2:#edf2ff;--gold:#d3ab62;--green:#15865d;
  --green2:#e5f7ef;--amber:#a86400;--amber2:#fff4d8;--red:#be3535;--red2:#fdeaea;--shadow:0 10px 32px rgba(16,24,40,.07)
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}.hidden{display:none!important}
.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}
.sidebar{background:linear-gradient(180deg,var(--nav),#091421 85%);color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{padding:0 8px 12px}.brand strong{display:block;font-size:25px;letter-spacing:.09em}.brand span{font-size:10px;letter-spacing:.23em;color:#8fa1b8}
.nav{display:flex;flex-direction:column;gap:7px}.nav button{border:0;background:transparent;color:#c7d1de;text-align:left;padding:12px 13px;border-radius:10px;cursor:pointer;font-weight:650}
.nav button:hover,.nav button.on{background:#1d4ed8;color:#fff}.nav .sep{height:1px;background:#1f3045;margin:8px 6px}
.sidebar-note{margin-top:auto;padding:12px;border:1px solid #24384e;border-radius:12px;background:#102033;font-size:12px;color:#aab8c8;line-height:1.45}
.topbar{height:70px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:10}
.crumb{font-size:14px;color:var(--muted)}.top-actions{display:flex;gap:9px;align-items:center}.top-actions input{width:230px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#16283d;color:#fff;font-size:13px;font-weight:800}
main{min-width:0}.content{padding:24px 26px 48px;max-width:1500px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.page-title{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.page-title h1{margin:0;font-size:29px}.page-title p{margin:4px 0 0;color:var(--muted);font-size:14px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}.btn.danger{background:var(--red2);color:var(--red)}.btn.small{padding:7px 10px;font-size:13px}
.input,.select,.textarea{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 11px;color:var(--text)}.textarea{width:100%;min-height:95px;resize:vertical}.input:focus,.select:focus,.textarea:focus{outline:2px solid #c9d6ff;border-color:#8ba6ff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:15px}.kpi{padding:17px 18px}.kpi .lab{font-size:12px;color:var(--muted)}.kpi .val{font-size:27px;font-weight:900;margin-top:5px}.kpi .sub{font-size:12px;color:var(--muted);margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}.grid31{display:grid;grid-template-columns:1.05fr 1.25fr 1.15fr;gap:13px}
.panel{padding:17px}.panel h2,.panel h3{margin:0 0 12px}.panel h3{font-size:16px}.muted{color:var(--muted)}.tiny{font-size:12px}
.toolbar{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar .input{flex:1;min-width:220px}
table{width:100%;border-collapse:collapse}th,td{padding:13px 15px;border-bottom:1px solid #edf0f4;text-align:left;font-size:14px}th{font-size:12px;color:var(--muted);background:#fbfcfe;text-transform:uppercase;letter-spacing:.03em}
.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:850}.status.green{background:var(--green2);color:var(--green)}.status.red{background:var(--red2);color:var(--red)}.status.amber{background:var(--amber2);color:var(--amber)}.status.blue{background:var(--blue2);color:var(--blue)}
.link{border:0;background:transparent;color:var(--blue);font-weight:800;cursor:pointer}
.list{display:flex;flex-direction:column;gap:8px}.item{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fbfcfe}.item strong{display:block;margin-bottom:4px}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.grow{flex:1}
.alert{border-left:4px solid var(--amber);background:#fffaf0;padding:11px 12px;border-radius:9px;margin-bottom:8px}.alert.blue{border-color:var(--blue);background:#f5f7ff}.alert.green{border-color:var(--green);background:#f1fbf6}
.client-head{padding:18px 20px;margin-bottom:11px;display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.person{display:flex;align-items:center;gap:14px}.photo{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#dbe5f1,#7c8ca2);color:#fff;font-weight:900;font-size:22px}.person h2{margin:0 0 5px}.meta{display:flex;gap:8px 12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border:1px solid var(--line);border-radius:11px;padding:10px}.metric span{font-size:11px;color:var(--muted)}.metric strong{display:block;margin-top:3px;font-size:14px}
.tabs{display:flex;gap:3px;padding:7px;margin-bottom:12px;overflow:auto}.tabs button{border:0;background:transparent;padding:10px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}.tabs button.on{background:var(--blue2);color:var(--blue);font-weight:850}
.accordion{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fbfcfe}.accordion>button{width:100%;border:0;background:transparent;padding:11px 12px;text-align:left;display:flex;justify-content:space-between;font-weight:800;cursor:pointer}.accordion .body{display:none;padding:0 12px 12px;line-height:1.5;font-size:14px}.accordion.open .body{display:block}
.check{display:flex;gap:8px;align-items:flex-start;margin:9px 0}.check input{margin-top:3px}
.section-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;font-weight:850}
.field{margin-bottom:11px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:750}.field .input,.field .select{width:100%}
.test-row{display:grid;grid-template-columns:1.2fr .8fr .7fr .9fr 1.4fr auto;gap:8px;align-items:center;border-bottom:1px solid #edf0f4;padding:10px 0}.test-row.header{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}
.spark{height:42px;display:flex;align-items:flex-end;gap:3px}.spark i{display:block;width:8px;background:#7390ff;border-radius:3px 3px 0 0}
.timeline{display:flex;flex-direction:column;gap:10px}.event{border-left:3px solid var(--blue);padding-left:11px}.event .date{font-size:11px;color:var(--muted);margin-bottom:2px}
.passport{background:linear-gradient(145deg,#0d1827,#142844);color:#fff;padding:22px}.passport .muted{color:#b9c6d5}.passport-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.passport .mini{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px}.passport .mini span{display:block;color:#b9c6d5;font-size:11px}.passport .mini strong{display:block;margin-top:4px}
.progress{height:8px;background:#e7ecf3;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--blue)}
.modal-wrap{position:fixed;inset:0;background:rgba(9,20,33,.58);display:grid;place-items:center;z-index:100;padding:20px}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.25)}.modal-head,.modal-foot{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-foot{border-top:1px solid var(--line);border-bottom:0}.modal-body{padding:18px 20px}.x{border:0;background:transparent;font-size:22px;cursor:pointer}
.backup{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);z-index:110;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}

/* Passeport AK PRIME premium */
.premium-passport{background:radial-gradient(circle at 78% 0,#1d1b18 0,#0b121a 31%,#071018 76%);color:#edf2f7;border:1px solid #29333d;border-radius:20px;padding:20px;box-shadow:0 26px 70px rgba(0,0,0,.24);overflow:hidden}
.pp-topline{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:14px}.pp-eyebrow{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#d7ad67;font-weight:900}.pp-title{font-size:30px;margin:4px 0 0;font-weight:950;letter-spacing:-.03em}.pp-motto{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#b98b4c;text-align:right;line-height:1.6}
.pp-card{background:linear-gradient(145deg,rgba(18,28,38,.96),rgba(9,17,24,.96));border:1px solid #2a3540;border-radius:15px;padding:15px;min-width:0}.pp-card h3{font-size:14px;margin:0 0 11px;color:#f5f7fa}.pp-muted{color:#93a2b2}.pp-tiny{font-size:11px}.pp-gold{color:#e3b86d}.pp-green{color:#5dd29e}.pp-amber{color:#f0bb67}.pp-red{color:#ef8585}
.pp-profile{display:grid;grid-template-columns:1.4fr .8fr .8fr .8fr;gap:10px;margin-bottom:10px}.pp-person{display:flex;gap:13px;align-items:center}.pp-avatar{width:70px;height:70px;border-radius:14px;border:1px solid #8b6a38;background:linear-gradient(145deg,#32404d,#121a22);display:grid;place-items:center;font-size:24px;font-weight:950;color:#e5bc79;flex:0 0 auto}.pp-name{font-size:22px;font-weight:950}.pp-tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pp-tag{font-size:10px;padding:5px 7px;border-radius:999px;border:1px solid #38434d;background:#121d27;color:#bcc8d3}
.pp-stat{border-left:1px solid #2d3742;padding-left:14px}.pp-stat span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8191a1}.pp-stat strong{display:block;margin-top:7px;font-size:14px}.pp-engagement{border-color:#8b6a38;background:linear-gradient(145deg,rgba(61,46,25,.46),rgba(19,20,20,.95))}
.pp-grid3{display:grid;grid-template-columns:1.25fr 1.1fr .95fr;gap:10px;margin-top:10px}.pp-grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:10px;margin-top:10px}.pp-grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.pp-chart{width:100%;height:auto;display:block;min-height:190px}.pp-chart text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.pp-chart-grid{stroke:#283440;stroke-width:1}.pp-chart-axis{fill:#758595;font-size:9px}.pp-chart-value{fill:#f0bf73;font-size:9px;font-weight:800}
.pp-kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pp-kpi{background:#111c25;border:1px solid #283440;border-radius:10px;padding:10px}.pp-kpi span{display:block;font-size:9px;color:#8191a1;text-transform:uppercase;letter-spacing:.05em}.pp-kpi strong{display:block;font-size:16px;margin-top:4px}.pp-kpi small{font-size:10px;color:#8394a4}
.pp-progress{height:8px;background:#28313a;border-radius:99px;overflow:hidden;margin-top:12px}.pp-progress i{display:block;height:100%;background:linear-gradient(90deg,#bc8740,#efc476);border-radius:99px}.pp-cycle-title{font-size:17px;font-weight:900;margin-bottom:6px}
.pp-list{display:flex;flex-direction:column;gap:8px}.pp-list-row{padding:9px 10px;border:1px solid #27333d;border-radius:10px;background:#0e1821}.pp-list-row strong{font-size:12px}.pp-list-row .pp-muted{font-size:10px;margin-top:3px}
.pp-timeline{display:flex;align-items:flex-start;gap:0;overflow:auto;padding:10px 2px 4px}.pp-node{min-width:135px;position:relative;padding:19px 9px 0}.pp-node:before{content:"";position:absolute;top:5px;left:0;right:0;height:2px;background:#3a4651}.pp-node:first-child:before{left:50%}.pp-node:last-child:before{right:50%}.pp-node:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;top:1px;left:calc(50% - 5px);background:#e5b96f;box-shadow:0 0 0 4px rgba(229,185,111,.08)}.pp-node strong{display:block;font-size:11px;text-align:center}.pp-node span{display:block;font-size:9px;text-align:center;color:#778899;margin-top:4px}
.pp-pill{display:inline-flex;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:900}.pp-pill.good{background:#143529;color:#6fe0ad}.pp-pill.warn{background:#3a2c18;color:#f1be6b}.pp-pill.neutral{background:#172432;color:#9db0c3}
.pp-empty{display:grid;place-items:center;min-height:170px;color:#778899;font-size:12px;text-align:center;padding:20px}.pp-actions{display:flex;gap:8px;justify-content:flex-end;margin:0 0 10px}.pp-actions .btn.ghost{background:#111b24;border-color:#34414c;color:#eef3f7}
.client-nav{display:flex;gap:6px;align-items:center}.client-nav button{border:1px solid #2d3b49;background:#101e2d;color:#afbecc;border-radius:9px;padding:8px 11px;font-weight:800;cursor:pointer}.client-nav button.on{background:#d5aa63;border-color:#d5aa63;color:#0b1218}.client-engagement{margin-top:13px;border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid var(--line)}.client-engagement.warn{background:#fff9ed;border-color:#efd39c}.client-engagement.end{background:#fff1f1;border-color:#efb4b4}.premium-client-main{max-width:1450px}
@media(max-width:1100px){.pp-profile{grid-template-columns:1.3fr 1fr}.pp-grid3{grid-template-columns:1fr 1fr}.pp-grid4{grid-template-columns:1fr 1fr}}
@media(max-width:780px){.pp-profile,.pp-grid3,.pp-grid2,.pp-grid4{grid-template-columns:1fr}.pp-stat{border-left:0;border-top:1px solid #2d3742;padding-left:0;padding-top:10px}.pp-topline{flex-direction:column}.pp-motto{text-align:left}.pp-kpi-row{grid-template-columns:1fr}.client-top{flex-wrap:wrap}.client-nav{order:3;width:100%}}
@media(max-width:1100px){.app{grid-template-columns:80px 1fr}.sidebar{padding:18px 8px}.brand strong{font-size:14px;text-align:center}.brand span,.sidebar-note{display:none}.nav button{font-size:0;text-align:center}.nav button:before{content:"•";font-size:20px}.grid31,.grid3{grid-template-columns:1fr}.client-head{grid-template-columns:1fr}}
@media(max-width:780px){.app{grid-template-columns:1fr}.sidebar{display:none}.content{padding:15px 11px 40px}.topbar{padding:0 13px}.top-actions input{display:none}.kpis,.grid2{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr}.test-row{grid-template-columns:1fr 1fr}.test-row.header{display:none}.passport-grid{grid-template-columns:1fr}}

.public-site{min-height:100vh;background:#08111d;color:#fff}
.public-nav-wrap{position:sticky;top:0;z-index:90;background:rgba(8,17,29,.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08)}

/* Fenêtre Performance — hiérarchie visuelle premium, sans modifier les autres pôles */
.modal.pole-performance-modal{width:min(980px,calc(100vw - 32px));background:#f4f7fb}

.pole-performance-modal .section-title{color:#233b56;font-size:13px;margin:27px 0 9px;letter-spacing:.06em}

.akPreciseOffer>.akEditorialSection{display:block;padding:29px 5px 32px;border-bottom:1px solid #e4eaf0}
.akPreciseOffer>.akEditorialSection .akEditorialHeading{max-width:none;margin-bottom:19px}
.akPreciseOffer>.akEditorialSection .akEditorialHeading h3{margin:0 0 7px;font-size:clamp(21px,2.3vw,27px)}
.akPreciseOffer>.akEditorialSection .akEditorialHeading p{max-width:740px;margin:0}
.akOfferIncludedNow{width:100%;min-width:0}
.akOfferIncludedHead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 12px}
.akOfferIncludedHead>span{font-size:10px;letter-spacing:.12em;font-weight:900;color:#ae7c3d}
.akOfferIncludedHead>strong{font-size:11px;font-weight:750;color:#78899b}
.akOfferIncludedList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 26px;list-style:none;margin:0;padding:0}
.akOfferIncludedList li{display:flex;gap:11px;align-items:flex-start;border-top:1px solid #e5eaf0;padding:13px 1px 14px;min-width:0;color:#334f66;font-size:12px;line-height:1.65;font-weight:600}
.akOfferIncludedTick{font-weight:950;display:grid;place-items:center;width:21px;height:21px;border-radius:50%;background:#f5e9d5;color:#a27639;flex:0 0 21px;font-size:11px;line-height:1}
.akPreciseOffer .akEditorialContent>.akReadFold{margin-top:13px}
.akPreciseOffer .akOfferCompareDesktop .perf-compare-wrap{border:1px solid #e3e8ef;border-radius:12px;overflow-x:auto}
.akPreciseOffer .akOfferCompareDesktop .perf-compare{min-width:820px;width:100%;table-layout:fixed}
.akPreciseOffer .akOfferCompareDesktop .perf-compare th,.akPreciseOffer .akOfferCompareDesktop .perf-compare td{font-size:11px;line-height:1.6;padding:13px 14px;white-space:normal;overflow-wrap:break-word}
.akPreciseOffer .akOfferCompareDesktop .perf-compare th:first-child,.akPreciseOffer .akOfferCompareDesktop .perf-compare td:first-child{width:19%;font-weight:850}
.akPreciseOffer .akOfferCompareDesktop .perf-compare th:not(:first-child),.akPreciseOffer .akOfferCompareDesktop .perf-compare td:not(:first-child){width:27%}
.akOfferCriteriaMobile{display:none}
.akOfferCriterion{border:1px solid #e1e7ee;background:#fff;border-radius:11px;overflow:hidden}
.akOfferCriterion>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;list-style:none;cursor:pointer;color:#243f57;font-size:13px;font-weight:850}
.akOfferCriterion>summary::-webkit-details-marker{display:none}
.akOfferCriterion>summary span:last-child{color:#a2773d;font-size:16px;transition:transform .15s}
.akOfferCriterion[open]>summary{background:#f9fafb;border-bottom:1px solid #e4eaf0}
.akOfferCriterion[open]>summary span:last-child{transform:rotate(180deg)}
.akOfferCriterionContent{padding:5px 14px 13px}
.akOfferCriterionTier{display:grid;grid-template-columns:35px minmax(0,1fr);gap:10px;padding:11px 3px;border-bottom:1px solid #edf0f3}
.akOfferCriterionTier:last-child{border-bottom:0}
.akOfferCriterionTier strong{font-size:12px;color:#314b61;font-weight:900}
.akOfferCriterionTier p{font-size:12px;color:#63778a;line-height:1.55;margin:0}
.akOfferCriterionTier.active{background:#fff8ed;margin:0 -7px;padding-left:10px;padding-right:10px;border-radius:8px}
.akOfferCriterionTier.active strong{color:#956a34}
.akPreciseHow{margin:17px 0 0}
.akPreciseHow .akReadFold{border-radius:12px;margin:0;background:#fff}
.akPreciseHow .akReadFold>summary{padding:17px 19px}
.akPreciseHowInner{min-width:0}
.akPreciseHowInner .akEditorialSteps{margin-bottom:15px}
.akPreciseHowInner>.akReadExampleText{padding:14px 15px;border-left:3px solid #d6b073;background:#faf8f4;border-radius:0 8px 8px 0}
.akPreciseOffer>.akDemoDisclosure{margin-top:22px}
@media(max-width:820px){
 .akPreciseOffer .akOfferCompareDesktop{display:none}
 .akPreciseOffer .akOfferCriteriaMobile{display:grid;gap:8px}
 .akPreciseOffer .akEditorialDetailedDesktop{display:none}
 .akPreciseOffer .akEditorialDetailedMobile{display:block}
 .akPreciseOffer .akEditorialDetailedMobile .akOfferCriteriaMobile{display:grid}
 .akOfferIncludedList{column-gap:16px}
}
@media(max-width:600px){
 .akPreciseOffer>.akEditorialSection{padding:23px 0 25px}
 .akPreciseOffer>.akEditorialSection .akEditorialHeading{margin-bottom:14px}
 .akPreciseOffer>.akEditorialSection .akEditorialHeading h3{font-size:21px;line-height:1.25}
 .akOfferIncludedHead{align-items:baseline}
 .akOfferIncludedHead>strong{font-size:10px;text-align:right}
 .akOfferIncludedList{grid-template-columns:1fr;gap:0}
 .akOfferIncludedList li{padding:11px 2px;font-size:12px;line-height:1.6}
 .akOfferCriterion>summary{min-height:52px}
 .akPreciseHowInner .akEditorialSteps{grid-template-columns:1fr}
}


/* Présentation forte des outils : accès client / Optitrainer / back-office coach. */
.akOfferPlatforms{margin:20px 0 6px;padding:24px 26px;border:1px solid #dce6ef;background:#f8fafc;border-radius:18px}
.akOfferPlatformsTitle{max-width:780px;margin-bottom:18px}
.akOfferPlatformsEyebrow{display:block;color:#a77c40;letter-spacing:.13em;font-size:10px;font-weight:900;margin-bottom:7px}
.akOfferPlatformsTitle h3{font-size:clamp(19px,2.15vw,24px);color:#18334a;font-weight:900;line-height:1.3;margin:0 0 8px;letter-spacing:-.03em}
.akOfferPlatformsTitle p{font-size:12px;line-height:1.65;color:#637b91;margin:0}
.akOfferPlatformsGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}
.akOfferPlatformsGrid.akOfferPlatformsTwo{grid-template-columns:repeat(2,minmax(0,1fr))}
.akOfferPlatform{border:1px solid #dfe8f0;background:#fff;border-radius:13px;padding:16px;display:flex;flex-direction:column;min-height:196px;min-width:0}
.akOfferPlatformTop{display:flex;align-items:center;gap:8px;margin-bottom:18px}
.akOfferPlatformTop>span{width:25px;height:25px;border-radius:7px;display:grid;place-items:center;color:#aa8148;background:#f8f2e7;font-size:10px;font-weight:900}
.akOfferPlatformTop small{color:#8192a1;font-size:9px;letter-spacing:.08em;font-weight:900}
.akOfferPlatform>strong{display:block;font-size:17px;line-height:1.25;letter-spacing:-.025em;font-weight:900;color:#19374d}
.akOfferPlatform>p{font-size:11px;line-height:1.6;color:#667c90;margin:9px 0 16px;flex:1}
.akOfferPlatformTag{display:inline-flex;align-self:flex-start;font-size:10px;font-weight:850;background:#f2f5f8;padding:7px 10px;border-radius:7px;color:#546f86}
.akOfferPlatformClient{border-color:#d6b57a;background:#fffdf8}
.akOfferPlatformClient>.akOfferPlatformTag{background:#f5ebd9;color:#8c6832}
.akOfferPlatformCoach{background:linear-gradient(145deg,#0e2134,#1a3a55);border-color:#1c3b55}
.akOfferPlatformCoach .akOfferPlatformTop>span{background:rgba(226,191,126,.14);color:#eacb91}
.akOfferPlatformCoach .akOfferPlatformTop small{color:#dbbd83}
.akOfferPlatformCoach>strong{color:#fff}
.akOfferPlatformCoach>p{color:#bdcedd}
.akOfferPlatformCoach .akOfferPlatformTag{background:rgba(255,255,255,.1);color:#e9eef4}
.akOfferCriterionTitle{padding:13px 15px;border-bottom:1px solid #e5eaf1;font-size:13px;font-weight:900;color:#18384f;background:#f5f8fb}
.akOfferCriterionContent{padding:5px 14px 13px}
.akOfferCriterionTier{grid-template-columns:35px minmax(0,1fr);gap:10px}
.akPreciseOffer .akOfferCriteriaMobile .akOfferCriterion{overflow:visible}
.akPreciseOffer .akOfferCriteriaMobile .akOfferCriterionTitle{border-radius:10px 10px 0 0}
.akPreciseOffer .akOfferCriteriaMobile .akOfferCriterion:first-child{margin-top:0}
@media(max-width:900px){
 .akOfferPlatforms{padding:20px}
 .akOfferPlatformsGrid{grid-template-columns:1fr 1fr}
 .akOfferPlatformCoach{grid-column:1/-1}
 .akOfferPlatformsTwo .akOfferPlatformCoach{grid-column:auto}
 .akOfferPlatform{min-height:175px}
}
@media(max-width:600px){
 .akOfferPlatforms{margin:15px 0 5px;padding:17px 14px}
 .akOfferPlatformsTitle{margin-bottom:14px}
 .akOfferPlatformsTitle h3{font-size:19px}
 .akOfferPlatformsTitle p{font-size:11px}
 .akOfferPlatformsGrid,.akOfferPlatformsGrid.akOfferPlatformsTwo{grid-template-columns:1fr;gap:9px}
 .akOfferPlatformCoach,.akOfferPlatformsTwo .akOfferPlatformCoach{grid-column:auto}
 .akOfferPlatform{min-height:0;padding:15px}
 .akOfferPlatformTop{margin-bottom:9px}
 .akOfferPlatform>strong{font-size:16px}
 .akOfferPlatform>p{margin:7px 0 10px}
 .akOfferCriterionTitle{font-size:13px}
 .akOfferCriterionTier p{font-size:11px;line-height:1.5}

/* Tableau unique par pôle : toutes les prestations, colonne active surlignée. */
.akComparisonOnly{border-bottom:0!important;padding-top:32px!important;padding-bottom:22px!important}
.akComparisonOnly .akEditorialHeading{margin-bottom:20px!important}
.akComparisonOnly .akEditorialHeading h3{font-size:clamp(22px,2.45vw,29px)!important;max-width:900px}
.akComparisonOnly .akEditorialHeading p{font-size:12px;max-width:850px!important}
.akMatrixDesktop{overflow-x:auto;border:1px solid #dce5ed;border-radius:14px;background:#fff;overscroll-behavior-inline:contain}
.akMatrixTable{width:100%;min-width:870px;border-collapse:separate;border-spacing:0;table-layout:fixed;color:#264055}
.akMatrixTable.akMatrix2{min-width:650px}
.akMatrixTable th,.akMatrixTable td{padding:16px 15px;text-align:left;vertical-align:top;font-size:12px;line-height:1.6;border-bottom:1px solid #e7ebf0}
.akMatrixTable thead th{font-size:13px;letter-spacing:-.01em;font-weight:900;color:#264158;background:#f2f6fa;white-space:normal;vertical-align:middle;position:sticky;top:0;z-index:2}
.akMatrixTable th:first-child{width:20%;font-weight:850;color:#213c53}
.akMatrixTable.akMatrix2 th:first-child{width:25%}
.akMatrixTable td{width:auto;color:#4b6378;overflow-wrap:anywhere}
.akMatrixTable tbody tr:nth-child(even) th:not(.akMatrixSelected),
.akMatrixTable tbody tr:nth-child(even) td:not(.akMatrixSelected){background:#fafbfd}
.akMatrixTable tr:last-child th,.akMatrixTable tr:last-child td{border-bottom:0}
.akMatrixTable .akMatrixSelected{background:#fff8eb!important;border-left:1px solid #efdfc0;border-right:1px solid #efdfc0;color:#3d4c55}
.akMatrixTable thead .akMatrixSelected{background:#f4e8d2!important;color:#6e4d23}
.akMatrixChosen{display:block;font-size:9px;font-weight:900;letter-spacing:.07em;color:#966c34;margin-top:6px}
.akMatrixMobile{display:none}
.akMatrixMobileCriterion{border:1px solid #dfe6ed;border-radius:12px;overflow:hidden;background:#fff}
.akMatrixMobileCriterion h4{margin:0;padding:12px 15px;color:#1d3a50;background:#f1f5f8;border-bottom:1px solid #e1e7ec;font-size:13px;font-weight:900}
.akMatrixMobileOffer{display:grid;grid-template-columns:92px minmax(0,1fr);gap:12px;align-items:start;padding:11px 15px;border-bottom:1px solid #ebeff3}
.akMatrixMobileOffer:last-child{border-bottom:0}
.akMatrixMobileOffer strong{color:#29445a;font-size:11px;font-weight:900;line-height:1.4}
.akMatrixMobileOffer strong span{display:block;color:#976a34;font-size:9px;line-height:1.5;margin-top:3px;letter-spacing:.045em}
.akMatrixMobileOffer p{margin:0;color:#596d7e;font-size:11px;line-height:1.6}
.akMatrixMobileOffer.akMatrixSelected{background:#fff8ec;border-left:3px solid #bc9054;padding-left:12px}
.akMatrixMobileOffer.akMatrixSelected strong{color:#956a34}
@media(max-width:850px){
 .akComparisonOnly{padding-top:25px!important}
 .akMatrixDesktop{display:none}
 .akMatrixMobile{display:grid;gap:11px}
}
@media(max-width:600px){
 .akComparisonOnly{padding:23px 0 16px!important}
 .akComparisonOnly .akEditorialHeading h3{font-size:21px!important}
 .akMatrixMobile{gap:9px}
 .akMatrixMobileCriterion h4{font-size:12px;padding:11px 12px}
 .akMatrixMobileOffer{grid-template-columns:71px minmax(0,1fr);gap:9px;padding:11px 12px}
 .akMatrixMobileOffer.akMatrixSelected{padding-left:9px}
 .akMatrixMobileOffer strong{font-size:10px}
 .akMatrixMobileOffer p{font-size:11px}
}


/* Retour ciblé depuis les cartes des pôles vers l'offre publique détaillée. */

/* Comparatif AK PRIME : typographie en 2 niveaux, ✓ inclus / × non inclus. */
.akMatrixTable,.akMatrixMobile{font-family:"Segoe UI",Inter,ui-sans-serif,system-ui,sans-serif}
.akMatrixTable th,.akMatrixTable td{padding:14px 13px;line-height:1.4}
.akMatrixTable thead th{font-size:13px;letter-spacing:.01em}
.akMatrixTable tbody th{font-size:12px;font-weight:900;line-height:1.5;letter-spacing:.005em;text-transform:none}
.akMatrixTable tbody td{vertical-align:middle}
.akMatrixCell{display:flex;align-items:flex-start;gap:9px;min-width:0}
.akMatrixCellCopy{display:block;min-width:0}
.akMatrixCellCopy>strong{display:block;color:#17344b;font-size:13px;line-height:1.3;font-weight:850;letter-spacing:-.012em;overflow-wrap:break-word}
.akMatrixCellCopy>small{display:block;margin-top:4px;color:#71849a;font-weight:450;font-size:11px;line-height:1.5;overflow-wrap:break-word}
.akMatrixTable .akMatrixSelected .akMatrixCellCopy>strong,.akMatrixMobileOffer.akMatrixSelected .akMatrixCellCopy>strong{color:#654622}
.akMatrixYes{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;flex:0 0 22px;background:#e0f3e9;color:#16724c;font-size:15px;font-weight:950;line-height:1}
.akMatrixNo{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;background:#fbe8e7;color:#ae504b;font-weight:900;font-size:18px;line-height:1}
.akMatrixPriceCell{gap:0}
.akMatrixPriceCell .akMatrixCellCopy>strong{font-size:20px;font-weight:950;letter-spacing:-.045em;white-space:nowrap;color:#17344b}
.akMatrixPriceCell .akMatrixCellCopy>small{margin-top:3px;font-size:10px;color:#8593a1;line-height:1.25}
.akMatrixTable thead .akMatrixSelected{background:#f3e5ca!important}
.akMatrixTable .akMatrixSelected{background:#fff8eb!important}
.akMatrixMobileOffer{grid-template-columns:95px minmax(0,1fr);align-items:center}
.akMatrixMobileOffer>strong{align-self:start;padding-top:4px}
.akMatrixMobileOffer .akMatrixCellCopy>strong{font-size:12px}
.akMatrixMobileOffer .akMatrixCellCopy>small{font-size:10.5px}
.akMatrixMobileOffer .akMatrixPriceCell .akMatrixCellCopy>strong{font-size:18px}
@media(max-width:600px){
 .akMatrixMobileOffer{grid-template-columns:82px minmax(0,1fr);gap:10px;align-items:start}
 .akMatrixMobileOffer .akMatrixCell{gap:8px}
 .akMatrixMobileOffer .akMatrixYes,.akMatrixMobileOffer .akMatrixNo{width:20px;height:20px;flex-basis:20px}
 .akMatrixMobileOffer .akMatrixCellCopy>strong{font-size:12px}
 .akMatrixMobileOffer .akMatrixCellCopy>small{font-size:10.5px}
 .akMatrixMobileOffer .akMatrixPriceCell .akMatrixCellCopy>strong{font-size:19px}
}

function offerBaseMonthlyPrice(pole,offer){
 const catalogPrice=publicCatalogPrice(pole,offer,0);
 if(catalogPrice)return catalogPrice;
 const p=String(pole||'').toLowerCase(),o=String(offer||'').toLowerCase();
 if(p.includes('forme')){
   if(o.includes('renfor'))return 149;
   if(o.includes('standard'))return 99;
 }
 if(p.includes('performance')){
   if(/\bp3\b/.test(o))return 299;
   if(/\bp2\b/.test(o))return 199;
   if(/\bp1\b/.test(o))return 149;
 }
 if(p.includes('mental')){
   if(o.includes('sportif'))return 249;
   if(o.includes('particulier'))return 199;
 }
 return null;
}
function publicOfferCode(pole,offer){
 const p=String(pole||'').toLowerCase(),o=String(offer||'').toLowerCase();
 if(p.includes('forme')){
   if(o.includes('renfor'))return 'forme_renforce';
   if(o.includes('standard'))return 'forme_standard';
 }
 if(p.includes('performance')){
   if(/\bp3\b/.test(o))return 'performance_p3';
   if(/\bp2\b/.test(o))return 'performance_p2';
   if(/\bp1\b/.test(o))return 'performance_p1';
 }
 if(p.includes('mental')){
   if(o.includes('sportif'))return 'mental_sportif';
   if(o.includes('particulier'))return 'mental_particulier';
 }
 return '';
}

function renewalPriceDetails(client,decision,paymentMode){

 if(!base)return null;
 if(decision==='3_months'){
   const monthlyTotal=base*3;
   const upfrontTotal=Math.round(monthlyTotal*.97*100)/100;
   return paymentMode==='upfront'
     ? {headline:euro(upfrontTotal)+' comptant',detail:'au lieu de '+euro(monthlyTotal)+' • remise comptant 3 %',base}
     : {headline:euro(base)+' / mois',detail:'pendant 3 mois • total '+euro(monthlyTotal),base};
 }
 if(decision==='6_months'){
   const discountedMonthly=Math.round(base*.95*100)/100;
   const monthlyTotal=Math.round(discountedMonthly*6*100)/100;
   const upfrontTotal=Math.round(monthlyTotal*.98*100)/100;
   return paymentMode==='upfront'
     ? {headline:euro(upfrontTotal)+' comptant',detail:'tarif 6 mois -5 %, puis remise comptant 2 % • au lieu de '+euro(base*6),base}
     : {headline:euro(discountedMonthly)+' / mois',detail:'pendant 6 mois • total '+euro(monthlyTotal)+' • remise engagement 6 mois 5 %',base};
 }
 if(decision==='monthly'){
   return {headline:'Tarif sans engagement à finaliser',detail:'Le tarif mensuel sans engagement sera fixé avant l’activation du paiement. Ton offre actuelle est à '+euro(base)+' / mois avec engagement.',base};
 }
 return null;
}

async function saveCoachOptitrainerUrl(value,button){

  if(notice){notice.textContent='Renseigne une URL complète commençant par https:// (sans identifiants intégrés).';notice.style.color='#b42318';}

    .select('id,optitrainer_url').single();

 }

function passportTestGroups(tests){
 const groups={};
 for(const t of tests||[]){
   const n=Number(t.value);
   if(!Number.isFinite(n)||!t.name)continue;
   const key=normalizeTestName(t.name);
   if(!groups[key])groups[key]={name:t.name,unit:t.unit||'',rows:[]};
   groups[key].rows.push({...t,num:n});
 }
 Object.values(groups).forEach(g=>g.rows.sort((a,b)=>String(a.date).localeCompare(String(b.date))));
 return Object.values(groups).sort((a,b)=>b.rows.length-a.rows.length);
}
function passportLineChart(group){
 if(!group||!group.rows?.length)return '<div class="pp-empty">Ajoute des résultats numériques pour afficher une courbe d’évolution.</div>';
 const rows=group.rows,vals=rows.map(r=>r.num),min=Math.min(...vals),max=Math.max(...vals),range=(max-min)||1;
 const W=680,H=215,L=42,R=18,T=22,B=30,innerW=W-L-R,innerH=H-T-B;
 const pts=rows.map((r,i)=>({x:L+(rows.length===1?innerW/2:i*innerW/(rows.length-1)),y:T+(max-r.num)/range*innerH,r}));
 const line=pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
 const area=L+','+(T+innerH)+' '+line+' '+(L+innerW)+','+(T+innerH);
 const grid=[0,.25,.5,.75,1].map(f=>{const y=T+innerH*f;return '<line class="pp-chart-grid" x1="'+L+'" y1="'+y+'" x2="'+(L+innerW)+'" y2="'+y+'"/>';}).join('');
 const labels=pts.map((p,i)=>'<g><circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="#e7b96d"/><text class="pp-chart-value" x="'+p.x+'" y="'+(p.y-9)+'" text-anchor="middle">'+esc(String(p.r.value))+'</text>'+(i===0||i===pts.length-1?'<text class="pp-chart-axis" x="'+p.x+'" y="'+(H-8)+'" text-anchor="middle">'+esc(fmtDate(p.r.date))+'</text>':'')+'</g>').join('');
 return '<svg class="pp-chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Évolution '+esc(group.name)+'">'+grid+'<polygon points="'+area+'" fill="#d6a85c" opacity=".10"/><polyline points="'+line+'" fill="none" stroke="#e7b96d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>'+labels+'</svg>';
}
function passportBars(groups){
 const usable=(groups||[]).filter(g=>g.rows.length).slice(0,4);
 if(!usable.length)return '<div class="pp-empty">Les comparaisons apparaîtront ici dès que des tests seront renseignés.</div>';
 const W=520,H=210,base=166,barW=22,gap=105;
 let body='';
 usable.forEach((g,i)=>{
   const first=g.rows[0],last=g.rows[g.rows.length-1],mx=Math.max(Math.abs(first.num),Math.abs(last.num),1);

function cycleProgressPct(cycle){
 if(!cycle?.start||!cycle?.end)return 0;
 const s=new Date(cycle.start+'T12:00:00Z'),e=new Date(cycle.end+'T12:00:00Z'),n=new Date();
 if(!(e>s))return 0;

}
function passportMetricDelta(group){
 if(!group?.rows?.length)return null;
 const first=group.rows[0],last=group.rows[group.rows.length-1];
 const initial=Number(first.num),current=Number(last.num);
 if(!Number.isFinite(initial)||!Number.isFinite(current))return null;
 const lib=testLibraryItem(group.name);
 const raw=current-initial;
 const pct=initial!==0?raw/Math.abs(initial)*100:null;
 const direction=lib?.better||'neutral';
 let improved=null;
 if(group.rows.length>=2&&Math.abs(raw)>1e-9){
   improved=direction==='higher'?raw>0:direction==='lower'?raw<0:null;
 }
 return {first,last,initial,current,raw,pct,direction,improved,count:group.rows.length};
}
function passportSigned(v,digits=1){

function passportCycleStats(cycle){
 if(!cycle?.start||!cycle?.end)return {pct:0,weekNow:null,weeks:null,remaining:null};
 const start=new Date(cycle.start+'T12:00:00Z'),end=new Date(cycle.end+'T12:00:00Z'),now=new Date();
 if(!(end>start))return {pct:0,weekNow:null,weeks:null,remaining:null};
 const totalDays=Math.max(1,Math.ceil((end-start)/86400000));
 const weeks=Math.max(1,Math.ceil(totalDays/7));
 const elapsedDays=Math.max(0,Math.ceil((now-start)/86400000));
 const weekNow=Math.max(1,Math.min(weeks,Math.ceil((elapsedDays+1)/7)));

}

 const days=[['Lundi',1],['Mardi',2],['Mercredi',3],['Jeudi',4],['Vendredi',5],['Samedi',6],['Dimanche',7]];
 const windows=db.availabilityWindows||[], dated=db.availabilityDateWindows||[], exceptions=db.availabilityExceptions||[];

 const today=new Date();today.setHours(12,0,0,0);
 const planningDays=[];
 for(let i=0;i<21;i++){const d=new Date(today);d.setDate(today.getDate()+i);planningDays.push(d)}
 const weekGroups=[planningDays.slice(0,7),planningDays.slice(7,14),planningDays.slice(14,21)];

   const cards=week.map(d=>{
     const iso=localDateISO(d);

   }).join('');

 }).join('');

function printInvoice(id){

function openManualInvoice(clientId){

   modal('Facturation à compléter','<div class="alert"><strong>Impossible d’émettre une facture définitive maintenant.</strong><div class="tiny" style="margin-top:5px">Le SIREN, le SIRET et l’adresse de facturation doivent être enregistrés avant la première facture.</div></div>','<button class="btn ghost" id="closeBillingLock">Fermer</button><button class="btn primary" id="goBillingSettings">Ouvrir les paramètres</button>');
   document.getElementById('closeBillingLock').onclick=closeModal;
   document.getElementById('goBillingSettings').onclick=()=>{closeModal();state.view='settings';render()};
   return;
 }
 const clients=db.clients.filter(c=>c.status!=='Inactif');
 if(!clients.length)return alert('Crée d’abord un dossier client.');
 const selected=clients.find(c=>c.id===clientId)||clients[0];
 const options=clients.map(c=>'<option value="'+c.id+'" '+(c.id===selected.id?'selected':'')+'>'+esc(c.name+' — '+c.pole+' '+c.offer)+'</option>').join('');
 const defaultAmount=offerBaseMonthlyPrice(selected.pole,selected.offer)||0;
 const defaultDesc='Accompagnement AK PRIME — '+selected.pole+' '+selected.offer;
 modal('Émettre une facture',
  '<div class="alert blue"><strong>Facture définitive.</strong><div class="tiny" style="margin-top:4px">Après émission, les données légales et le numéro ne pourront plus être modifiés. Une correction devra passer par un avoir.</div></div>'+
  '<div class="field"><label>Client</label><select class="select" id="invoiceClient">'+options+'</select></div>'+
  '<div class="field"><label>Prestation</label><input class="input" id="invoiceDescription" value="'+esc(defaultDesc)+'"></div>'+
  '<div class="grid2"><div class="field"><label>Montant (€)</label><input class="input" id="invoiceAmount" type="number" min="0.01" step="0.01" value="'+Number(defaultAmount).toFixed(2)+'"></div><div class="field"><label>Date de prestation</label><input class="input" id="invoiceServiceDate" type="date" value="'+localDateISO()+'"></div></div>'+
  '<div class="field"><label>Adresse de facturation du client (facultatif pour un particulier)</label><textarea class="textarea" id="invoiceCustomerAddress"></textarea></div>'+
  '<div class="grid2"><div class="field"><label>Situation du paiement</label><select class="select" id="invoicePaymentStatus"><option value="pending">À encaisser</option><option value="paid">Déjà encaissée</option></select></div><div class="field" id="invoicePaymentMethodWrap" style="display:none"><label>Mode de règlement</label><select class="select" id="invoicePaymentMethod"><option value="card">Carte</option><option value="bank_transfer">Virement</option><option value="cash">Espèces</option><option value="check">Chèque</option><option value="other">Autre</option></select></div></div>',
  '<button class="btn ghost" id="cancelInvoice">Annuler</button><button class="btn primary" id="confirmInvoice">Émettre la facture</button>');
 const clientEl=document.getElementById('invoiceClient'),descEl=document.getElementById('invoiceDescription'),amountEl=document.getElementById('invoiceAmount'),statusEl=document.getElementById('invoicePaymentStatus'),methodWrap=document.getElementById('invoicePaymentMethodWrap');
 clientEl.onchange=()=>{const c=db.clients.find(x=>x.id===clientEl.value);if(!c)return;descEl.value='Accompagnement AK PRIME — '+c.pole+' '+c.offer;amountEl.value=Number(offerBaseMonthlyPrice(c.pole,c.offer)||0).toFixed(2)};
 statusEl.onchange=()=>{methodWrap.style.display=statusEl.value==='paid'?'block':'none'};
 document.getElementById('cancelInvoice').onclick=closeModal;
 document.getElementById('confirmInvoice').onclick=async()=>{
   const amount=Math.round(Number(amountEl.value||0)*100),description=descEl.value.trim(),paymentStatus=statusEl.value,paymentMethod=paymentStatus==='paid'?document.getElementById('invoicePaymentMethod').value:null;
   if(amount<=0)return alert('Indique un montant valide.');

   if(!confirm('Émettre cette facture définitive pour '+centsMoney(amount)+' ?'))return;
   const btn=document.getElementById('confirmInvoice');btn.disabled=true;btn.textContent='Émission…';
   const {data,error}=await supa.rpc('issue_manual_invoice',{p_client_id:clientEl.value,p_description:description,p_amount_cents:amount,p_service_date:document.getElementById('invoiceServiceDate').value||localDateISO(),p_customer_billing_address:document.getElementById('invoiceCustomerAddress').value.trim()||null,p_payment_status:paymentStatus,p_payment_method:paymentMethod,p_paid_at:paymentStatus==='paid'?new Date().toISOString():null});
   if(error){btn.disabled=false;btn.textContent='Émettre la facture';return alert('Impossible d’émettre la facture : '+error.message)}
   closeModal();
   await loadSupabaseData();
   const created=Array.isArray(data)?data[0]:data;
   toast('Facture '+(created?.invoice_number||'créée'));
   render();
 };
}

function exportRevenueCsv(){

let contractEvidence=[];
let contractEvidenceError='';
function contractsPage(){
 if(authProfile?.role!=='owner')return '<div class="alert">Accès réservé au propriétaire.</div>';
 // Un même client peut avoir effectué plusieurs achats fictifs :
 // conserver toutes les preuves, mais n'afficher qu'une ligne par identité TEST.
 const grouped=new Map();
 for(const proof of contractEvidence){
  const groupKey=proof.is_test?'test:'+String(proof.email||proof.id).trim().toLowerCase():'real:'+proof.id;
  if(!grouped.has(groupKey))grouped.set(groupKey,[]);
  grouped.get(groupKey).push(proof);
 }
 const proofGroups=[...grouped.values()];
 const proofButtons=o=>{
  const archived=!o.contract_snapshot&&!!o.evidence_checksum;
  if(archived)return '<span class="muted tiny">Archive locale à réimporter.</span>';
  return '<div class="row" style="flex-wrap:wrap;gap:5px">'+
   '<button class="btn ghost small exportContractEvidence" data-id="'+esc(o.id)+'">JSON</button>'+
   '<button class="btn ghost small printContractEvidence" data-id="'+esc(o.id)+'">PDF</button>'+
   (o.is_test?'':'<button class="btn ghost small archiveContractEvidence" data-id="'+esc(o.id)+'">Archiver</button>')+
   '</div>';
 };
 const rows=proofGroups.map(group=>{
  const o=group[0],archived=!o.contract_snapshot&&!!o.evidence_checksum;
  const isMultiple=group.length>1;
  const actions=isMultiple?
   '<details class="akContractOrderDetails" style="min-width:240px">'+
   '<summary style="cursor:pointer;color:#205273;font-weight:800;padding:9px 0">Voir les '+group.length+' commandes TEST</summary>'+
   group.map((p,i)=>'<div style="border-top:1px solid #dde5eb;padding:10px 0">'+
     '<strong>Essai '+(group.length-i)+'</strong> · '+fmtDateTime(p.created_at||p.paid_at)+
     '<div class="muted tiny">'+esc(p.offer_code)+' · '+esc(p.commitment_months)+' mois · '+euro(Number(p.total_cents||0)/100)+'</div>'+
     '<div style="margin-top:7px">'+proofButtons(p)+'</div></div>').join('')+
   '</details>':proofButtons(o);
  return '<tr><td>'+
   (o.is_test?'<span class="status amber">TEST — simulation</span><div style="height:5px"></div>':'')+
   esc(o.full_name||'—')+'<div class="muted tiny">'+esc(o.email||'')+'</div>'+
   (isMultiple?'<div class="muted tiny" style="margin-top:5px"><strong>'+group.length+' commandes TEST</strong> pour ce compte.</div>':'')+
   '</td><td>'+esc(o.offer_code||'')+'<div class="muted tiny">'+esc(o.commitment_months)+' mois • '+esc(o.payment_mode)+'</div></td>'+
   '<td>'+(isMultiple?'<span class="muted tiny">Voir les essais</span>':euro(Number(o.total_cents||0)/100))+'</td>'+
   '<td>'+esc(o.cgv_version||'—')+'<div class="muted tiny">'+esc(o.cgv_accepted_at||'—')+'</div></td>'+
   '<td>'+(archived?'<span class="status blue">Archivée hors site</span>':'<span class="status green">'+(isMultiple?group.length+' preuves disponibles':'Preuve disponible')+'</span>')+
   '<div class="muted tiny">'+esc(o.status||'')+'</div></td>'+
   '<td style="min-width:185px">'+actions+'</td></tr>';
 }).join('');
 return '<div class="page-title"><div><h1>Preuves contractuelles</h1><p>Les preuves sont regroupées par client. Les paiements réels et les simulations restent séparés. Chaque commande conserve sa preuve distincte. Propriétaire uniquement.</p></div><button class="btn primary" id="refreshContractEvidence">Actualiser</button></div>'+
 (contractEvidenceError?'<div class="alert red">'+esc(contractEvidenceError)+'</div>':'')+
 '<div class="card panel"><div class="row between"><div><h3>'+proofGroups.length+' client(s) / dossier(s) · '+contractEvidence.length+' preuve(s)</h3><div class="muted tiny">Supabase conserve l’index de preuve après archivage. L’archive locale doit être sauvegardée dans deux emplacements privés.</div></div><button class="btn ghost" id="downloadAllContractEvidence">Exporter les preuves disponibles (JSON)</button></div>'+
 '<div class="row" style="flex-wrap:wrap;gap:10px;margin-top:12px"><label class="btn ghost" for="importContractEvidence" style="cursor:pointer">Réimporter un JSON individuel</label><input type="file" accept=".json,application/json" id="importContractEvidence" style="display:none"></div>'+
 '<div style="overflow-x:auto;margin-top:15px"><table class="table"><thead><tr><th>Client</th><th>Offre</th><th>Total</th><th>CGV acceptées</th><th>Stockage</th><th>Actions</th></tr></thead><tbody>'+(rows||'<tr><td colspan="6" class="muted">Aucun dossier enregistré.</td></tr>')+'</tbody></table></div>'+
 '<div class="alert" style="margin-top:12px"><strong>Important :</strong> archiver retire uniquement le document contractuel complet de Supabase ; les informations indispensables au suivi de commande restent conservées. Le bouton PDF ouvre l’impression du navigateur : choisissez « Enregistrer en PDF ». Le PDF sert à la lecture ; <strong>conservez impérativement le fichier JSON</strong> pour le réimport et la vérification.</div></div>';
}
function downloadContractJSON(data,filename){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function loadContractEvidence(){
 if(authProfile?.role!=='owner')return;
 // Contrats de production et consentements de simulation sont conservés séparément.
 const [real,test,live]=await Promise.all([
   supa.rpc('owner_contract_evidence'),
   supa.rpc('owner_stripe_test_consent_evidence'),
   supa.rpc('owner_stripe_live_consent_evidence')
 ]);
 contractEvidenceError=[real.error?.message,test.error?.message,live.error?.message].filter(Boolean).join(' · ');
 contractEvidence=[...(Array.isArray(real.data)?real.data:[]),
   ...(Array.isArray(test.data)?test.data:[]),
   ...(Array.isArray(live.data)?live.data:[])].sort((x,y)=>
    String(y.created_at||'').localeCompare(String(x.created_at||'')));
}
function printContractEvidence(o){
 const p=window.open('','_blank');
 if(!p){alert('Autorisez les fenêtres contextuelles pour enregistrer le PDF.');return;}
 const field=(k,v)=>'<tr><th style="text-align:left;padding:7px;border-bottom:1px solid #ddd">'+esc(k)+'</th><td style="padding:7px;border-bottom:1px solid #ddd">'+esc(String(v??'—'))+'</td></tr>';
 const rows=[['Référence',o.id],['Client',o.full_name],['E-mail',o.email],['Offre',o.offer_code],['Engagement',o.commitment_months+' mois'],['Démarrage demandé',o.start_mode==='date'?fmtDate(o.requested_start_date):'Dès que possible'],['Démarrage confirmé',o.confirmed_start_date?fmtDate(o.confirmed_start_date):'En attente du paiement'],['Règlement',o.payment_mode],['Total',euro(Number(o.total_cents)/100)],['Version des CGV',o.cgv_version],['Acceptation',o.cgv_accepted_at],['Démarrage anticipé',o.early_start_requested?'Oui':'Non'],['Demande anticipée le',o.early_start_requested_at],['Consentement santé',o.health_consent?'Oui':'Non'],['Version confidentialité',o.privacy_version],['Statut',o.status]].map(x=>field(...x)).join('');
 p.document.write('<!doctype html><html lang="fr"><meta charset="utf-8"><title>AK PRIME — Preuve '+esc(o.id)+'</title><style>body{font-family:Arial,sans-serif;padding:35px;color:#19283c}h1{font-size:24px}table{width:100%;border-collapse:collapse}small{color:#667085}</style><h1>AK PRIME — Récapitulatif de preuve contractuelle</h1><small>Document de lecture. Conservez aussi le JSON original pour le contrôle et le réimport.</small><table>'+rows+'</table><p><small>Document généré pour archivage privé, sans certification de signature électronique.</small></p></html>');
 p.document.close();p.focus();setTimeout(()=>p.print(),400);
}
function bindContractEvidence(){
 document.getElementById('refreshContractEvidence')?.addEventListener('click',async()=>{await loadContractEvidence();render()});
 document.getElementById('downloadAllContractEvidence')?.addEventListener('click',()=>{
  downloadContractJSON({exported_at:new Date().toISOString(),records:contractEvidence.filter(o=>o.contract_snapshot)},'ak-prime-preuves-completes.json');
 });
 document.querySelectorAll('.exportContractEvidence').forEach(b=>b.addEventListener('click',()=>{
  const record=contractEvidence.find(x=>x.id===b.dataset.id);
  if(record?.contract_snapshot)downloadContractJSON(record,'ak-prime-preuve-'+record.id+'.json');
 }));
 document.querySelectorAll('.printContractEvidence').forEach(b=>b.addEventListener('click',()=>{const o=contractEvidence.find(x=>x.id===b.dataset.id);if(o?.contract_snapshot)printContractEvidence(o)}));
 document.querySelectorAll('.archiveContractEvidence').forEach(b=>b.addEventListener('click',async()=>{
  const o=contractEvidence.find(x=>x.id===b.dataset.id);
  if(!o?.contract_snapshot)return;
  const answer=prompt('Avant de retirer la copie intégrale du serveur, téléchargez le JSON du dossier et sauvegardez-le sur deux supports privés. Le serveur ne pourra PAS le recréer si vous perdez le fichier. Pour confirmer, saisissez ARCHIVER :');
  if(answer!=='ARCHIVER')return;
  b.disabled=true;
  const {error}=await supa.rpc('owner_archive_contract_evidence',{p_order_id:o.id});
  if(error)alert('Archivage refusé : '+error.message);
  await loadContractEvidence();render();
 }));
 document.getElementById('importContractEvidence')?.addEventListener('change',async e=>{
  const file=e.target.files?.[0];if(!file)return;
  if(file.size>2_000_000){alert('Fichier trop volumineux.');return;}
  try{
   const parsed=JSON.parse(await file.text());
   if(!parsed?.id||!parsed?.contract_snapshot||Array.isArray(parsed))throw Error('Choisissez un export JSON individuel complet.');
   if(!confirm('Réimporter la preuve '+parsed.id+' dans Supabase ? Le serveur vérifiera son empreinte.'))return;
   const {error}=await supa.rpc('owner_restore_contract_evidence',{p_order_id:parsed.id,p_snapshot:parsed.contract_snapshot});
   if(error)throw Error(error.message);
   await loadContractEvidence();render();alert('Archive restaurée et vérifiée.');
  }catch(err){alert('Import refusé : '+err.message)}
  e.target.value='';
 });
}

function openRenewalModal(cl){
 if(!cl?.end)return toast('Ajoute une date de fin d’engagement');
 modal('Renouvellement — '+esc(cl.name),
 '<div class="alert blue"><strong>Échéance actuelle : '+fmtDate(cl.end)+'</strong><div class="tiny" style="margin-top:4px">Choisis la suite de l’accompagnement et valide les éléments de fin de cycle.</div></div>'+
 '<div class="field"><label>Décision</label><select id="renewDecision" class="select"><option value="3_months">Renouvellement 3 mois</option><option value="6_months">Renouvellement 6 mois</option><option value="monthly">Passage en mensuel</option><option value="stop">Arrêt à l’échéance</option></select></div>'+
 '<label class="check"><input id="renewReview" type="checkbox"> Bilan de cycle réalisé</label>'+
 '<label class="check"><input id="renewRetestsRequired" type="checkbox"> Retests nécessaires</label>'+
 '<label class="check"><input id="renewRetestsDone" type="checkbox"> Retests réalisés</label>'+
 '<label class="check"><input id="renewObjectives" type="checkbox"> Nouveaux objectifs définis / mis à jour</label>'+
 '<div class="field"><label>Notes de renouvellement</label><textarea id="renewNotes" class="textarea" placeholder="Bilan, éléments discutés avec le client, suite prévue…"></textarea></div>',
 '<button class="btn ghost" id="cancelM">Annuler</button><button class="btn primary" id="saveM">Valider le renouvellement</button>');
 const clientChoice=(cl.renewalChoices||[]).find(r=>r.dueDate===cl.end);
 if(clientChoice)document.getElementById('renewDecision').value=clientChoice.decision;
 document.getElementById('cancelM').onclick=closeModal;
 document.getElementById('renewRetestsRequired').onchange=e=>{if(!e.target.checked)document.getElementById('renewRetestsDone').checked=false};
 document.getElementById('saveM').onclick=async()=>{
   const decision=document.getElementById('renewDecision').value;
   const review=document.getElementById('renewReview').checked;
   const retestsRequired=document.getElementById('renewRetestsRequired').checked;
   const retestsDone=document.getElementById('renewRetestsDone').checked;
   const objectives=document.getElementById('renewObjectives').checked;
   const notes=document.getElementById('renewNotes').value.trim();
   if(retestsRequired&&!retestsDone&&!confirm('Les retests sont marqués nécessaires mais pas encore réalisés. Valider quand même le renouvellement ?'))return;
   const months=decision==='3_months'?3:decision==='6_months'?6:decision==='monthly'?1:0;
   const newEnd=months?addMonthsISO(cl.end,months):null;
   const row={client_id:cl.id,due_date:cl.end,decision,cycle_review_done:review,retests_required:retestsRequired,retests_done:retestsDone,objectives_updated:objectives,notes:notes||null,previous_end_date:cl.end,new_end_date:newEnd};
   const {error}=await supa.from('renewals').insert(row);
   if(error)return toast(error.code==='23505'?'Cette échéance a déjà été traitée.':'Erreur : '+error.message);
   if(newEnd){
     const {error:updateErr}=await supa.from('clients').update({engagement_end_date:newEnd,status:'active'}).eq('id',cl.id);
     if(updateErr)return toast('Renouvellement enregistré, mais erreur de date : '+updateErr.message);
   }
   cl.renewal=decision==='3_months'?'3 mois':decision==='6_months'?'6 mois':decision==='monthly'?'Mensuel':'Arrêt';
   try{await saveWorkspace(cl)}catch(e){}
   const eventTitle=decision==='stop'?'Fin d’accompagnement prévue':'Renouvellement '+renewalDecisionLabel(decision);
   await supa.from('passport_events').insert({client_id:cl.id,event_date:localDateISO(),title:eventTitle,detail:decision==='stop'?'Arrêt prévu à l’échéance du '+fmtDate(cl.end)+'.':'Nouvelle échéance : '+fmtDate(newEnd)+'.',client_visible:true});
   closeModal();await loadSupabaseData();toast(decision==='stop'?'Arrêt enregistré':'Renouvellement enregistré');render();
 };
}

function openEvent(eventId=''){
 const client=currentClient();if(!client)return;
 const existing=eventId?(client.events||[]).find(e=>e.id===eventId):null;
 if(eventId&&!existing)return toast('Jalon introuvable : actualise le dossier.');
 if(existing&&!isEditablePassportEvent(existing))return toast('Les renouvellements se gèrent dans la partie administrative.');
 const editing=!!existing;
 const kind=existing?.eventType==='competition'||/\b(competition|championnat|match|tournoi|coupe|finale|meeting|course|epreuve)\b/i.test(existing?.title||'')?'competition':'milestone';
 const textDate=existing?.date||localDateISO();
 const modalTitle=editing?'Modifier le jalon — '+client.name:'Ajouter un jalon au parcours';
 modal(modalTitle,
   '<div class="field"><label>Date du jalon</label><input id="eDate" type="date" class="input" value="'+esc(textDate)+'" required></div>'+
   '<div class="field"><label>Type de jalon</label><select id="eKind" class="select">'+
     '<option value="milestone" '+(kind!=='competition'?'selected':'')+'>Autre jalon sportif</option>'+
     '<option value="competition" '+(kind==='competition'?'selected':'')+'>Compétition importante</option></select></div>'+
   '<div class="field"><label>Titre</label><input id="eTitle" class="input" maxlength="160" placeholder="Championnat, retour à l’entraînement, objectif atteint…" value="'+esc(existing?.title||'')+'" required></div>'+
   '<div class="field"><label>Précisions (facultatif)</label><textarea id="eDetail" class="textarea" maxlength="2000">'+esc(existing?.detail||'')+'</textarea></div>'+
   '<p class="muted tiny">Les échéances de tests et retests se planifient dans « Évaluations & échéances ». Les renouvellements restent dans le suivi administratif.</p>',
   '<button class="btn ghost" id="cancelM">Annuler</button><button class="btn primary" id="saveM">'+(editing?'Enregistrer les modifications':'Ajouter le jalon')+'</button>');
 document.getElementById('cancelM').onclick=closeModal;
 document.getElementById('saveM').onclick=async()=>{
   const date=document.getElementById('eDate').value;
   const title=document.getElementById('eTitle').value.trim();
   const detail=document.getElementById('eDetail').value.trim();
   const kind=document.getElementById('eKind').value;
   if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||!Number.isFinite(Date.parse(date+'T12:00:00Z')))
     return toast('Date de jalon invalide.');
   if(!title)return toast('Titre requis.');
   const button=document.getElementById('saveM');button.disabled=true;
   const row={event_date:date,title,detail:detail||null,event_type:kind};
   const query=editing?
     supa.from('passport_events').update(row).eq('id',existing.id).eq('client_id',client.id):
     supa.from('passport_events').insert({...row,client_id:client.id,client_visible:true});
   const {error}=await query.select('id').single();
   if(error){button.disabled=false;toast('Impossible d’enregistrer le jalon : '+error.message);return;}
   closeModal();
   try{await loadSupabaseData();render();toast(editing?'Jalon mis à jour.':'Jalon ajouté.');}
   catch(e){toast('Jalon enregistré, mais actualisation impossible : '+e.message);}
 };
}

function importData(e){
 const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result);if(!Array.isArray(parsed.clients))throw new Error();db=parsed;saveDB('Sauvegarde restaurée');state.view='dashboard';render()}catch(err){alert('Fichier de sauvegarde invalide.')}};r.readAsText(f)
}

   '<div class="row" style="margin-top:10px;flex-wrap:wrap">'+
   (!late?'<button class="btn ghost small clientRescheduleVisio" data-id="'+next.id+'">Déplacer</button>':'')+
   '<button class="btn danger small clientCancelVisio" data-id="'+next.id+'" data-late="'+(late?'1':'0')+'">Annuler</button>'+
   (normalizeWhatsAppNumber(s.appSettings?.whatsapp_number)?'<a class="btn primary small" href="'+esc(whatsappUrl(s.appSettings.whatsapp_number,'Bonjour Alex, je suis prêt(e) pour notre visio AK PRIME du '+fmtDateTime(next.starts_at)+'.'))+'" target="_blank" rel="noopener" style="text-decoration:none">📹 WhatsApp</a>':'')+
   '</div></div>';
 })():(preview?'<div class="client-section-card akWowUpcoming" style="margin-top:0"><div class="muted tiny">APERÇU FICTIF · VISIO NON RÉSERVÉE</div><strong style="font-size:18px">'+fmtDateTime(preview.starts_at)+'</strong><div class="muted tiny" style="margin-top:6px">Simulation de suivi P3, 30 min. Aucun vrai créneau bloqué ni quota consommé.</div><div class="muted tiny" style="margin-top:8px">Réservation réelle possible avec les créneaux ci-dessous.</div></div>':
'<div class="client-section-card akWowUpcoming" style="margin-top:0"><div class="muted tiny">PROCHAINE VISIO</div><strong style="font-size:18px">Aucune visio réservée</strong><div class="muted tiny" style="margin-top:5px">Choisis un créneau ci-dessous.</div></div>');
 const weekButtons=[0,1,2].map(i=>'<button class="clientWeekBtn '+(clientVisioWeek===i?'on':'')+'" data-week="'+i+'">Semaine '+(i+1)+' <span class="tiny" style="opacity:.7">('+weeks[i].length+')</span></button>').join('');
 const dayButtons=dates.map(date=>{
   const d=new Date(date+'T12:00:00');

   const dm=new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'2-digit'}).format(d);
   return '<button class="client-day-btn clientDayBtn '+(clientVisioDay===date?'on':'')+'" data-date="'+date+'"><strong>'+esc(wd)+'</strong><span>'+esc(dm)+' • '+byDate[date].length+'</span></button>';
 }).join('');

 return nextActions+

async function refreshClientBookingData(){
 if(!clientPortalState?.client)return;

 const [slots,appts,policy]=await Promise.all([
   supa.rpc('get_my_available_slots',{p_from:today,p_to:localDateISO(end)}),
   supa.from('appointments').select('*').eq('client_id',clientPortalState.client.id).order('starts_at',{ascending:true}),
   supa.rpc('get_my_booking_policy')
 ]);
 if(!slots.error)clientPortalState.availableSlots=slots.data||[];
 if(!appts.error)clientPortalState.appointments=appts.data||[];
 if(!policy.error)clientPortalState.bookingPolicy=(policy.data||[])[0]||clientPortalState.bookingPolicy;
 if(clientPortalView==='visios'){
   const panel=document.getElementById('clientBookingPanel');if(panel){panel.innerHTML=renderBookingPanel(clientPortalState);bindBookingButtons()}

   renderClientPortal();

}

async function subscribeCalendarRealtime(mode){
 if(calendarChannel)await supa.removeChannel(calendarChannel);
 const channel=supa.channel('akprime-calendar-'+mode+'-'+Math.random().toString(36).slice(2,7))
   .on('postgres_changes',{event:'UPDATE',schema:'public',table:'calendar_version'},async()=>{
     if(mode==='client')await refreshClientBookingData();
     else {
       try{await loadSupabaseData();if(state.view==='calendar'||state.view==='dashboard')render()}catch(e){}
     }
   });
 if(mode==='coach'&&authUser?.id){
   channel.on('postgres_changes',{
     event:'INSERT',schema:'public',table:'coach_new_client_events',
     filter:'owner_id=eq.'+authUser.id
   },async()=>{
     try{await loadSupabaseData();render()}catch(err){console.warn('AK PRIME new-client notification refresh',err)}
   });
 }
 calendarChannel=channel.subscribe();
}

 '<div class="portal-actions"><button type="button" class="btn ghost" id="saveQuestionnaireDraft">Enregistrer le brouillon</button><button type="button" class="btn primary" id="submitQuestionnaire">Envoyer au coach</button></div>'+
 '<div class="portal-note">Tes réponses sont enregistrées dans ton dossier AK PRIME et seront utilisées pour préparer la visio et l’accompagnement.</div></form>';
}
function renderQuestion(q,value){
 const req=q.required?'<span class="req"> *</span>':'';
 let input='';
 if(q.type==='textarea')input='<textarea class="textarea qinput" data-key="'+esc(q.key)+'">'+esc(value||'')+'</textarea>';
 else if(q.type==='select')input='<select class="select qinput" data-key="'+esc(q.key)+'" style="width:100%"><option value="">Choisir…</option>'+q.options.map(o=>'<option '+(String(value||'')===String(o)?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>';
 else if(q.type==='multiselect'){
   const vals=Array.isArray(value)?value:[];
   input='<div class="choices">'+q.options.map(o=>'<label class="choice"><input type="checkbox" class="qmulti" data-key="'+esc(q.key)+'" value="'+esc(o)+'" '+(vals.includes(o)?'checked':'')+'> <span>'+esc(o)+'</span></label>').join('')+'</div>';
 } else if(q.type==='consent')input='<label class="choice"><input type="checkbox" class="qconsent" data-key="'+esc(q.key)+'" '+(value===true?'checked':'')+'> <span>Je confirme</span></label>';
 else if(q.type==='scale'){
   const opts=[];for(let i=q.min||1;i<=(q.max||10);i++)opts.push('<option value="'+i+'" '+(String(value||'')===String(i)?'selected':'')+'>'+i+'</option>');
   input='<div class="scale-wrap"><span class="tiny muted">'+esc(q.lowLabel||'')+'</span><select class="select qinput" data-key="'+esc(q.key)+'"><option value="">—</option>'+opts.join('')+'</select><span class="tiny muted" style="text-align:right">'+esc(q.highLabel||'')+'</span></div>';
 } else input='<input class="input qinput" data-key="'+esc(q.key)+'" type="'+esc(q.type||'text')+'" value="'+esc(value||'')+'" style="width:100%">';
 return '<div class="qblock"><label class="qtitle">'+esc(q.label)+req+'</label>'+input+'</div>';
}
function collectQuestionnaire(template){
 const answers={},missing=[];
 for(const q of template.questions){
   let v;
   if(q.type==='multiselect')v=[...document.querySelectorAll('.qmulti[data-key="'+CSS.escape(q.key)+'"]:checked')].map(x=>x.value);
   else if(q.type==='consent')v=!!document.querySelector('.qconsent[data-key="'+CSS.escape(q.key)+'"]')?.checked;
   else v=document.querySelector('.qinput[data-key="'+CSS.escape(q.key)+'"]')?.value?.trim()||'';
   answers[q.key]=v;
   if(q.required&&((Array.isArray(v)&&!v.length)||v===''||v===false))missing.push(q.label);
 }
 return {answers,missing};
}
async function saveClientQuestionnaire(statusValue){
 const s=clientPortalState,t=s.template;if(!t)return;
 const {answers,missing}=collectQuestionnaire(t);
 if(statusValue==='submitted'&&missing.length){alert('Il reste '+missing.length+' champ(s) obligatoire(s) à compléter.\n\n• '+missing.slice(0,8).join('\n• ')+(missing.length>8?'\n…':''));return}
 const row={client_id:s.client.id,questionnaire_type:t.template_key,questionnaire_version:t.version,answers,status:statusValue,submitted_at:statusValue==='submitted'?new Date().toISOString():null};
 const {data,error}=await supa.from('questionnaire_responses').upsert(row,{onConflict:'client_id,questionnaire_type,questionnaire_version'}).select().single();
 if(error){alert('Impossible d’enregistrer : '+error.message);return}
 s.response=data;
 if(statusValue==='submitted')alert('Questionnaire envoyé au coach.');
 else alert('Brouillon enregistré.');
 renderClientPortal();
}

 '<section class="public-section" style="padding-top:0" id="faq"><div class="public-section-inner"><div class="public-section-head"><div class="kicker">Questions fréquentes</div><h2>Avant de commencer</h2><p>Les réponses essentielles pour choisir votre accompagnement sereinement.</p></div><div class="public-faq">'+
 '<details><summary>Faut-il déjà pratiquer un sport ou avoir de l’expérience ?</summary><p>Non. AK PRIME accompagne les personnes qui débutent, reprennent une activité ou pratiquent déjà régulièrement, ainsi que les personnes pratiquant un sport qui recherchent un suivi plus spécifique. Le pôle et la formule sont choisis selon vos objectifs et votre situation.</p></details>'+
 '<details><summary>Comment fonctionne l’accompagnement à distance ?</summary><p>Nous faisons le point sur vos objectifs et votre contexte, puis vous bénéficiez des prestations prévues par votre formule : programmation ou travail mental, bilans, analyses et échanges. Votre espace AK PRIME centralise votre suivi ; pour les programmes d’entraînement, un accès Optitrainer est également prévu.</p></details>'+
 '<details><summary>Combien de séances sont prévues chaque semaine ?</summary><p>Tous les accompagnements AK PRIME incluent la création de séances personnalisées, sans limite fixe de séances par semaine. Leur nombre et leur contenu sont adaptés à vos objectifs, vos disponibilités, votre rythme de vie et vos besoins, puis ajustés au fil de votre accompagnement. Le nombre de visioconférences, lui, dépend de la formule choisie.</p></details>'+ 
 '<details><summary>Ai-je besoin de matériel spécifique ?</summary><p>Pas nécessairement. Votre équipement, votre lieu de pratique et vos contraintes sont pris en compte dès le départ. Certains objectifs ou tests nécessitent toutefois du matériel ou un environnement adapté : nous le précisons avant de les mettre en place.</p></details>'+
 '<details><summary>Que comprend le Passeport AK PRIME ?</summary><p>C’est votre carnet de suivi sportif : il regroupe les informations importantes de votre parcours, les objectifs, bilans, évaluations et évolutions utiles selon votre formule. Il a aussi vocation à faciliter, avec votre accord, la transmission de votre historique à un futur coach ou club. La fonction de partage sera disponible après sa finalisation.</p></details>'+
 '<details><summary>Pourquoi ne proposez-vous pas d’abonnement de moins de 3 mois ?</summary><p>Une progression réelle se construit dans la durée. Un mois permet de commencer, mais c’est souvent trop court, ou tout juste suffisant, pour installer des habitudes et constater des progrès mesurables. Trois mois laissent le temps d’évaluer le point de départ, d’ajuster le travail et de comparer les résultats. Ce suivi ne garantit pas un résultat précis, mais il donne une base plus fiable pour progresser. Sur six mois, le travail peut encore se consolider.</p></details>'+
 '<details><summary>Puis-je payer chaque mois ou régler en une seule fois ?</summary><p>Les deux modalités sont prévues. Une réduction pour le paiement comptant est envisagée. Le montant total, l’échéancier et les éventuelles remises seront présentés avant la validation de votre commande.</p></details>'+
 '<details><summary>Que se passe-t-il à la fin de mon engagement ?</summary><p>Vous pourrez choisir de poursuivre votre accompagnement ou de l’arrêter, selon les options et conditions affichées à la souscription. Aucune nouvelle durée d’engagement ne doit être imposée sans votre accord.</p></details>'+
 '<details><summary>Puis-je arrêter mon accompagnement avant la fin de l’engagement ?</summary><p>Votre engagement de 3 ou 6 mois est ferme, même si vous payez chaque mois. Après les 14 jours de rétractation, un simple changement d’avis ne met pas automatiquement fin au contrat. Vous pouvez cependant demander une résiliation amiable : nous conviendrons par écrit de la date de fin et des éventuelles conséquences financières. Vos droits légaux restent applicables et une suspension peut être envisagée en cas d’empêchement temporaire sérieux.</p></details>'+
 '<details><summary>Dans quels cas puis-je être remboursé ?</summary><p>Un remboursement ou une régularisation peut intervenir notamment en cas de rétractation légale, de trop-perçu, de prestations non fournies ouvrant droit à restitution ou selon les termes d’une résiliation amiable écrite. Le seul changement d’avis ne donne pas automatiquement droit au remboursement des mensualités d’un engagement ferme. Un décompte détaillé vous sera communiqué. Si vous avez demandé à commencer pendant les 14 jours de rétractation, la partie des services effectivement fournis peut rester due dans les conditions légales.</p></details>'+
'</div></div></section>'+

function bindAkOfferDemo(pole,name){
 const shell=document.querySelector('.akOfferDemoShell');if(!shell)return;
 const state=akOfferDemoState(pole,name),body=shell.querySelector('.akOfferDemoBody');
 if(!state||!body)return;
 function setView(view){
  if(!['home','visios','checkin','suivi','passport','optitrainer','billing'].includes(view))return;
  if(view==='passport')passportBookPage='overview';
  shell.classList.toggle('akOfferDemoPassport',view==='passport');
  shell.classList.toggle('ak-wow',view!=='passport');
  shell.querySelectorAll('.akOfferDemoTab').forEach(b=>{
   const selected=b.dataset.demoView===view;
   b.classList.toggle('on',selected);b.setAttribute('aria-current',selected?'page':'false');
  });
  body.innerHTML=akOfferDemoScreen(state,view);
  body.dataset.demoView=view;
  body.scrollIntoView({block:'nearest',behavior:'auto'});
 }
 shell.addEventListener('click',function(event){
  const tab=event.target.closest('.akOfferDemoTab');
  const action=event.target.closest('.clientGoPassport,.clientGoFollow,.clientGoVisios,.clientGoCheckin');
  const subTab=event.target.closest('.passportBookTab');
  const metric=event.target.closest('.passportMetricBtn,.passportMetricJump');
  const passNav=event.target.closest('.passportInlineNav');
  if(tab||action||subTab||metric||passNav){
   event.preventDefault();event.stopPropagation();event.stopImmediatePropagation();
   if(metric){
     passportSelectedTestKey=metric.dataset.testKey||'';
     passportBookPage='progress';
     body.innerHTML=akOfferDemoScreen(state,'passport');
     return;
   }
   if(passNav){
     passportBookPage=passNav.dataset.passportPage||'overview';
     body.innerHTML=akOfferDemoScreen(state,'passport');
     return;
   }
   if(subTab){passportBookPage=subTab.dataset.passportPage||'overview';body.innerHTML=akOfferDemoScreen(state,'passport');return;}
   const view=tab?.dataset.demoView||(action?.classList.contains('clientGoPassport')?'passport':
    action?.classList.contains('clientGoVisios')?'visios':
    action?.classList.contains('clientGoCheckin')?'checkin':'suivi');
   setView(view);return;
  }
  // Seul le lien externe vers les véritables écrans officiels Optitrainer fonctionne.
  // Les formulaires et commandes simulées restent inactifs dans la démo.
  if(event.target.closest('a.akOptiRealLink'))return;
  if(event.target.closest('button,a,input,select,textarea')){
   event.preventDefault();event.stopImmediatePropagation();
   const hint=shell.querySelector('.akOfferDemoReadonlyStrip');
   if(hint){hint.textContent='DÉMONSTRATION EN LECTURE SEULE · AUCUNE RÉSERVATION, SAISIE, FACTURE OU CONNEXION RÉELLE';}
  }
 },true);
 shell.addEventListener('submit',event=>{event.preventDefault();event.stopImmediatePropagation();},true);
 shell.addEventListener('change',event=>{event.preventDefault();event.stopImmediatePropagation();},true);
}

function publicCheckoutPriceFallback(base,duration,paymentMode){
 base=Number(base)||0;
 if(duration===3){
   const monthlyTotal=base*3;
   if(paymentMode==='upfront'){
     const total=Math.round(monthlyTotal*.97*100)/100;
     return {headline:euro(total)+' comptant',detail:'au lieu de '+euro(monthlyTotal)+' • remise comptant 3 %',monthlyEquivalent:Math.round((total/3)*100)/100,total,source:'fallback'};
   }
   return {headline:euro(base)+' / mois',detail:'3 mensualités • total '+euro(monthlyTotal),monthlyEquivalent:base,total:monthlyTotal,source:'fallback'};
 }
 const discountedMonthly=Math.round(base*.95*100)/100;
 const sixTotal=Math.round(discountedMonthly*6*100)/100;
 if(paymentMode==='upfront'){
   const total=Math.round(sixTotal*.98*100)/100;
   return {headline:euro(total)+' comptant',detail:'remise engagement 6 mois 5 %, puis remise comptant 2 % • au lieu de '+euro(base*6),monthlyEquivalent:Math.round((total/6)*100)/100,total,source:'fallback'};
 }
 return {headline:euro(discountedMonthly)+' / mois',detail:'6 mensualités • total '+euro(sixTotal)+' • remise engagement 6 mois 5 %',monthlyEquivalent:discountedMonthly,total:sixTotal,source:'fallback'};
}
async function publicCheckoutPrice(pole,name,base,duration,paymentMode){
 const offerCode=publicOfferCode(pole,name);
 if(offerCode){
   const {data,error}=await supa.rpc('quote_offer',{
     p_offer_code:offerCode,
     p_commitment_months:Number(duration),
     p_payment_mode:paymentMode
   });
   const q=Array.isArray(data)?data[0]:data;
   if(!error&&q){
     const canonicalBase=Number(q.base_monthly_cents)/100;
     const monthlyEquivalent=Number(q.monthly_equivalent_cents)/100;
     const total=Number(q.total_cents)/100;
     let headline='',detail='';
     if(Number(duration)===3&&paymentMode==='monthly'){
       headline=euro(monthlyEquivalent)+' / mois';
       detail='3 mensualités • total '+euro(total);
     }else if(Number(duration)===3){
       headline=euro(total)+' comptant';
       detail='au lieu de '+euro(canonicalBase*3)+' • remise comptant 3 %';
     }else if(paymentMode==='monthly'){
       headline=euro(monthlyEquivalent)+' / mois';
       detail='6 mensualités • total '+euro(total)+' • remise engagement 6 mois 5 %';
     }else{
       headline=euro(total)+' comptant';
       detail='remise engagement 6 mois 5 %, puis remise comptant 2 % • au lieu de '+euro(canonicalBase*6);
     }
     return {headline,detail,monthlyEquivalent,total,source:'server',offerCode,base:canonicalBase};
   }
   console.warn('AK PRIME quote_offer indisponible, utilisation du tarif indicatif local.',error);
 }
 return {...publicCheckoutPriceFallback(base,duration,paymentMode),offerCode};
}

    '</div><div class="checkout-consent-note">La date demandée sera conservée avec la commande et confirmée au paiement. Un démarrage à moins de 14 jours de la commande exige une demande expresse ; sans celle-ci, « dès que possible » signifie au plus tôt 14 jours après paiement. Le démarrage de l’entraînement reste soumis à la finalisation de l’onboarding. Le paiement fictif s’effectuera sur la page sécurisée de Stripe après validation de ces informations.</div><div id="checkoutValidationError" class="checkout-error"></div>'+
    '<div class="checkout-price-box"><strong>'+esc(p.detail)+'</strong><div class="checkout-price-sub">'+(window.AKP_PUBLIC_TEST_MODE?'Stripe TEST uniquement : paiement fictif, aucun débit réel ni facture comptable.':'Paiement sécurisé avec Stripe. Le montant et l’engagement choisi seront confirmés avant validation du règlement.')+'</div></div>',
    '<button class="btn ghost" id="backPublicCheckout">Retour</button><button class="btn primary" id="futureStripeCheckout">'+(window.AKP_PUBLIC_TEST_MODE?'Payer avec Stripe (TEST)':'Payer avec Stripe')+'</button>');

       if(!Number.isFinite(days)||days<0||days>120)errors.push('La date de démarrage doit être comprise dans les 120 prochains jours.');
       else if(days<14&&!earlyStart)errors.push('Pour démarrer dans moins de 14 jours, coche la demande expresse de démarrage anticipé.');

     }
     errorBox.classList.remove('show');
     const submit=document.getElementById('futureStripeCheckout');submit.disabled=true;submit.textContent='Préparation du paiement sécurisé…';
