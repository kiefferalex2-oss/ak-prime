<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AK PRIME — Back-office V1</title>
<style>
:root{--bg:#eef2f7;--panel:#fff;--nav:#0f1c2c;--text:#111827;--muted:#667085;--line:#dfe6ef;--blue:#2f66f6;--blue2:#eaf0ff;--gold:#d2aa60;--green:#1f9d6a;--green2:#dff7ec;--red:#c93d3d;--red2:#fde8e8}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}.shell{min-height:100vh;display:grid;grid-template-columns:235px 1fr}.side{background:linear-gradient(180deg,var(--nav),#0a1522);color:#fff;padding:22px 18px;display:flex;flex-direction:column;gap:24px}.brand{font-size:24px;font-weight:900;letter-spacing:.08em}.brand small{display:block;color:#8ea0b6;font-size:10px;letter-spacing:.25em;margin-top:4px}.nav{display:flex;flex-direction:column;gap:8px}.nav button{border:0;background:transparent;color:#cad4e0;text-align:left;padding:12px 14px;border-radius:10px;cursor:pointer}.nav button.active,.nav button:hover{background:#1d4ed8;color:#fff}.foot{margin-top:auto;color:#8ea0b6;font-size:12px}.top{height:70px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.crumb{color:var(--muted);font-size:14px}.topr{display:flex;gap:10px;align-items:center}.search{width:250px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}.avatar{width:36px;height:36px;border-radius:50%;background:#16263a;color:#fff;display:grid;place-items:center;font-weight:800}.content{padding:24px 28px 40px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(16,24,40,.07)}.title{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.title h1{margin:0;font-size:30px}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--blue);color:#fff}.ghost{background:#fff;border:1px solid var(--line)}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.kpi{padding:18px}.kpi .l{color:var(--muted);font-size:13px}.kpi .v{font-size:28px;font-weight:900;margin-top:6px}.tablehead{display:flex;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}.tablehead input,.tablehead select{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff}.tablehead input{flex:1}table{width:100%;border-collapse:collapse}th,td{padding:14px 16px;border-bottom:1px solid #edf1f5;text-align:left;font-size:14px}th{color:var(--muted);background:#fafbfd}.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.active{background:var(--green2);color:var(--green)}.inactive{background:var(--red2);color:var(--red)}.link{border:0;background:transparent;color:var(--blue);font-weight:800;cursor:pointer}.clienthead{padding:20px;display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin-bottom:12px}.cid{display:flex;gap:16px;align-items:center}.photo{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#d8e1ef,#8190a7);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:900}.cid h2{margin:0 0 6px}.meta{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:10px}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{border:1px solid var(--line);border-radius:12px;padding:12px}.metric .l{color:var(--muted);font-size:12px}.metric .v{font-weight:900;margin-top:4px}.tabs{display:flex;gap:4px;padding:8px;margin-bottom:12px;overflow:auto}.tabs button{border:0;background:transparent;padding:10px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}.tabs button.on{background:var(--blue2);color:var(--blue);font-weight:900}.g3{display:grid;grid-template-columns:1.05fr 1.2fr 1.3fr;gap:12px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{padding:16px}.panel h3{margin:0 0 12px}.sub{color:var(--muted);font-size:13px;margin-top:-5px;margin-bottom:12px}.acc{border:1px solid var(--line);border-radius:10px;background:#fbfcfe;margin-bottom:8px}.acc button{width:100%;border:0;background:transparent;padding:11px 12px;text-align:left;font-weight:800;display:flex;justify-content:space-between;cursor:pointer}.acc .body{display:none;padding:0 12px 12px;color:#374151;font-size:14px;line-height:1.5}.acc.open .body{display:block}.check{display:flex;gap:9px;align-items:flex-start;margin:10px 0}.note,textarea,input.text{width:100%;border:1px solid var(--line);background:#fbfcfe;border-radius:10px;padding:10px 11px}.note{margin-bottom:8px}.note strong{display:block;margin-bottom:4px}textarea{min-height:88px;resize:vertical}.bottom{display:grid;grid-template-columns:1fr .9fr 1fr;gap:12px;margin-top:12px}.bul{margin:0;padding-left:18px;line-height:1.7}.timeline{display:flex;flex-direction:column;gap:10px}.event{border-left:3px solid var(--blue);padding-left:12px}.date{font-size:12px;color:var(--muted)}.back{margin-bottom:12px}
@media(max-width:1050px){.shell{grid-template-columns:78px 1fr}.side{padding:20px 10px}.brand{font-size:14px;text-align:center}.brand small,.foot{display:none}.nav button{font-size:0;text-align:center}.g3,.bottom{grid-template-columns:1fr}.clienthead{grid-template-columns:1fr}}
@media(max-width:760px){.shell{grid-template-columns:1fr}.side{display:none}.content{padding:16px 12px}.top{padding:0 14px}.search{display:none}.kpis{grid-template-columns:1fr 1fr}.metrics,.g2{grid-template-columns:1fr}}
</style>
</head>
<body><div id="app"></div>
<script>
const clients=[
{id:1,name:"Jean Dupont",initials:"JD",offer:"P2",pole:"Performance",status:"Actif",start:"03/03/2027",end:"02/06/2027",next:"18/03/2027",sport:"Handball",spec:"Ailier gauche",age:18,level:"National",
questionnaire:{"Profil général":"18 ans, ailier gauche, niveau national.","Parcours sportif":"Handball depuis 10 ans. Club actuel depuis 3 saisons.","Objectifs":"Gagner en explosivité, surtout sur les premiers appuis et la détente.","Entraînement actuel":"5 entraînements par semaine + match le week-end.","Santé / Antécédents":"Ancienne gêne ischio droit, actuellement asymptomatique.","Récupération":"Utilise parfois des bottes de pressothérapie au club.","Sommeil":"Environ 7 h, parfois 6 h en période d’examens.","Nutrition sportive":"Pas de suivi spécifique. Souhaite des conseils autour des matchs.","Organisation personnelle":"Études, emploi du temps variable selon les semaines.","Matériel et environnement":"Salle du club + accès piste et terrain.","Motivation et attentes":"Très motivé, veut progresser sur la vitesse et la détente."},
deep:[["Objectif","Préciser ce que signifie « explosivité »",true],["Semaine sportive","Détails sur les jours chargés",false],["Gêne ischio","Comprendre la situation actuelle",true],["Récupération","Voir s’il y a des difficultés",false],["Données disponibles","GPS au club ?",true]],
notes:[["Objectif approfondi","Explosivité surtout sur le premier pas 0–5 m et sur la détente en duel aérien."],["Gêne / antécédents","Gêne ischio légère en fin de match après gros enchaînements d’efforts. Actuellement RAS mais à surveiller."],["Organisation sportive","5 entraînements / semaine + match. Lundi léger, jeudi et vendredi plus chargés."]],
offerDetails:{"Récupération":"Pressothérapie parfois après match.","Sommeil":"En moyenne 7 h, parfois 6 h en examens.","Nutrition sportive":"Besoin d’un cadre simple autour des matchs.","Données club":"GPS disponible ponctuellement."},
decisions:["Priorité cycle 1 : accélération 0–5 m + détente.","Surveiller l’ischio droit.","Intégrer le calendrier club avant chaque semaine."],
tests:[["CMJ",true],["Sprint 5 m",true],["Sprint 10 m",true],["VBT",false]],privateNote:"Athlète motivé. Vérifier la régularité du sommeil."},
{id:2,name:"Léa Martin",initials:"LM",offer:"Standard",pole:"Forme & Santé",status:"Actif",start:"10/03/2027",end:"09/06/2027",next:"24/03/2027",age:31},
{id:3,name:"Thomas Bernard",initials:"TB",offer:"Mental Sportif",pole:"Mental",status:"Actif",start:"15/03/2027",end:"14/06/2027",next:"22/03/2027",age:24},
{id:4,name:"Sarah Petit",initials:"SP",offer:"P1",pole:"Performance",status:"Inactif",start:"01/01/2027",end:"31/03/2027",next:"—",age:20}
];
const state={view:"clients",client:1,tab:"onboarding",search:"",filter:"all"};
function layout(inner){return '<div class="shell"><aside class="side"><div class="brand">AK PRIME<small>PERFORMANCE SYSTEM</small></div><div class="nav"><button class="active" data-nav="clients">Clients</button><button data-nav="tests">Tests</button><button data-nav="calendar">Calendrier</button><button data-nav="settings">Paramètres</button></div><div class="foot">Back-office V1 — prototype</div></aside><main><div class="top"><div class="crumb">AK PRIME / '+(state.view==="client"?"Fiche client":"Clients")+'</div><div class="topr"><input id="global" class="search" placeholder="Rechercher un client…"><div class="avatar">AK</div></div></div><section class="content">'+inner+'</section></main></div>'}
function clientsPage(){const q=state.search.toLowerCase();const rows=clients.filter(c=>(c.name+" "+c.pole+" "+c.offer).toLowerCase().includes(q)&&(state.filter==="all"||c.status===state.filter));return '<div class="title"><h1>Clients</h1><button id="add" class="btn primary">+ Nouveau client</button></div><div class="kpis"><div class="card kpi"><div class="l">Clients actifs</div><div class="v">'+clients.filter(c=>c.status==="Actif").length+'</div></div><div class="card kpi"><div class="l">Performance</div><div class="v">'+clients.filter(c=>c.pole==="Performance").length+'</div></div><div class="card kpi"><div class="l">Forme & Santé</div><div class="v">'+clients.filter(c=>c.pole==="Forme & Santé").length+'</div></div><div class="card kpi"><div class="l">Mental</div><div class="v">'+clients.filter(c=>c.pole==="Mental").length+'</div></div></div><div class="card"><div class="tablehead"><input id="search" placeholder="Rechercher…" value="'+state.search+'"><select id="filter"><option value="all">Tous les statuts</option><option value="Actif">Actifs</option><option value="Inactif">Inactifs</option></select></div><table><thead><tr><th>Client</th><th>Pôle</th><th>Offre</th><th>Statut</th><th>Prochaine visio</th><th></th></tr></thead><tbody>'+rows.map(c=>'<tr><td><strong>'+c.name+'</strong></td><td>'+c.pole+'</td><td>'+c.offer+'</td><td><span class="status '+(c.status==="Actif"?"active":"inactive")+'">'+c.status+'</span></td><td>'+c.next+'</td><td><button class="link open" data-id="'+c.id+'">Ouvrir</button></td></tr>').join("")+'</tbody></table></div>'}
function clientPage(){const c=clients.find(x=>x.id===state.client)||clients[0];const tabs=[["overview","Vue d’ensemble"],["onboarding","Onboarding & Visio"],["tests","Tests"],["follow","Suivi & Programmation"],["passport","Passeport"],["history","Historique"],["admin","Administratif"]];return '<button id="back" class="btn ghost back">← Retour clients</button><div class="card clienthead"><div class="cid"><div class="photo">'+c.initials+'</div><div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h2>'+c.name+'</h2><span class="status '+(c.status==="Actif"?"active":"inactive")+'">'+c.status+'</span></div><div class="meta"><span>'+c.pole+'</span><span>• '+c.offer+'</span>'+(c.sport?'<span>• '+c.sport+'</span>':"")+(c.spec?'<span>• '+c.spec+'</span>':"")+'<span>• '+c.age+' ans</span>'+(c.level?'<span>• Niveau : '+c.level+'</span>':"")+'</div></div></div><div class="metrics"><div class="metric"><div class="l">Début</div><div class="v">'+c.start+'</div></div><div class="metric"><div class="l">Fin</div><div class="v">'+c.end+'</div></div><div class="metric"><div class="l">Prochaine visio</div><div class="v">'+c.next+'</div></div></div></div><div class="card tabs">'+tabs.map(t=>'<button class="tab '+(state.tab===t[0]?"on":"")+'" data-tab="'+t[0]+'">'+t[1]+'</button>').join("")+'</div>'+tab(c)}
function tab(c){if(state.tab==="onboarding")return onboarding(c);if(state.tab==="tests")return tests(c);if(state.tab==="follow")return follow(c);if(state.tab==="passport")return passport(c);if(state.tab==="history")return history(c);if(state.tab==="admin")return admin(c);return overview(c)}
function overview(c){return '<div class="g2"><div class="card panel"><h3>Résumé client</h3><p><strong>Pôle :</strong> '+c.pole+'</p><p><strong>Offre :</strong> '+c.offer+'</p><p><strong>Objectif :</strong> '+((c.questionnaire&&c.questionnaire["Objectifs"])||"À définir")+'</p></div><div class="card panel"><h3>Prochaines actions</h3><ul class="bul"><li>Vérifier les tests requis</li><li>Préparer la prochaine visio</li><li>Traiter le check-in du vendredi</li></ul></div></div>'}
function onboarding(c){if(!c.questionnaire)return '<div class="card panel">Prototype détaillé disponible sur Jean Dupont.</div>';return '<div class="g3"><div class="card panel"><h3>Questionnaire initial</h3><div class="sub">Réponses client</div>'+Object.entries(c.questionnaire).map((e,i)=>'<div class="acc '+(i===2?"open":"")+'"><button class="acct">'+e[0]+'<span>⌄</span></button><div class="body">'+e[1]+'</div></div>').join("")+'</div><div><div class="card panel" style="margin-bottom:12px"><h3>Analyse et préparation de la visio</h3><div class="sub">Sélectionner les réponses à approfondir.</div>'+c.deep.map(x=>'<label class="check"><input type="checkbox" '+(x[2]?"checked":"")+'><span><strong>'+x[0]+' :</strong> '+x[1]+'</span></label>').join("")+'<input class="text" placeholder="Autre point à approfondir…"></div><div class="card panel"><h3>Visio initiale</h3><div class="sub">Notes liées aux réponses approfondies.</div>'+c.notes.map(x=>'<div class="note"><strong>'+x[0]+'</strong>'+x[1]+'</div>').join("")+'<textarea placeholder="Informations nouvelles / approfondissements…"></textarea></div></div><div class="card panel"><h3>Informations spécifiques à l’offre '+c.offer+'</h3><div class="sub">Blocs supplémentaires selon le niveau d’accompagnement.</div>'+Object.entries(c.offerDetails).map(x=>'<div class="note"><strong>'+x[0]+'</strong>'+x[1]+'</div>').join("")+'<textarea placeholder="Autre élément lié à l’offre…"></textarea></div></div><div class="bottom"><div class="card panel"><h3>Décisions coach</h3><ul class="bul">'+c.decisions.map(x=>'<li>'+x+'</li>').join("")+'</ul></div><div class="card panel"><h3>Tests à réaliser</h3>'+c.tests.map(x=>'<label class="check"><input type="checkbox" '+(x[1]?"checked":"")+'>'+x[0]+'</label>').join("")+'</div><div class="card panel"><h3>Notes coach privées</h3><textarea>'+c.privateNote+'</textarea></div></div>'}
function tests(c){const list=c.tests||[["CMJ",true],["Sprint 10 m",false]];return '<div class="g2"><div class="card panel"><h3>Historique des tests</h3>'+list.map(x=>'<div class="note"><strong>'+x[0]+'</strong><span class="status '+(x[1]?"active":"inactive")+'">'+(x[1]?"Validé":"À faire")+'</span><div style="margin-top:8px;color:var(--muted)">Date, protocole, résultat, contexte et notes seront conservés à vie.</div></div>').join("")+'</div><div class="card panel"><h3>Synthèse de l’évaluation</h3><textarea placeholder="Points forts observés…"></textarea><textarea style="margin-top:10px" placeholder="Axes prioritaires…"></textarea></div></div>'}
function follow(c){return '<div class="g2"><div class="card panel"><h3>Cycle actuel</h3><div class="note"><strong>Priorités</strong>Explosivité 0–5 m + détente</div><div class="note"><strong>Vigilance</strong>Ischio droit</div><button class="btn primary" onclick="alert(\'Lien Optitrainer à brancher\')">Ouvrir Optitrainer</button></div><div class="card panel"><h3>Check-in du vendredi</h3><div class="note"><strong>Automatique</strong>Ressenti, séance non réalisée, gêne, contrainte semaine suivante.</div><textarea placeholder="Retour coach / décision importante…"></textarea></div></div>'}
function passport(c){return '<div class="g2"><div class="card panel"><h3>Passeport AK PRIME</h3><div class="note"><strong>Identité sportive</strong>'+(c.sport||"—")+(c.spec?" — "+c.spec:"")+'</div><div class="note"><strong>Priorités actuelles</strong>Explosivité, accélération, détente</div><div class="note"><strong>Points de vigilance</strong>Ischio droit</div><button class="btn ghost">Prévisualiser</button></div><div class="card panel"><h3>Chronologie</h3><div class="timeline"><div class="event"><div class="date">Mars 2027</div><strong>Entrée chez AK PRIME</strong><div>Évaluation initiale et premier cycle.</div></div><div class="event"><div class="date">À venir</div><strong>Premier retest</strong><div>Comparaison initial / dernier / meilleur.</div></div></div></div></div>'}
function history(c){return '<div class="card panel"><h3>Historique complet</h3><div class="timeline"><div class="event"><div class="date">'+c.start+'</div><strong>Début d’accompagnement</strong><div>'+c.offer+' — '+c.pole+'</div></div><div class="event"><div class="date">'+c.next+'</div><strong>Visio / suivi</strong><div>Les changements d’offre, tests, cycles et événements seront archivés ici.</div></div></div></div>'}
function admin(c){return '<div class="g2"><div class="card panel"><h3>Engagement</h3><p><strong>Offre :</strong> '+c.offer+'</p><p><strong>Début :</strong> '+c.start+'</p><p><strong>Fin :</strong> '+c.end+'</p><p><strong>Statut :</strong> '+c.status+'</p></div><div class="card panel"><h3>Paiement & renouvellement</h3><div class="note"><strong>Paiement</strong>À connecter ultérieurement.</div><div class="note"><strong>Renouvellement</strong>Rappel J-14 prévu.</div></div></div>'}
function render(){document.getElementById("app").innerHTML=layout(state.view==="client"?clientPage():clientsPage());bind()}
function bind(){document.querySelectorAll(".open").forEach(b=>b.onclick=()=>{state.client=+b.dataset.id;state.view="client";state.tab="onboarding";render()});document.querySelector("#back")?.addEventListener("click",()=>{state.view="clients";render()});document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});document.querySelectorAll(".acct").forEach(b=>b.onclick=()=>b.closest(".acc").classList.toggle("open"));document.querySelector("#search")?.addEventListener("input",e=>{state.search=e.target.value;render()});document.querySelector("#filter")?.addEventListener("change",e=>{state.filter=e.target.value;render()});document.querySelector("#global")?.addEventListener("keydown",e=>{if(e.key==="Enter"){state.view="clients";state.search=e.target.value;render()}});document.querySelector("#add")?.addEventListener("click",()=>alert("Création client : prochaine étape avec la vraie base de données."));document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{if(b.dataset.nav==="clients"){state.view="clients";render()}else alert("Module prévu dans une prochaine itération.")})}
render();
</script>
</body>
</html>
