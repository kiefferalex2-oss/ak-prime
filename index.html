<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AK PRIME — Back-office</title>
<style>
:root{
  --bg:#f3f6fa;--panel:#fff;--panel2:#f8fafc;--nav:#0d1827;--nav2:#13243a;--text:#101828;
  --muted:#667085;--line:#e3e8ef;--blue:#2f66f6;--blue2:#edf2ff;--gold:#d3ab62;--green:#15865d;
  --green2:#e5f7ef;--amber:#a86400;--amber2:#fff4d8;--red:#be3535;--red2:#fdeaea;--shadow:0 10px 32px rgba(16,24,40,.07)
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}.hidden{display:none!important}
.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}
.sidebar{background:linear-gradient(180deg,var(--nav),#091421 85%);color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{padding:0 8px 12px}.brand strong{display:block;font-size:25px;letter-spacing:.09em}.brand span{font-size:10px;letter-spacing:.23em;color:#8fa1b8}
.nav{display:flex;flex-direction:column;gap:7px}.nav button{border:0;background:transparent;color:#c7d1de;text-align:left;padding:12px 13px;border-radius:10px;cursor:pointer;font-weight:650}
.nav button:hover,.nav button.on{background:#1d4ed8;color:#fff}.nav .sep{height:1px;background:#1f3045;margin:8px 6px}
.sidebar-note{margin-top:auto;padding:12px;border:1px solid #24384e;border-radius:12px;background:#102033;font-size:12px;color:#aab8c8;line-height:1.45}
.topbar{height:70px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:10}
.crumb{font-size:14px;color:var(--muted)}.top-actions{display:flex;gap:9px;align-items:center}.top-actions input{width:230px}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#16283d;color:#fff;font-size:13px;font-weight:800}
main{min-width:0}.content{padding:24px 26px 48px;max-width:1500px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.page-title{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:18px}.page-title h1{margin:0;font-size:29px}.page-title p{margin:4px 0 0;color:var(--muted);font-size:14px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer}.btn.primary{background:var(--blue);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}.btn.danger{background:var(--red2);color:var(--red)}.btn.small{padding:7px 10px;font-size:13px}
.input,.select,.textarea{border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 11px;color:var(--text)}.textarea{width:100%;min-height:95px;resize:vertical}.input:focus,.select:focus,.textarea:focus{outline:2px solid #c9d6ff;border-color:#8ba6ff}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:15px}.kpi{padding:17px 18px}.kpi .lab{font-size:12px;color:var(--muted)}.kpi .val{font-size:27px;font-weight:900;margin-top:5px}.kpi .sub{font-size:12px;color:var(--muted);margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}.grid31{display:grid;grid-template-columns:1.05fr 1.25fr 1.15fr;gap:13px}
.panel{padding:17px}.panel h2,.panel h3{margin:0 0 12px}.panel h3{font-size:16px}.muted{color:var(--muted)}.tiny{font-size:12px}
.toolbar{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center;flex-wrap:wrap}.toolbar .input{flex:1;min-width:220px}
table{width:100%;border-collapse:collapse}th,td{padding:13px 15px;border-bottom:1px solid #edf0f4;text-align:left;font-size:14px}th{font-size:12px;color:var(--muted);background:#fbfcfe;text-transform:uppercase;letter-spacing:.03em}
.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:850}.status.green{background:var(--green2);color:var(--green)}.status.red{background:var(--red2);color:var(--red)}.status.amber{background:var(--amber2);color:var(--amber)}.status.blue{background:var(--blue2);color:var(--blue)}
.link{border:0;background:transparent;color:var(--blue);font-weight:800;cursor:pointer}
.list{display:flex;flex-direction:column;gap:8px}.item{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#fbfcfe}.item strong{display:block;margin-bottom:4px}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.grow{flex:1}
.alert{border-left:4px solid var(--amber);background:#fffaf0;padding:11px 12px;border-radius:9px;margin-bottom:8px}.alert.blue{border-color:var(--blue);background:#f5f7ff}.alert.green{border-color:var(--green);background:#f1fbf6}
.client-head{padding:18px 20px;margin-bottom:11px;display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.person{display:flex;align-items:center;gap:14px}.photo{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#dbe5f1,#7c8ca2);color:#fff;font-weight:900;font-size:22px}.person h2{margin:0 0 5px}.meta{display:flex;gap:8px 12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{border:1px solid var(--line);border-radius:11px;padding:10px}.metric span{font-size:11px;color:var(--muted)}.metric strong{display:block;margin-top:3px;font-size:14px}
.tabs{display:flex;gap:3px;padding:7px;margin-bottom:12px;overflow:auto}.tabs button{border:0;background:transparent;padding:10px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}.tabs button.on{background:var(--blue2);color:var(--blue);font-weight:850}
.accordion{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fbfcfe}.accordion>button{width:100%;border:0;background:transparent;padding:11px 12px;text-align:left;display:flex;justify-content:space-between;font-weight:800;cursor:pointer}.accordion .body{display:none;padding:0 12px 12px;line-height:1.5;font-size:14px}.accordion.open .body{display:block}
.check{display:flex;gap:8px;align-items:flex-start;margin:9px 0}.check input{margin-top:3px}
.section-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;font-weight:850}
.field{margin-bottom:11px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:750}.field .input,.field .select{width:100%}
.test-row{display:grid;grid-template-columns:1.2fr .8fr .7fr .9fr 1.4fr auto;gap:8px;align-items:center;border-bottom:1px solid #edf0f4;padding:10px 0}.test-row.header{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase}
.spark{height:42px;display:flex;align-items:flex-end;gap:3px}.spark i{display:block;width:8px;background:#7390ff;border-radius:3px 3px 0 0}
.timeline{display:flex;flex-direction:column;gap:10px}.event{border-left:3px solid var(--blue);padding-left:11px}.event .date{font-size:11px;color:var(--muted);margin-bottom:2px}
.passport{background:linear-gradient(145deg,#0d1827,#142844);color:#fff;padding:22px}.passport .muted{color:#b9c6d5}.passport-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.passport .mini{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px}.passport .mini span{display:block;color:#b9c6d5;font-size:11px}.passport .mini strong{display:block;margin-top:4px}
.progress{height:8px;background:#e7ecf3;border-radius:999px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--blue)}
.modal-wrap{position:fixed;inset:0;background:rgba(9,20,33,.58);display:grid;place-items:center;z-index:100;padding:20px}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.25)}.modal-head,.modal-foot{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.modal-foot{border-top:1px solid var(--line);border-bottom:0}.modal-body{padding:18px 20px}.x{border:0;background:transparent;font-size:22px;cursor:pointer}
.backup{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);z-index:110;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}
.demo-banner{background:#fff4d8;color:#895d00;border-bottom:1px solid #efd38f;padding:8px 16px;text-align:center;font-size:12px;font-weight:750}
@media(max-width:1100px){.app{grid-template-columns:80px 1fr}.sidebar{padding:18px 8px}.brand strong{font-size:14px;text-align:center}.brand span,.sidebar-note{display:none}.nav button{font-size:0;text-align:center}.nav button:before{content:"•";font-size:20px}.grid31,.grid3{grid-template-columns:1fr}.client-head{grid-template-columns:1fr}}
@media(max-width:780px){.app{grid-template-columns:1fr}.sidebar{display:none}.content{padding:15px 11px 40px}.topbar{padding:0 13px}.top-actions input{display:none}.kpis,.grid2{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr}.test-row{grid-template-columns:1fr 1fr}.test-row.header{display:none}.passport-grid{grid-template-columns:1fr}}
@media(max-width:520px){.kpis,.grid2{grid-template-columns:1fr}.page-title{align-items:flex-start;flex-direction:column}}
@media print{.sidebar,.topbar,.demo-banner,.tabs,.btn,.no-print{display:none!important}.app{display:block}.content{padding:0}.card{box-shadow:none}.passport{min-height:100vh}}
</style>
</head>
<body>
<div class="demo-banner">MODE PROTOTYPE — ne pas saisir de vraies données de santé tant que l’authentification et la base sécurisée ne sont pas branchées.</div>
<div id="root"></div>
<div id="modalRoot"></div>
<div id="toast" class="toast">Enregistré</div>
<script>
const STORAGE_KEY='akprime-backoffice-v2';

const DEMO_CLIENTS=[
{id:'c1',name:'Jean Dupont',email:'jean@example.fr',phone:'06 00 00 00 01',initials:'JD',pole:'Performance',offer:'P2',status:'Actif',start:'2027-03-03',end:'2027-06-02',next:'2027-03-18',sport:'Handball',specialty:'Ailier gauche',level:'National',age:18,payment:'À jour',
questionnaire:{'Profil général':'18 ans, ailier gauche, niveau national.','Parcours sportif':'Handball depuis 10 ans. Club actuel depuis 3 saisons.','Objectif principal':'Gagner en explosivité, surtout sur les premiers appuis et la détente.','Entraînement actuel':'5 entraînements par semaine + match le week-end.','Santé / Antécédents':'Ancienne gêne ischio droit, actuellement asymptomatique.','Récupération':'Pressothérapie ponctuelle au club.','Sommeil':'Environ 7 h, parfois 6 h en période d’examens.','Nutrition sportive':'Pas de suivi spécifique. Souhaite des conseils autour des matchs.','Organisation personnelle':'Études, emploi du temps variable selon les semaines.','Matériel et environnement':'Salle du club + accès piste et terrain.','Motivation et attentes':'Très motivé, veut progresser sur la vitesse et la détente.'},
deep:{'Objectif principal':true,'Santé / Antécédents':true,'Données disponibles':true},
visioNotes:'Explosivité surtout sur le premier pas 0–5 m et sur la détente en duel aérien. Gêne ischio légère en fin de match après gros enchaînements. 5 entraînements / semaine + match.',
offerNotes:{'Récupération':'Pressothérapie parfois après match.','Sommeil':'En moyenne 7 h, parfois 6 h en examens.','Nutrition sportive':'Cadre simple autour des matchs.','Données club':'GPS disponible ponctuellement.'},
decisions:'Priorité cycle 1 : accélération 0–5 m + détente.\\nSurveiller l’ischio droit.\\nIntégrer le calendrier club avant chaque semaine.',
privateNote:'Athlète motivé. Vérifier la régularité du sommeil.',
tests:[
{id:'t1',name:'CMJ',date:'2027-03-05',value:42,unit:'cm',context:'Initial',note:'Bonne technique.'},
{id:'t2',name:'Sprint 5 m',date:'2027-03-05',value:1.12,unit:'s',context:'Initial',note:''},
{id:'t3',name:'Sprint 10 m',date:'2027-03-05',value:1.82,unit:'s',context:'Initial',note:''},
{id:'t4',name:'CMJ',date:'2027-04-16',value:45,unit:'cm',context:'Retest S6',note:'Progression nette.'}
],
cycle:{title:'Force / explosivité',start:'2027-03-08',end:'2027-04-18',priorities:'Accélération 0–5 m ; détente ; force MI',vigilance:'Ischio droit',optitrainer:''},
checkins:[
{id:'w1',date:'2027-03-12',feeling:'Bonne semaine, fatigue légère jeudi.',missed:'Aucune séance manquée.',pain:'RAS',nextConstraint:'Match samedi.',coach:'Maintien du plan. Réduction légère du volume sprint vendredi.'}
],
events:[
{id:'e1',date:'2027-03-03',title:'Entrée chez AK PRIME',detail:'Début accompagnement Performance P2.'},
{id:'e2',date:'2027-03-05',title:'Évaluation initiale',detail:'CMJ + sprint 5 m / 10 m.'},
{id:'e3',date:'2027-04-16',title:'Retest S6',detail:'CMJ 45 cm.'}
],
adminNote:'',legalGuardian:'',renewal:'3 mois'
},
{id:'c2',name:'Léa Martin',email:'lea@example.fr',phone:'06 00 00 00 02',initials:'LM',pole:'Forme & Santé',offer:'Standard',status:'Actif',start:'2027-03-10',end:'2027-06-09',next:'2027-03-24',age:31,payment:'À jour',questionnaire:{'Objectif principal':'Remise en forme et perte de poids progressive.','Activité actuelle':'2 marches / semaine.','Contraintes':'Travail en horaires variables.'},deep:{},visioNotes:'',offerNotes:{},decisions:'',privateNote:'',tests:[],cycle:{title:'Remise en forme',start:'2027-03-13',end:'2027-04-23',priorities:'Régularité ; force générale',vigilance:'',optitrainer:''},checkins:[],events:[],adminNote:'',legalGuardian:'',renewal:'3 mois'},
{id:'c3',name:'Thomas Bernard',email:'thomas@example.fr',phone:'06 00 00 00 03',initials:'TB',pole:'Mental',offer:'Mental Sportif',status:'Actif',start:'2027-03-15',end:'2027-06-14',next:'2027-03-22',age:24,payment:'À jour',questionnaire:{'Objectif principal':'Mieux gérer la pression en compétition.','Difficulté principale':'Perte de concentration après une erreur.','Contexte':'Sport collectif.'},deep:{},visioNotes:'',offerNotes:{},decisions:'',privateNote:'',tests:[],cycle:{title:'Gestion de la pression',start:'2027-03-15',end:'2027-04-26',priorities:'Recentrage ; routine erreur',vigilance:'',optitrainer:''},checkins:[],events:[],adminNote:'',legalGuardian:'',renewal:'3 mois'},
{id:'c4',name:'Sarah Petit',email:'sarah@example.fr',phone:'06 00 00 00 04',initials:'SP',pole:'Performance',offer:'P1',status:'Inactif',start:'2027-01-01',end:'2027-03-31',next:'',age:20,payment:'Terminé',questionnaire:{},deep:{},visioNotes:'',offerNotes:{},decisions:'',privateNote:'',tests:[],cycle:{title:'',start:'',end:'',priorities:'',vigilance:'',optitrainer:''},checkins:[],events:[],adminNote:'',legalGuardian:'',renewal:'Arrêt'}
];

let db=loadDB();
let state={view:'dashboard',clientId:db.clients[0]?.id||null,tab:'overview',search:'',status:'Tous',pole:'Tous'};

function loadDB(){
  try{const saved=localStorage.getItem(STORAGE_KEY);if(saved)return JSON.parse(saved)}catch(e){}
  return {clients:JSON.parse(JSON.stringify(DEMO_CLIENTS)),settings:{optitrainerBase:'https://app.optitrainer.fr'}};
}
function saveDB(msg){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
  if(msg)toast(msg);
}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg||'Enregistré';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)}
function fmtDate(v){if(!v)return '—';const p=v.split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:v}
function uid(prefix){return prefix+Math.random().toString(36).slice(2,8)}
function initials(name){return name.split(/\\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function currentClient(){return db.clients.find(c=>c.id===state.clientId)||db.clients[0]}
function activeClients(){return db.clients.filter(c=>c.status==='Actif')}

function shell(inner){
 return '<div class="app">'+
 '<aside class="sidebar"><div class="brand"><strong>AK PRIME</strong><span>PERFORMANCE SYSTEM</span></div>'+
 '<div class="nav">'+
 navBtn('dashboard','Tableau de bord')+navBtn('clients','Clients')+navBtn('globalTests','Tests')+navBtn('calendar','Calendrier')+
 '<div class="sep"></div>'+navBtn('backup','Sauvegardes')+navBtn('settings','Paramètres')+
 '</div><div class="sidebar-note">V2 interactive locale.<br>Les données restent dans ce navigateur tant que la vraie base sécurisée n’est pas connectée.</div></aside>'+
 '<main><div class="topbar"><div class="crumb">AK PRIME / '+crumb()+'</div><div class="top-actions"><input id="globalSearch" class="input" placeholder="Rechercher un client…"><div class="avatar">AK</div></div></div>'+
 '<div class="content">'+inner+'</div></main></div>';
}
function navBtn(v,label){return '<button class="'+(state.view===v?'on':'')+'" data-nav="'+v+'">'+label+'</button>'}
function crumb(){if(state.view==='client')return esc(currentClient()?.name||'Client');const map={dashboard:'Tableau de bord',clients:'Clients',globalTests:'Tests',calendar:'Calendrier',backup:'Sauvegardes',settings:'Paramètres'};return map[state.view]||'Back-office'}

function dashboard(){
 const acts=activeClients();
 const next=acts.filter(c=>c.next).sort((a,b)=>a.next.localeCompare(b.next)).slice(0,5);
 const ending=acts.filter(c=>c.end).sort((a,b)=>a.end.localeCompare(b.end)).slice(0,5);
 return '<div class="page-title"><div><h1>Tableau de bord</h1><p>Vue rapide de l’activité AK PRIME.</p></div><button class="btn primary" id="newClient">+ Nouveau client</button></div>'+
 '<div class="kpis">'+
 kpi('Clients actifs',acts.length,'Tous pôles')+kpi('Performance',acts.filter(c=>c.pole==='Performance').length,'clients actifs')+
 kpi('Forme & Santé',acts.filter(c=>c.pole==='Forme & Santé').length,'clients actifs')+kpi('Mental',acts.filter(c=>c.pole==='Mental').length,'clients actifs')+
 '</div><div class="grid2">'+
 '<div class="card panel"><h3>Prochaines visios</h3><div class="list">'+(next.length?next.map(c=>'<div class="item row between"><div><strong>'+esc(c.name)+'</strong><span class="muted tiny">'+esc(c.offer)+' — '+fmtDate(c.next)+'</span></div><button class="link openClient" data-id="'+c.id+'">Ouvrir</button></div>').join(''):'<div class="muted">Aucune visio planifiée.</div>')+'</div></div>'+
 '<div class="card panel"><h3>Engagements à surveiller</h3><div class="list">'+ending.map(c=>'<div class="item row between"><div><strong>'+esc(c.name)+'</strong><span class="muted tiny">Fin : '+fmtDate(c.end)+'</span></div><span class="status amber">'+esc(c.renewal||'À décider')+'</span></div>').join('')+'</div></div>'+
 '</div><div class="grid3" style="margin-top:13px">'+
 '<div class="card panel"><h3>Onboarding</h3><div class="alert blue">Les questionnaires, notes de visio et décisions restent regroupés dans une seule fiche client.</div></div>'+
 '<div class="card panel"><h3>Tests</h3><div class="alert green">'+db.clients.reduce((n,c)=>n+(c.tests?.length||0),0)+' résultats de tests enregistrés dans la démo.</div></div>'+
 '<div class="card panel"><h3>Check-in vendredi</h3><div class="alert">Le futur module automatisera la remontée des check-ins et les alertes de suivi.</div></div></div>';
}
function kpi(label,val,sub){return '<div class="card kpi"><div class="lab">'+label+'</div><div class="val">'+val+'</div><div class="sub">'+sub+'</div></div>'}

function clientsPage(){
 let list=db.clients.filter(c=>{
  const q=state.search.toLowerCase();
  return (!q||(c.name+' '+c.offer+' '+c.pole).toLowerCase().includes(q))&&(state.status==='Tous'||c.status===state.status)&&(state.pole==='Tous'||c.pole===state.pole)
 });
 return '<div class="page-title"><div><h1>Clients</h1><p>'+db.clients.length+' dossiers dans la V2.</p></div><button class="btn primary" id="newClient">+ Nouveau client</button></div>'+
 '<div class="card"><div class="toolbar"><input id="clientSearch" class="input" placeholder="Rechercher…" value="'+esc(state.search)+'">'+
 '<select id="statusFilter" class="select"><option>Tous</option><option>Actif</option><option>Inactif</option></select>'+
 '<select id="poleFilter" class="select"><option>Tous</option><option>Performance</option><option>Forme & Santé</option><option>Mental</option></select></div>'+
 '<div style="overflow:auto"><table><thead><tr><th>Client</th><th>Pôle</th><th>Offre</th><th>Statut</th><th>Paiement</th><th>Prochaine visio</th><th></th></tr></thead><tbody>'+
 list.map(c=>'<tr><td><strong>'+esc(c.name)+'</strong><div class="muted tiny">'+esc(c.email||'')+'</div></td><td>'+esc(c.pole)+'</td><td>'+esc(c.offer)+'</td><td>'+status(c.status)+'</td><td>'+esc(c.payment||'—')+'</td><td>'+fmtDate(c.next)+'</td><td><button class="link openClient" data-id="'+c.id+'">Ouvrir</button></td></tr>').join('')+
 '</tbody></table></div></div>';
}
function status(s){return '<span class="status '+(s==='Actif'?'green':s==='Inactif'?'red':'blue')+'">'+esc(s)+'</span>'}

function clientPage(){
 const c=currentClient();if(!c)return clientsPage();
 const tabs=[['overview','Vue d’ensemble'],['onboarding','Onboarding & Visio'],['tests','Tests'],['follow','Suivi'],['passport','Passeport'],['history','Historique'],['admin','Administratif']];
 return '<button class="btn ghost small no-print" id="backClients" style="margin-bottom:10px">← Clients</button>'+

function testsTab(c){

 '<div class="grid2"><div class="card panel"><h3>Historique</h3>'+
 (history.length?'<div class="test-row header"><div>Test</div><div>Date</div><div>Résultat</div><div>Contexte</div><div>Note</div><div></div></div>'+history.map(t=>'<div class="test-row"><div><strong>'+esc(t.name)+'</strong></div><div>'+fmtDate(t.date)+'</div><div>'+esc(t.value)+' '+esc(t.unit||'')+'</div><div>'+esc(t.context||'')+'</div><div class="muted tiny">'+esc(t.note||'')+'</div><div><button class="link deleteTest" data-id="'+t.id+'">Suppr.</button></div></div>').join(''):'<div class="muted">Aucun test enregistré.</div>')+

function testProgress(c){
 const groups={};(c.tests||[]).forEach(t=>{(groups[t.name]||(groups[t.name]=[])).push(t)});
 const multi=Object.entries(groups).filter(([k,v])=>v.length>=2);
 if(!multi.length)return '<div class="muted">Ajoute au moins deux résultats d’un même test pour visualiser une évolution.</div>';
 return multi.map(([name,arr])=>{arr.sort((a,b)=>a.date.localeCompare(b.date));const vals=arr.map(x=>Number(x.value));const max=Math.max(...vals),min=Math.min(...vals);return '<div class="item"><strong>'+esc(name)+'</strong><div class="spark">'+arr.map(x=>'<i title="'+esc(x.value)+'" style="height:'+(15+((Number(x.value)-min)/(max-min||1))*27)+'px"></i>').join('')+'</div><div class="muted tiny">'+fmtDate(arr[0].date)+' : '+arr[0].value+' '+esc(arr[0].unit||'')+' → '+fmtDate(arr[arr.length-1].date)+' : '+arr[arr.length-1].value+' '+esc(arr[arr.length-1].unit||'')+'</div></div>'}).join('');
}

function bind(){
 document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.view=b.dataset.nav;render()});
 document.querySelectorAll('.openClient').forEach(b=>b.onclick=()=>{state.clientId=b.dataset.id;state.view='client';state.tab='overview';render()});
 document.getElementById('backClients')?.addEventListener('click',()=>{state.view='clients';render()});
 document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
 document.querySelectorAll('.quickTab').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});
 document.querySelectorAll('.accBtn').forEach(b=>b.onclick=()=>b.parentElement.classList.toggle('open'));
 document.getElementById('newClient')?.addEventListener('click',openNewClient);
 const cs=document.getElementById('clientSearch');if(cs)cs.oninput=e=>{state.search=e.target.value;render()};
 const sf=document.getElementById('statusFilter');if(sf){sf.value=state.status;sf.onchange=e=>{state.status=e.target.value;render()}}
 const pf=document.getElementById('poleFilter');if(pf){pf.value=state.pole;pf.onchange=e=>{state.pole=e.target.value;render()}}
 const gs=document.getElementById('globalSearch');if(gs)gs.onkeydown=e=>{if(e.key==='Enter'){state.search=e.target.value;state.view='clients';render()}};
 document.querySelectorAll('.deepCheck').forEach(x=>x.onchange=()=>{const c=currentClient();c.deep=c.deep||{};c.deep[x.dataset.key]=x.checked;saveDB('Point mis à jour')});
 document.querySelectorAll('.autoSave').forEach(x=>x.onchange=()=>{currentClient()[x.dataset.field]=x.value;saveDB('Enregistré')});
 document.querySelectorAll('.offerSave').forEach(x=>x.onchange=()=>{const c=currentClient();c.offerNotes=c.offerNotes||{};c.offerNotes[x.dataset.offerKey]=x.value;saveDB('Enregistré')});
 document.querySelectorAll('.pathSave').forEach(x=>x.onchange=()=>{setPath(currentClient(),x.dataset.path,x.value);saveDB('Enregistré')});
 document.getElementById('addTest')?.addEventListener('click',openAddTest);
 document.querySelectorAll('.deleteTest').forEach(b=>b.onclick=()=>{const c=currentClient();c.tests=c.tests.filter(t=>t.id!==b.dataset.id);saveDB('Test supprimé');render()});
 document.getElementById('addCheckin')?.addEventListener('click',openCheckin);
 document.querySelectorAll('.deleteCheckin').forEach(b=>b.onclick=()=>{const c=currentClient();c.checkins=c.checkins.filter(x=>x.id!==b.dataset.id);saveDB('Check-in supprimé');render()});
 document.getElementById('addEvent')?.addEventListener('click',openEvent);
 document.querySelectorAll('.deleteEvent').forEach(b=>b.onclick=()=>{const c=currentClient();c.events=c.events.filter(x=>x.id!==b.dataset.id);saveDB('Événement supprimé');render()});
 document.getElementById('printPassport')?.addEventListener('click',()=>window.print());
 document.getElementById('archiveClient')?.addEventListener('click',()=>{currentClient().status='Inactif';saveDB('Client passé en inactif');render()});
 document.getElementById('openOpti')?.addEventListener('click',()=>{const c=currentClient();const u=c.cycle?.optitrainer||db.settings?.optitrainerBase;if(u)window.open(u,'_blank');else toast('Ajoute un lien Optitrainer')});
 document.getElementById('exportData')?.addEventListener('click',exportData);
 document.getElementById('importData')?.addEventListener('change',importData);
 document.getElementById('resetDemo')?.addEventListener('click',()=>{if(confirm('Réinitialiser toutes les données locales de cette démo ?')){db={clients:JSON.parse(JSON.stringify(DEMO_CLIENTS)),settings:{optitrainerBase:'https://app.optitrainer.fr'}};saveDB('Démo réinitialisée');state.view='dashboard';render()}});
 document.getElementById('saveSettings')?.addEventListener('click',()=>{db.settings=db.settings||{};db.settings.optitrainerBase=document.getElementById('optiBase').value;saveDB('Paramètres enregistrés')});
}

function openAddTest(){
 modal('Ajouter un résultat de test',
 '<div class="grid2"><div class="field"><label>Test</label><input id="tName" class="input" placeholder="CMJ, Sprint 10 m…"></div><div class="field"><label>Date</label><input id="tDate" type="date" class="input"></div>'+
 '<div class="field"><label>Résultat</label><input id="tValue" class="input" type="number" step="any"></div><div class="field"><label>Unité</label><input id="tUnit" class="input" placeholder="cm, s, kg…"></div>'+
 '<div class="field"><label>Contexte</label><input id="tContext" class="input" placeholder="Initial, retest S6…"></div><div class="field"><label>Note</label><input id="tNote" class="input"></div></div>',
 '<button class="btn ghost" id="cancelM">Annuler</button><button class="btn primary" id="saveM">Ajouter</button>');
 document.getElementById('cancelM').onclick=closeModal;document.getElementById('saveM').onclick=()=>{const n=document.getElementById('tName').value.trim();if(!n)return toast('Nom du test requis');const c=currentClient();c.tests=c.tests||[];c.tests.push({id:uid('t'),name:n,date:document.getElementById('tDate').value,value:document.getElementById('tValue').value,unit:document.getElementById('tUnit').value,context:document.getElementById('tContext').value,note:document.getElementById('tNote').value});saveDB('Test ajouté');closeModal();render()};
}
function openCheckin(){
 modal('Ajouter un check-in',
 '<div class="field"><label>Date / vendredi</label><input id="wDate" type="date" class="input"></div>'+
 ['Ressenti global','Séance(s) non réalisée(s)','Gêne / douleur','Contrainte semaine suivante','Décision / retour coach'].map((l,i)=>'<div class="field"><label>'+l+'</label><textarea id="w'+i+'" class="textarea"></textarea></div>').join(''),
 '<button class="btn ghost" id="cancelM">Annuler</button><button class="btn primary" id="saveM">Ajouter</button>');
 document.getElementById('cancelM').onclick=closeModal;document.getElementById('saveM').onclick=()=>{const c=currentClient();c.checkins=c.checkins||[];c.checkins.push({id:uid('w'),date:document.getElementById('wDate').value,feeling:document.getElementById('w0').value,missed:document.getElementById('w1').value,pain:document.getElementById('w2').value,nextConstraint:document.getElementById('w3').value,coach:document.getElementById('w4').value});saveDB('Check-in ajouté');closeModal();render()};
}
function openEvent(){
 modal('Ajouter un événement au parcours',
 '<div class="field"><label>Date</label><input id="eDate" type="date" class="input"></div><div class="field"><label>Titre</label><input id="eTitle" class="input" placeholder="Retest, changement de club, retour compétition…"></div><div class="field"><label>Détail</label><textarea id="eDetail" class="textarea"></textarea></div>',
 '<button class="btn ghost" id="cancelM">Annuler</button><button class="btn primary" id="saveM">Ajouter</button>');
 document.getElementById('cancelM').onclick=closeModal;document.getElementById('saveM').onclick=()=>{const title=document.getElementById('eTitle').value.trim();if(!title)return toast('Titre requis');const c=currentClient();c.events=c.events||[];c.events.push({id:uid('e'),date:document.getElementById('eDate').value,title,detail:document.getElementById('eDetail').value});saveDB('Événement ajouté');closeModal();render()};
}
function exportData(){
 const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ak-prime-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)
}
function importData(e){
 const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const parsed=JSON.parse(r.result);if(!Array.isArray(parsed.clients))throw new Error();db=parsed;saveDB('Sauvegarde restaurée');state.view='dashboard';render()}catch(err){alert('Fichier de sauvegarde invalide.')}};r.readAsText(f)
}
render();
</script>
</body>
