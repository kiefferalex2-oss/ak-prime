name: AK PRIME - Agent de prospection

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check = base seulement ; research = recherche seule ; run = réponses, recherche et envois autorisés'
        required: true
        default: check
        type: choice
        options: [check, research, run]
  schedule:
    - cron: '23 * * * *'

permissions:
  contents: read

concurrency:
  group: akprime-prospection
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROSPECTION_SUPABASE_SERVICE_KEY: ${{ secrets.PROSPECTION_SUPABASE_SERVICE_KEY }}
      PROSPECTION_OPENAI_API_KEY: ${{ secrets.PROSPECTION_OPENAI_API_KEY }}
      PROSPECTION_OVH_PASSWORD: ${{ secrets.PROSPECTION_OVH_PASSWORD }}
      AGENT_MODE: ${{ inputs.mode || 'run' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Charger le code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Vérifier la configuration minimale
        id: config
        shell: bash
        run: |
          if [ -z "$PROSPECTION_SUPABASE_SERVICE_KEY" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Agent non connecté : configurer les secrets GitHub. Aucun envoi.'
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Exécuter le passage
        if: steps.config.outputs.ready == 'true'
        run: python3 tools/prospection/agent.py --mode "$AGENT_MODE"
