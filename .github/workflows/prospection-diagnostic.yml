name: AK PRIME - Test OVH sans envoi
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: akprime-prospection
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PROSPECTION_SUPABASE_SERVICE_KEY: ${{ secrets.PROSPECTION_SUPABASE_SERVICE_KEY }}
      PROSPECTION_OVH_PASSWORD: ${{ secrets.PROSPECTION_OVH_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verifier les connexions SMTP et IMAP sans envoyer de message
        run: |
          python3 - <<'PY'
          import os, ssl, smtplib, imaplib, sys
          sys.path.insert(0, 'tools/prospection')
          from agent import Database
          db = Database()
          phase = 'SMTP'
          try:
              password = os.environ['PROSPECTION_OVH_PASSWORD']
              with smtplib.SMTP_SSL('smtp.mail.ovh.net',465,context=ssl.create_default_context(),timeout=30) as smtp:
                  smtp.login('contact@akprime.fr',password)
                  smtp.noop()
              phase = 'IMAP'
              with imaplib.IMAP4_SSL('imap.mail.ovh.net',993,ssl_context=ssl.create_default_context(),timeout=30) as inbox:
                  inbox.login('contact@akprime.fr',password)
                  if inbox.select('INBOX',readonly=True)[0] != 'OK':
                      raise RuntimeError('Inbox inaccessible')
              db.heartbeat('Connexions OVH SMTP et IMAP vérifiées. Aucun mail envoyé ; agent en pause.')
              print('SMTP et IMAP vérifiés. Aucun message envoyé ou modifié. Aucun appel IA.')
          except Exception as exc:
              db.heartbeat('Test OVH échoué : '+phase+' / '+type(exc).__name__+'. Aucun mail envoyé.')
              print('Échec connexion '+phase+' : '+type(exc).__name__,file=sys.stderr)
              raise SystemExit(1)
          PY
